---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: spdkcsi-pvc2
  annotations:
    # Pin this volume's backing logical volume to a specific storage node.
    # The value must be a valid storage-node UUID in the volume's cluster; the
    # validating webhook rejects an unknown UUID at write time. Changing the
    # value triggers a VolumeMigration onto the new node.
    # Replace with a real storage-node UUID from your cluster.
    simplyblock.io/pinned-volume: "5cbe989e-ff32-4d65-a0c2-9250c42a3112"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: simplyblock-default-simplyblock-cluster-pool1-xfs
---
kind: Pod
apiVersion: v1
metadata:
  name: spdkcsi-test2
spec:
  containers:
    - name: alpine
      image: alpine:3
      imagePullPolicy: "IfNotPresent"
      command: ["sleep", "365d"]
      volumeMounts:
        - mountPath: "/spdkvol"
          name: spdk-volume
  volumes:
    - name: spdk-volume
      persistentVolumeClaim:
        claimName: spdkcsi-pvc2
