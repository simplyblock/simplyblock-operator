# Generated client for the simplyblock control-plane v2 API.
# The non-/api/v2 paths (legacy /{resource}/{full_path} catch-all proxies
# and the root redirect) are excluded, because they are not part of the typed v2
# surface and their {full_path} param is undeclared in the spec.
package: cpapi
output: cpapi.gen.go
generate:
  models: true
  client: true
output-options:
  # No overlay: nothing in the export needs patching. When something does, an
  # OpenAPI Overlay 1.0.0 document patches it by JSONPath rather than by editing
  # the vendored openapi.json, so a re-export stays a clean diff. Wire one back
  # with an `overlay: {path: overlay.yaml}` key here, holding a document shaped
  # like this, which is the one that fixed the migrations-list operation before
  # the control plane restructured that endpoint and declared its parameters:
  #
  #   overlay: 1.0.0
  #   info:
  #     title: Fixups for the simplyblock control-plane OpenAPI export
  #     version: 0.0.0
  #   actions:
  #     # This operation's URL has three path parameters and it declares one,
  #     # so oapi-codegen rejects it. Add the two that are missing.
  #     - target: "$.paths['/api/v2/.../volumes/{volume_id}/migrations/'].get.parameters"
  #       update:
  #         - name: pool_id
  #           in: path
  #           required: true
  #           schema:
  #             type: string
  #             format: uuid
  #
  # An overlay is applied strictly, which cuts both ways: a selector that
  # matches nothing fails the build, so a fixup outlives its bug loudly rather
  # than silently, and it must define at least one action, so the file cannot be
  # kept around empty as a placeholder.
  exclude-operation-ids:
    - redirect_legacy__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_storagenode__full_path__get
    - redirect_legacy_storagenode__full_path__get
    - redirect_legacy_storagenode__full_path__get
    - redirect_legacy_storagenode__full_path__get
