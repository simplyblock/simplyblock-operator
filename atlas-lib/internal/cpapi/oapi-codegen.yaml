# Generated client for the simplyblock control-plane v2 API.
# The non-/api/v2 paths (legacy /{resource}/{full_path} catch-all proxies
# and the root redirect) are excluded, because they are not part of the typed v2
# surface and their {full_path} param is undeclared in the spec.
package: cpapi
output: cpapi.gen.go
generate:
  models: true
  client: true
output-options:
  # overlay.yaml names ClusterParams.kms_settings's inline oneOf as its own
  # KMSSettings schema -- see that file for why. An OpenAPI Overlay 1.0.0
  # document patches the spec by JSONPath rather than by editing the vendored
  # openapi.json, so a re-export stays a clean diff.
  #
  # An overlay is applied strictly: a selector that matches nothing fails the
  # build, so a fixup outlives its bug loudly rather than silently, and it must
  # define at least one action, so the file cannot be kept around empty as a
  # placeholder.
  overlay:
    path: overlay.yaml
  exclude-operation-ids:
    - redirect_legacy__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_cluster__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_device__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_lvol__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_mgmtnode__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_pool__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_snapshot__full_path__get
    - redirect_legacy_storagenode__full_path__get
    - redirect_legacy_storagenode__full_path__get
    - redirect_legacy_storagenode__full_path__get
    - redirect_legacy_storagenode__full_path__get
