syntax = "proto3";

// Package atlas.nfsexport.v1 carries pNFS export assembly to the host that
// serves it.
//
// Unlike atlas.storage.v1, which is read-only by construction, everything here
// mutates the node: it makes filesystems, mounts them, and publishes them. That
// is why it is a separate service rather than more methods on the storage one --
// a credential can be granted the reading and not the writing.
//
// The operator is the only caller. No consuming pod runs on the host that serves
// an export, so kubelet never issues a stage for it and something else has to
// ask; this is that something.
package atlas.nfsexport.v1;

option go_package = "github.com/simplyblock/atlas/nfsexport/nfsexportrpc/nfsexportv1;nfsexportv1";

// ExportService assembles and tears down exports on the node it runs on. Both
// calls are idempotent, because the caller is a reconciler and will make them
// again.
service ExportService {
  // CreateExport assembles the export: find the device, make a filesystem only
  // if the device is blank, mount it, and publish it. Re-running it over a
  // finished export changes nothing on the host.
  rpc CreateExport(CreateExportRequest) returns (CreateExportResponse);

  // DeleteExport tears it down in reverse. An export that is already gone is
  // success, not an error, because the caller is a finalizer and has to
  // converge.
  rpc DeleteExport(DeleteExportRequest) returns (DeleteExportResponse);

  // CheckExport reports whether the export is actually being served: nfsd has
  // threads running, the filesystem this export sits on is mounted, and
  // nfsd's own table publishes it. It changes nothing on the host -- a probe
  // that could repair what it finds broken would be a second, undeclared path
  // to the same mutations CreateExport already owns.
  rpc CheckExport(CheckExportRequest) returns (CheckExportResponse);

  // Reports what a byte range of one file in an export is made of: data,
  // unwritten, delalloc, or hole. Read-only, for diagnosing a range that read
  // back as zeros.
  rpc FileExtents(FileExtentsRequest) returns (FileExtentsResponse);
}

// ExportSpec is one export: which device, where it goes, and who may mount it.
// It mirrors export.Spec field for field.
message ExportSpec {
  // volume_uuid identifies the backing namespace: for a simplyblock volume the
  // namespace UUID is the logical volume's own id. It is the identifier rather
  // than a device path because a path is assigned in attach order and differs
  // across hosts, while this is a property of the namespace.
  //
  // It is the UUID rather than the NGUID because the UUID is what the control
  // plane knows when it provisions; the NGUID is assigned by the target and
  // read back from the device.
  string volume_uuid = 1;

  // path is the mount point and the exported directory.
  string path = 2;

  // fsid is what the export is published under. Holding it stable across hosts
  // is what lets a re-materialized export reproduce the file handles clients
  // already hold.
  string fsid = 3;

  // clients is the set allowed to mount, as exports(5) spells it. An empty set
  // is refused rather than widened to everyone.
  repeated string clients = 4;

  // cluster_id and pool_id identify the volume to the control plane, which is
  // what the host needs to ask where the namespace is served from and to be
  // allowed to connect to it. They do not find the device -- volume_uuid does
  // that -- and a host that does not attach its own namespaces ignores them.
  string cluster_id = 5;
  string pool_id = 6;

  // encrypted tells the assembler to open the backing namespace before
  // inspecting or formatting its filesystem.
  bool encrypted = 7;

  // host_nqn is the NVMe host identity to attach the namespace as, when the
  // caller decides it: a pNFS metadata server pod is one host across
  // restarts, which its own kernel cannot know. Empty lets the host derive
  // its own.
  string host_nqn = 8;

  // connection is where the namespace is served from, resolved by the caller
  // for a host that cannot reach the control plane itself. Absent leaves
  // resolving it to the host. It carries DHCHAP secrets, so it is sent only
  // from the metadata server pod to its own guest, never by the operator.
  Connection connection = 9;
}

// Connection mirrors lvol.Connection: the subsystem and the paths to it, in the
// control plane's priority order.
message Connection {
  string nqn = 1;
  uint32 nsid = 2;
  string uuid = 3;
  repeated Endpoint endpoints = 4;
}

// Endpoint mirrors lvol.Endpoint, one path to the subsystem. The two timeouts
// are optional because zero ("fail at once") and unset ("the connector's
// default") behave differently.
message Endpoint {
  string transport = 1;
  string address = 2;
  int32 port = 3;
  int32 nr_io_queues = 4;
  int32 reconnect_delay_sec = 5;
  int32 keep_alive_tmo_sec = 6;
  optional int32 ctrl_loss_tmo_sec = 7;
  optional int32 fast_io_fail_tmo_sec = 8;
  string host_iface = 9;
  bool tls = 10;
  string dhchap_secret = 11;
  string dhchap_ctrl_secret = 12;
}

message CreateExportRequest {
  ExportSpec spec = 1;
}

message CreateExportResponse {}

message DeleteExportRequest {
  ExportSpec spec = 1;
}

message DeleteExportResponse {}

message CheckExportRequest {
  ExportSpec spec = 1;
}

message CheckExportResponse {
  // healthy is false whenever the node found a reason the export is not
  // actually being served. reason says which.
  bool healthy = 1;
  string reason = 2;
}

message FileExtentsRequest {
  // The export's path, as in ExportSpec.path.
  string export_path = 1;
  // A file directly inside the export, by name.
  string file = 2;
  uint64 offset = 3;
  uint64 length = 4;
}

message FileExtentsResponse {
  // The file's size as the server knows it.
  uint64 size = 1;
  repeated ExtentPiece pieces = 2;
}

message ExtentPiece {
  uint64 offset = 1;
  uint64 length = 2;
  // written, unwritten, delalloc, or hole.
  string kind = 3;
  // Device offset of the first byte of the piece. Zero for a hole or delalloc.
  uint64 physical = 4;
}
