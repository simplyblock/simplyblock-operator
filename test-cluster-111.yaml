---
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageCluster
metadata:
  name: simplyblock-cluster
  namespace: default
spec:
  enableNodeAffinity: false
  maxSubsystemCount: 10
  vcpuCount: 6
  volumeMigrationSettings:
    # There is no enabled switch at v1alpha2. Migration cannot be turned off,
    # because a drain, a rebalance, and a device replacement are all performed
    # by moving volumes (design-storagecluster.md §3.1).
    #
    # rebalancerImage is used for the migration path-validation Job (must include nvme-cli).
    #
    # This tag must track the branch the operator itself is deployed from. The Job runs a
    # *different* binary than the operator, so a stale tag here silently pairs a current
    # operator with an old validator — the operator still fans the Jobs out per node while
    # the Job inside them runs whatever that tag was built from. Nothing in the logs states
    # the mismatch; it only shows up as the Job's log format not matching the code.
    rebalancerImage: docker.io/simplyblock/simplyblock-rebalancer:multi-namespace-volume-migration
  # Automatic, latency-driven rebalancing. Whether it runs at all is the
  # top-level switch; the block below only tunes it, and migrationEnabled is
  # now spelled as the disable it inverts, so leaving it out is the dry run
  # turned off.
  #enableVolumeAutoPlacement: true
  #volumeAutoPlacement:
  #  enableLatencyBenchmark: true
  #  disableMigration: false
  #  metricsBackend: Prometheus
  #  prometheusURL: http://simplyblock-prometheus.simplyblock:9090
  warningThreshold:
    capacity: 80
    provisionedCapacity: 100
  criticalThreshold:
    capacity: 90
    provisionedCapacity: 100
---
apiVersion: storage.simplyblock.io/v1alpha1
kind: StorageNodeSet
metadata:
  name: simplyblock-node
  namespace: default
spec:
  clusterName: simplyblock-cluster
  # Stated explicitly because the ControlPlane fallback cannot be read: the
  # operator resolves it through the v1alpha1 ControlPlane, which now needs the
  # conversion webhook that is not deployed here.
  # clusterImage: "public.ecr.aws/simply-block/simplyblock:main"
  # spdkImage: "public.ecr.aws/simply-block/ultra:debuge-migration-latest"   # the SPDK container
  skipKubeletConfiguration: false
  enableCpuTopology: false
  socketsToUse:
    - "0"
  mgmtIfname: eth0
  workerNodes:
    - vm02.simplyblock4.localdomain
    - vm03.simplyblock4.localdomain
    - vm04.simplyblock4.localdomain
---
apiVersion: storage.simplyblock.io/v1alpha2
kind: StoragePool
metadata:
  name: pool1
  namespace: default
spec:
  clusterRef: simplyblock-cluster
---
# The CSI driver. The chart used to render the node DaemonSet, the controller
# StatefulSet, their RBAC, the node ConfigMaps, and the CSIDriver registration
# directly. It renders none of them now, and this object is what the operator
# turns into all eighteen.
#
# It lives in the operator's namespace rather than beside the StorageCluster
# above. The plugins mount simplyblock-csi-secret-v2, which the StorageCluster
# reconciler writes into the operator's namespace, so a driver deployed anywhere
# else comes up with no credentials to reach the control plane with.
#
# The name is "simplyblock" because the operator derives every object it applies
# as <name>-csi-<component>. That reproduces the names the chart wrote literally,
# which is what lets an already-running deployment be taken over in place rather
# than deleted and rebuilt.
#
# It names no image on purpose. Unset takes the operator's own registry and tag
# with the CSI driver's repository, so the driver follows the operator
# reconciling it and an operator upgrade carries it forward without a second
# edit here. That needs the chart to have set SB_OPERATOR_IMAGE on the
# operator's deployment; an operator deployed before that was added reports
# NoImage and wants spec.image stated.
apiVersion: storage.simplyblock.io/v1alpha2
kind: SimplyblockDriver
metadata:
  name: simplyblock
  namespace: simplyblock
spec: {}
