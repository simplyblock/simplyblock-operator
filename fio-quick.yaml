# Quick standalone fio Deployment — mirrors a single fio_migration_test.py workload pod.
# Uses the existing XFS StorageClass cloned from the live pool by the test harness.
#
#   kubectl -n default apply -f test/fio-quick.yaml
#   kubectl -n default logs -f deploy/fio-quick                          # live eta status
#   kubectl -n default exec deploy/fio-quick -- cat /logs/result.json    # final JSON after run
#   kubectl -n default delete -f test/fio-quick.yaml                     # cleanup (Deployment + PVC)
#
# NOTE: the simplyblock volume is ReadWriteOnce, so this Deployment is pinned to
# replicas: 1 — a single PVC cannot be mounted by multiple pods. For N independent
# fio volumes, use a StatefulSet with volumeClaimTemplates instead.
#
# Knobs match fio_migration_test.py defaults: 4k randrw 70/30, iodepth 16, numjobs 4,
# direct=1/libaio, time_based 600s, 1 GiB file on the simplyblock XFS volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fio-quick-pvc
  labels:
    app: fio-quick

spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: simplyblock-default-simplyblock-cluster-pool1-xfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fio-quick
  labels: { app: fio-quick }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fio-quick }
  strategy:
    type: Recreate # RWO PVC: old pod must release the volume before the new one mounts
  template:
    metadata:
      labels: { app: fio-quick }
    spec:
      terminationGracePeriodSeconds: 5
      # keep off control-plane nodes (same intent as the test's worker pinning)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: fio
          image: alpine:3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -u
              echo "[pod] $(date -u +%FT%TZ) installing fio"
              apk add --no-cache fio >/dev/null 2>&1 || { echo "[pod] apk add fio FAILED"; exit 90; }
              mkdir -p /logs
              echo "[pod] $(date -u +%FT%TZ) starting fio"
              fio \
                --name=fiotest \
                --filename=/data/fiotest \
                --size=1G \
                --ioengine=libaio \
                --direct=1 \
                --rw=randrw \
                --rwmixread=70 \
                --bs=4k \
                --iodepth=16 \
                --numjobs=4 \
                --group_reporting \
                --time_based \
                --runtime=1200 \
                --continue_on_error=all \
                --percentile_list=50:95:99:99.9 \
                --write_iops_log=/logs/iops \
                --write_lat_log=/logs/lat \
                --write_bw_log=/logs/bw \
                --log_avg_msec=1000 \
                --eta=always \
                --eta-newline=5 \
                --output=/logs/result.json \
                --output-format=json
              rc=$?
              echo "$rc" > /logs/fio.rc
              echo "[pod] $(date -u +%FT%TZ) fio exited rc=$rc"
              # keep the container alive so logs can be collected after the run
              sleep 100000
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: fio-quick-pvc }
        - name: logs
          emptyDir: {}
