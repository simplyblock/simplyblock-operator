# The simplyblock fleet add-on, as an Open Cluster Management AddOnTemplate.
#
# Generated by hack/gen-addon from internal/guard and internal/agent. Do not edit: run
# `make addon-manifests` and commit the result.
#
# The template is what a member actually receives. OCM's own addon-manager
# renders it into a ManifestWork per enrolled member, so the add-on needs no
# hub-side controller of ours and no second delivery mechanism beside the one the
# deployments already use.
#
# It carries the admission guard and the fleet agent. The agent is the site's end
# of the site link: it links to the relay on the hub with a token for the site
# link's ServiceAccount in the member's namespace there, which its KubeClient
# registration lets it request and nothing else.
#
# The allowlist here is the default one. A member whose operator runs somewhere
# the default does not name receives a composed list instead, delivered in the
# same payload.
#
# Nothing here reaches a standalone installation. A standalone cluster runs no
# add-on, so it receives no policy, and its admission configuration is what it
# was before a fleet existed.
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: AddOnTemplate
metadata:
  name: simplyblock-fleet-0.1.0
spec:
  addonName: simplyblock-fleet
  agentSpec:
    workload:
      manifests:
      - apiVersion: v1
        data:
          allowedGroups: |-
            system:serviceaccounts:open-cluster-management-agent-addon,
            simplyblock:break-glass
          allowedUsers: |-
            system:serviceaccount:simplyblock:simplyblock-operator,
            system:serviceaccount:simplyblock-system:simplyblock-operator,
            system:serviceaccount:simplyblock-operator-system:simplyblock-operator-controller-manager,
            system:serviceaccount:open-cluster-management-agent:klusterlet-work-sa,
            system:serviceaccount:kube-system:generic-garbage-collector,
            system:serviceaccount:kube-system:namespace-controller
        kind: ConfigMap
        metadata:
          name: simplyblock-storage-guard
          namespace: open-cluster-management-agent-addon
      - apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        metadata:
          name: simplyblock-storage-guard
        spec:
          auditAnnotations:
          - key: denied-requester
            valueExpression: 'variables.isAllowed ? '''' : request.userInfo.username'
          failurePolicy: Fail
          matchConstraints:
            resourceRules:
            - apiGroups:
              - storage.simplyblock.io
              apiVersions:
              - '*'
              operations:
              - CREATE
              - UPDATE
              - DELETE
              resources:
              - '*'
          paramKind:
            apiVersion: v1
            kind: ConfigMap
          validations:
          - expression: variables.isAllowed
            messageExpression: '''in a fleet-managed cluster the storage.simplyblock.io
              group is written by the fleet, the operator, and nothing else. '' +
              request.userInfo.username + '' is not in the allowlist'''
            reason: Forbidden
          variables:
          - expression: '(''allowedUsers'' in params.data ? params.data[''allowedUsers'']
              : '''').split('','').map(u, u.trim()).filter(u, u != '''')'
            name: allowedUsers
          - expression: '(''allowedGroups'' in params.data ? params.data[''allowedGroups'']
              : '''').split('','').map(g, g.trim()).filter(g, g != '''')'
            name: allowedGroups
          - expression: request.userInfo.username in variables.allowedUsers || variables.allowedGroups.exists(g,
              g in request.userInfo.groups)
            name: isAllowed
        status: {}
      - apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicyBinding
        metadata:
          name: simplyblock-storage-guard
        spec:
          paramRef:
            name: simplyblock-storage-guard
            namespace: open-cluster-management-agent-addon
            parameterNotFoundAction: Deny
          policyName: simplyblock-storage-guard
          validationActions:
          - Deny
          - Audit
      - apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicy
        metadata:
          name: simplyblock-storage-guard-self
        spec:
          auditAnnotations:
          - key: denied-requester
            valueExpression: 'variables.isAllowed ? '''' : request.userInfo.username'
          failurePolicy: Fail
          matchConstraints:
            resourceRules:
            - apiGroups:
              - ""
              apiVersions:
              - v1
              operations:
              - CREATE
              - UPDATE
              - DELETE
              resourceNames:
              - simplyblock-storage-guard
              resources:
              - configmaps
          validations:
          - expression: variables.isAllowed
            messageExpression: '''the simplyblock admission guard\''s allowlist is
              the fleet\''s to change. '' + request.userInfo.username + '' is not
              the fleet'''
            reason: Forbidden
          variables:
          - expression: request.userInfo.username in ['system:serviceaccount:open-cluster-management-agent:klusterlet-work-sa']
              || 'simplyblock:break-glass' in request.userInfo.groups
            name: isAllowed
        status: {}
      - apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicyBinding
        metadata:
          name: simplyblock-storage-guard-self
        spec:
          policyName: simplyblock-storage-guard-self
          validationActions:
          - Deny
          - Audit
      - apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: simplyblock-fleet-agent
          namespace: open-cluster-management-agent-addon
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: simplyblock-fleet-agent
        rules:
        - apiGroups:
          - authentication.k8s.io
          resources:
          - tokenreviews
          verbs:
          - create
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: simplyblock-fleet-agent
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: simplyblock-fleet-agent
        subjects:
        - kind: ServiceAccount
          name: simplyblock-fleet-agent
          namespace: open-cluster-management-agent-addon
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: simplyblock-fleet-agent
          namespace: open-cluster-management-agent-addon
        rules:
        - apiGroups:
          - ""
          resources:
          - configmaps
          verbs:
          - get
          - create
          - update
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: simplyblock-fleet-agent
          namespace: open-cluster-management-agent-addon
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: simplyblock-fleet-agent
        subjects:
        - kind: ServiceAccount
          name: simplyblock-fleet-agent
          namespace: open-cluster-management-agent-addon
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: simplyblock-fleet-agent-ca-reader
          namespace: open-cluster-management-agent-addon
        rules:
        - apiGroups:
          - ""
          resourceNames:
          - simplyblock-site-link-ca
          resources:
          - configmaps
          verbs:
          - get
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: simplyblock-fleet-agent-ca-reader
          namespace: open-cluster-management-agent-addon
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: simplyblock-fleet-agent-ca-reader
        subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: system:serviceaccounts
      - apiVersion: v1
        kind: Service
        metadata:
          name: simplyblock-site-link
          namespace: open-cluster-management-agent-addon
        spec:
          ports:
          - name: site-link
            port: 9443
            targetPort: 9443
          selector:
            app: simplyblock-fleet-agent
        status:
          loadBalancer: {}
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          labels:
            app: simplyblock-fleet-agent
          name: simplyblock-fleet-agent
          namespace: open-cluster-management-agent-addon
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: simplyblock-fleet-agent
          strategy: {}
          template:
            metadata:
              labels:
                app: simplyblock-fleet-agent
            spec:
              containers:
              - args:
                - --hub-kubeconfig={{HUB_KUBECONFIG}}
                command:
                - /fleet-agent
                env:
                - name: CLUSTER_NAME
                  value: '{{CLUSTER_NAME}}'
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                image: quay.io/simplyblock-io/simplyblock-fleet:0.1.0
                name: agent
                ports:
                - containerPort: 9443
                  name: site-link
                resources: {}
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - ALL
                  runAsNonRoot: true
              serviceAccountName: simplyblock-fleet-agent
        status: {}
  registration:
  - kubeClient:
      hubPermissions:
      - currentCluster:
          clusterRoleName: simplyblock-site-link-agent
        type: CurrentCluster
    type: KubeClient
