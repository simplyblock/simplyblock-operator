---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: fleetoperations.fleet.simplyblock.io
spec:
  group: fleet.simplyblock.io
  names:
    kind: FleetOperation
    listKind: FleetOperationList
    plural: fleetoperations
    shortNames:
    - fop
    singular: fleetoperation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.memberRef
      name: Member
      type: string
    - jsonPath: .status.target.kind
      name: Kind
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.remote.phase
      name: Remote
      type: string
    - jsonPath: .status.remote.step
      name: Step
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FleetOperation ships one storage-group Ops object into one member and reports
          what it does there. One kind rather than one per managed Ops kind, because the
          hub's question is which member and which operation, and the parameters belong
          to the kind whose spec it carries.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FleetOperationSpec is a request, and every field but Abort
              is immutable.
            properties:
              abort:
                description: |-
                  Abort asks the member's own object to stop, by setting spec.abort on it
                  through the payload. It is the one mutable field on this spec, and the
                  member's graph decides whether the step it is on accepts it.
                type: boolean
              memberRef:
                description: MemberRef names the FleetMember the operation runs in.
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              operation:
                description: Operation is what to run there. Exactly one member is
                  set.
                properties:
                  operatorOps:
                    description: OperatorOps runs an operator-level operation, today
                      a discovery run.
                    properties:
                      abort:
                        description: |-
                          Abort asks a running operation to stop at its next step and unwind.
                          Whether an abort is expressible from the current step is declared by that
                          action's graph rather than checked here. Discovery changes nothing, so an
                          aborted run leaves behind at most the config it had already written.
                        type: boolean
                      action:
                        description: Action is the operation to perform.
                        enum:
                        - Discover
                        type: string
                        x-kubernetes-validations:
                        - message: field is immutable
                          rule: self == oldSelf
                      discover:
                        description: Discover parameterizes action Discover.
                        properties:
                          clusterRef:
                            description: |-
                              ClusterRef names an existing StorageCluster the draft grows rather than
                              creates. It is copied to the draft's own clusterRef, so that re-running
                              discovery after an expansion produces a growth document naming the same
                              cluster.

                              Bounded at what a StorageCluster name may be, since a longer value names
                              nothing that can exist.
                            maxLength: 63
                            type: string
                          configName:
                            description: |-
                              ConfigName is the ClusterDeploymentConfig to write. Absent generates one
                              from the run's timestamp, so that a second discovery never overwrites the
                              first, which may have been reviewed and corrected.
                            type: string
                          deviceFilter:
                            description: |-
                              DeviceFilter narrows which of an inspected worker's devices reach the
                              draft. Empty reports every device the worker advertises, including the one
                              it boots from, which is what the approval gate then has to catch.
                            properties:
                              blockAllowList:
                                description: |-
                                  BlockAllowList restricts candidates to these device paths ("/dev/sdb").
                                  This and BlockDenyList are the block class's half of the filter, and they
                                  require EnableLogicalBlockDevices for the same reason the PCI filters
                                  forbid it.
                                items:
                                  pattern: ^/dev/[a-zA-Z0-9._/-]+$
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              blockDenyList:
                                description: |-
                                  BlockDenyList excludes these device paths. On a fleet that boots from
                                  /dev/sda, this is the one entry that keeps the root disk out of every group
                                  of every draft.
                                items:
                                  pattern: ^/dev/[a-zA-Z0-9._/-]+$
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              driveSizeRange:
                                description: |-
                                  DriveSizeRange restricts candidates by size ("100G-2T"). Unlike the
                                  per-class filters, it applies to whichever class the run is scanning.
                                type: string
                              pcieAllowList:
                                description: |-
                                  PcieAllowList restricts candidates to these PCI addresses. This and the two
                                  PCI filters below narrow the NVMe class alone, because a logical block
                                  device has no PCI address to match, so setting any of them on a run that
                                  scans the block class is rejected by the rule on this type.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              pcieDenyList:
                                description: |-
                                  PcieDenyList excludes these PCI addresses. On a fleet that is uniform
                                  about which slot holds the boot device, this is what keeps that device out
                                  of every group of every draft.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: set
                              pcieModel:
                                description: PcieModel restricts candidates to devices
                                  whose PCI model string matches.
                                type: string
                            type: object
                          enableControlPlaneNodes:
                            description: |-
                              EnableControlPlaneNodes lets the run consider machines that run the API
                              server and etcd.

                              It is off by default because a storage node is a data path, and putting one
                              on an etcd host is a placement almost nobody intends. The approval gate is a
                              poor place to catch it: a fifty-worker draft is not a document anybody reads
                              closely enough to spot three control-plane nodes in it. A combined three-node
                              or single-node deployment is the case that wants it, and those are set up
                              deliberately.

                              There is no field beside it for infrastructure nodes, because those are used
                              without asking: an OpenShift infra node is the tier a cluster's own
                              infrastructure runs on, and simplyblock storage is infrastructure. A fleet
                              with disks in its infra nodes meant those disks to be the storage, so a draft
                              proposes them ahead of the workers rather than leaving them out.
                            type: boolean
                          enableFailureDomains:
                            description: |-
                              EnableFailureDomains overrides whether the draft proposes failure-domain
                              mode, which a run otherwise decides from the workers' topology: on when
                              every worker carries a failure-domain label in a layout the control plane
                              accepts, and off otherwise.

                              false turns the mode off and reads no failure domains at all, so a fleet
                              spread over zones it does not want treated as failure domains is grouped by
                              hardware alone, into one cluster the draft marks enableFailureDomains false.
                              true proposes the mode on; the layout still has to pass the control plane's
                              activation rules, which approval checks. Unset leaves the decision to the
                              run, and is the usual first run.
                            type: boolean
                          enableLogicalBlockDevices:
                            description: |-
                              EnableLogicalBlockDevices scans a worker's available logical block devices
                              instead of its available NVMe devices. It selects the class rather than
                              adding one, because the draft a run writes describes one cluster and a
                              cluster is built out of one class. Unset scans NVMe, so that upgrading to
                              26.4 does not change what a discovery run reports.

                              It is a statement about the run rather than a member of DeviceFilter,
                              because it does not narrow the devices reported: it decides which class of
                              them is looked at, which filters in DeviceFilter apply, and what
                              ForceJournalDevice resolves, since the two classes lay out a journal
                              differently.
                            type: boolean
                          enablePartitionedDevices:
                            description: |-
                              EnablePartitionedDevices reports devices carrying a partition table
                              alongside the available ones, for the administrator who knows the table is
                              stale and intends to hand the device over anyway. It is the only one of the
                              three availability conditions that can be waived: a mounted or otherwise
                              busy device is never reported, because simplyblock taking it would corrupt
                              whatever is using it.

                              It is a statement about the run rather than a member of DeviceFilter for
                              the reason EnableLogicalBlockDevices is: it waives an availability
                              condition for whichever class is scanned, and so widens what is reported,
                              where every member of the filter narrows it.
                            type: boolean
                          failureDomainLabel:
                            default: topology.kubernetes.io/zone
                            description: |-
                              FailureDomainLabel is the Node label whose value becomes each worker's
                              failure domain in the draft, for fleets that label racks or power feeds.
                              Defaults to topology.kubernetes.io/zone. A worker without the label gets
                              no failure domain, and the run reports it. A value that is not a valid
                              failure domain is reported as well, naming the worker, and not used.
                            maxLength: 317
                            type: string
                          forceJournalDevice:
                            description: |-
                              ForceJournalDevice makes the run dedicate a journal device even where the
                              fleet's disks do not say which one.

                              A run proposes a dedicated journal device when every worker hands over one
                              disk smaller than its others, because a fleet built that way was built that
                              way on purpose. Where several disks share the smallest size, nothing says
                              which to take, and taking one spends a whole disk the fleet did not set
                              aside: on a worker with ten 10 TB disks that is 10 TB, silently. So the run
                              does not guess.

                              An NVMe cluster with no dedicated journal device carves a journal
                              partition out of every device, so the run leaves the field unset, says so,
                              and every disk stays storage. Setting this is what asks for one of the
                              equal disks to be taken anyway, and the draft says the disk was taken
                              rather than offered.

                              A logical block-device cluster never proposes a dedicated journal device
                              on its own: by default each storage node's journal is a partition carved
                              from its smallest device (the journal split), and every disk carries data.
                              For that class, setting this dedicates the smallest disk of every node to
                              the journal, provided every worker hands over at least two disks.

                              It does not force the cases that are impossible rather than ambiguous. A
                              worker handing over a single disk is refused with it or without it, because
                              dedicating that disk leaves the worker nothing to store on, and so is a
                              worker whose disks report no size. The tie it does resolve is broken by
                              address, ascending, so two runs over one unchanged fleet propose the same
                              document.
                            type: boolean
                          images:
                            description: |-
                              Images are the container images the draft pins, copied into its
                              spec.images, so that an installation testing an SPDK or SPDK proxy build
                              states it once rather than editing every draft before approving it.
                              Unstated, each takes the default the draft's own field documents.
                            properties:
                              nodeAgent:
                                description: |-
                                  NodeAgent is the image the storage-node DaemonSet runs: the agent the
                                  control plane drives a worker through, and the two init containers that
                                  configure the host before it starts. The expansion writes it to
                                  StorageCluster.spec.storageNodes, which is where the retired
                                  StorageNodeSet.spec.clusterImage went.

                                  It is the same artifact the control plane itself runs, which is why
                                  spec.storageNodes.image defaults to the ControlPlane singleton's: the agent
                                  and the tasks that call it are one codebase, and version skew between them
                                  is what breaks a node add.

                                  It is spent only where the document creates the cluster. A document that
                                  names an existing one in ClusterRef adds nodes to a DaemonSet that is
                                  already running under an image the cluster states, and this slot is ignored
                                  the same way Cluster is.
                                properties:
                                  image:
                                    description: |-
                                      Image is the repository and tag, optionally digest-pinned. An empty value
                                      is not written downstream, so the field it would fill keeps its own
                                      default rather than being overridden with nothing.

                                      Every image field in this API is held to the same reference format and
                                      to no particular registry, so an air-gapped deployment can name its own
                                      mirror.
                                    pattern: ^($|(([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[a-fA-F0-9:]+\])(:[0-9]+)?/)?[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*(:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}(@sha256:[a-f0-9]{64})?|@sha256:[a-f0-9]{64}))$
                                    type: string
                                  imagePullPolicy:
                                    default: Always
                                    description: |-
                                      ImagePullPolicy is when that image is pulled. It defaults to Always,
                                      because every image this product ships by default is a moving tag and a
                                      node brought up after a release otherwise runs what its kubelet held.
                                    enum:
                                    - Always
                                    - Never
                                    - IfNotPresent
                                    type: string
                                type: object
                              spdk:
                                description: |-
                                  SPDK is the SPDK image, which the expansion writes onto every
                                  StorageNode.spec.config it creates rather than onto the cluster: the field
                                  is per node so that a later rollout can walk the fleet one machine at a
                                  time, and a document states the fleet's starting point.
                                properties:
                                  image:
                                    description: |-
                                      Image is the repository and tag, optionally digest-pinned. An empty value
                                      is not written downstream, so the field it would fill keeps its own
                                      default rather than being overridden with nothing.

                                      Every image field in this API is held to the same reference format and
                                      to no particular registry, so an air-gapped deployment can name its own
                                      mirror.
                                    pattern: ^($|(([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[a-fA-F0-9:]+\])(:[0-9]+)?/)?[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*(:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}(@sha256:[a-f0-9]{64})?|@sha256:[a-f0-9]{64}))$
                                    type: string
                                  imagePullPolicy:
                                    default: Always
                                    description: |-
                                      ImagePullPolicy is when that image is pulled. It defaults to Always,
                                      because every image this product ships by default is a moving tag and a
                                      node brought up after a release otherwise runs what its kubelet held.
                                    enum:
                                    - Always
                                    - Never
                                    - IfNotPresent
                                    type: string
                                type: object
                              spdkProxy:
                                description: SPDKProxy is the SPDK proxy image, written
                                  per node for the reason SPDK is.
                                properties:
                                  image:
                                    description: |-
                                      Image is the repository and tag, optionally digest-pinned. An empty value
                                      is not written downstream, so the field it would fill keeps its own
                                      default rather than being overridden with nothing.

                                      Every image field in this API is held to the same reference format and
                                      to no particular registry, so an air-gapped deployment can name its own
                                      mirror.
                                    pattern: ^($|(([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[a-fA-F0-9:]+\])(:[0-9]+)?/)?[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*(:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}(@sha256:[a-f0-9]{64})?|@sha256:[a-f0-9]{64}))$
                                    type: string
                                  imagePullPolicy:
                                    default: Always
                                    description: |-
                                      ImagePullPolicy is when that image is pulled. It defaults to Always,
                                      because every image this product ships by default is a moving tag and a
                                      node brought up after a release otherwise runs what its kubelet held.
                                    enum:
                                    - Always
                                    - Never
                                    - IfNotPresent
                                    type: string
                                type: object
                              talosctl:
                                description: |-
                                  Talosctl is the talosctl image a Talos worker's node runs as a Job to
                                  reserve its huge pages through the Talos API. It is the fleet's, written
                                  to StorageCluster.spec.storageNodes.talosctlImage: one DaemonSet, one Job
                                  image. Unstated keeps the node agent's default; a deployment pins it to
                                  the cluster's Talos minor, or to a mirror on an air-gapped site. Read only
                                  for a document whose environment is Talos.
                                properties:
                                  image:
                                    description: |-
                                      Image is the repository and tag, optionally digest-pinned, on any
                                      registry. An empty value is not written downstream, so the field it would
                                      fill keeps its own default.
                                    pattern: ^($|[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]+)?/[a-z0-9][a-z0-9._/-]*:[a-zA-Z0-9][a-zA-Z0-9._-]*(@sha256:[a-f0-9]{64})?)$
                                    type: string
                                type: object
                            type: object
                          network:
                            description: |-
                              Network states the cluster network the draft proposes. Absent, a run
                              proposes spdkOnHostNetwork, binding the host's primary NIC on workers with
                              no additional interface. Set podNetwork: true to run the SPDK pods on the
                              pod network instead. A cluster's network is fixed once it is created.
                            properties:
                              data:
                                description: |-
                                  Data are the Multus networks the storage nodes serve volumes on, each a
                                  NetworkAttachmentDefinition the pod attaches to besides the pod network, which
                                  podNetwork must therefore state.
                                items:
                                  description: |-
                                    StorageNetwork is one data network a storage node's SPDK pod attaches to
                                    through a NetworkAttachmentDefinition.
                                  properties:
                                    networkAttachmentRef:
                                      description: |-
                                        NetworkAttachmentRef is the Multus NetworkAttachmentDefinition in the
                                        namespace of the storage cluster, and the key the nodes' addresses and
                                        status use. The pod attaches to it and takes the interface the definition's
                                        plugin creates.
                                      properties:
                                        addressPool:
                                          description: |-
                                            AddressPool is the range the operator takes each node's address on this
                                            network from. Unset, the network takes the address the NIC the definition
                                            moves holds on the worker.
                                          properties:
                                            first:
                                              description: |-
                                                First is the lowest address the operator may hand out. Unset, the range
                                                starts at the subnet's first host address. It is set together with Last.
                                              maxLength: 15
                                              pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                                              type: string
                                            last:
                                              description: |-
                                                Last is the highest address the operator may hand out. Unset, the range
                                                ends at the subnet's last host address. It is set together with First.
                                              maxLength: 15
                                              pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$
                                              type: string
                                            subnet:
                                              description: |-
                                                Subnet is the network's IPv4 subnet, such as 10.10.10.0/24. Its prefix
                                                length is the one each node's address carries.
                                              maxLength: 18
                                              pattern: ^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$
                                              type: string
                                          required:
                                          - subnet
                                          type: object
                                          x-kubernetes-validations:
                                          - message: first and last are set together
                                            rule: has(self.first) == has(self.last)
                                          - message: first and last must lie inside
                                              subnet
                                            rule: '!has(self.first) || (cidr(self.subnet).containsIP(ip(self.first))
                                              && cidr(self.subnet).containsIP(ip(self.last)))'
                                        name:
                                          description: Name is the definition's name.
                                          maxLength: 253
                                          minLength: 1
                                          type: string
                                      required:
                                      - name
                                      type: object
                                  required:
                                  - networkAttachmentRef
                                  type: object
                                maxItems: 8
                                type: array
                                x-kubernetes-list-type: atomic
                              podNetwork:
                                description: |-
                                  PodNetwork puts the SPDK pods on the cluster CNI's network. Alone, the pod's
                                  one interface carries the RPC and the data, and a Service in front of the pod
                                  is the address peers and clients hold, since the pod's own address changes on
                                  every restart. The control plane keeps the Service and the ports it carries.
                                  With data networks, the RPC stays on that interface and the data moves to the
                                  networks' interfaces, whose addresses are stable, so no Service is kept.
                                type: boolean
                              spdkOnHostNetwork:
                                description: |-
                                  SpdkOnHostNetwork runs the SPDK pods on the host network, where they bind
                                  host NICs. The NICs' names are not stated here, because a fleet's workers
                                  do not agree on what their NICs are called: each node names its own in
                                  its spec.config.dataInterfaces, which is allowed only in this mode.
                                type: boolean
                            type: object
                            x-kubernetes-validations:
                            - message: one of podNetwork and spdkOnHostNetwork must
                                be set
                              rule: (has(self.podNetwork) && self.podNetwork) || (has(self.spdkOnHostNetwork)
                                && self.spdkOnHostNetwork)
                            - message: podNetwork and spdkOnHostNetwork are exclusive
                              rule: '!(has(self.podNetwork) && self.podNetwork &&
                                has(self.spdkOnHostNetwork) && self.spdkOnHostNetwork)'
                            - message: 'data networks require podNetwork: true'
                              rule: '!has(self.data) || self.data.size() == 0 || (has(self.podNetwork)
                                && self.podNetwork)'
                            - message: data networks must name distinct NetworkAttachmentDefinitions
                              rule: '!has(self.data) || self.data.all(a, self.data.exists_one(b,
                                b.networkAttachmentRef.name == a.networkAttachmentRef.name))'
                          networkAttachment:
                            description: |-
                              NetworkAttachment attaches the proposed storage nodes through Multus
                              NetworkAttachmentDefinitions in the run's namespace instead of host
                              networking. Absent keeps host networking, and the draft names each
                              group's interfaces.

                              The draft names the definitions in place of interfaces, and a worker
                              whose host lacks the interface a definition builds on is left out with
                              the reason. A definition the namespace does not hold fails the run before
                              any worker is probed, naming the definitions the namespace does hold. A
                              cluster that does not serve the NetworkAttachmentDefinition kind keeps
                              host networking, and the run says so with a Warning event.
                            properties:
                              data:
                                description: |-
                                  Data is the definition the storage node's data traffic is attached
                                  through. Absent sends data through the management attachment.
                                maxLength: 253
                                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                type: string
                              management:
                                description: |-
                                  Management is the definition the storage node's management traffic is
                                  attached through.
                                maxLength: 253
                                minLength: 1
                                pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                type: string
                            required:
                            - management
                            type: object
                          nodeSelector:
                            additionalProperties:
                              type: string
                            description: |-
                              NodeSelector restricts which workers are inspected. Empty inspects every
                              schedulable worker, and it is exclusive with Workers.
                            type: object
                          tolerations:
                            description: |-
                              Tolerations are what the probe pods tolerate, and what the draft states
                              for the storage nodes it proposes.

                              A probe is pinned to its worker with spec.nodeName rather than scheduled
                              onto it, which bypasses the scheduler and not the taints: a NoSchedule
                              taint still keeps the pod off, and a NoExecute taint evicts one that
                              landed. A fleet that dedicates machines to storage taints them, so a run
                              against one that tolerates nothing inspects nothing. A worker carrying a
                              NoSchedule or NoExecute taint that none of these tolerates is not
                              inspected, and its WorkerDeclined event names that taint.

                              They reach the draft as well, because the taints a run was allowed to
                              probe through are the taints the cluster it proposes has to live with.
                              Stating them in one place is what keeps a reviewer from approving a
                              document whose DaemonSet schedules nowhere.
                            items:
                              description: |-
                                The pod this Toleration is attached to tolerates any taint that matches
                                the triple <key,value,effect> using the matching operator <operator>.
                              properties:
                                effect:
                                  description: |-
                                    Effect indicates the taint effect to match. Empty means match all taint effects.
                                    When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                                  type: string
                                key:
                                  description: |-
                                    Key is the taint key that the toleration applies to. Empty means match all taint keys.
                                    If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                                  type: string
                                operator:
                                  description: |-
                                    Operator represents a key's relationship to the value.
                                    Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                                    Exists is equivalent to wildcard for value, so that a pod can
                                    tolerate all taints of a particular category.
                                    Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                                  type: string
                                tolerationSeconds:
                                  description: |-
