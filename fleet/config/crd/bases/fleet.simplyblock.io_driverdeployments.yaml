    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DriverDeployment is the CSI driver one member should run. It is one object
          per member, so a fleet-wide rollout is a set of them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DriverDeploymentSpec is the driver payload for one member.
            properties:
              driver:
                description: Driver is the SimplyblockDriver spec that will be applied
                  in the member.
                properties:
                  controllerNodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      ControllerNodeSelector and ControllerTolerations place the controller
                      plugin. The unprefixed pair above is the node plugin's, because that
                      placement decides which workers can attach a volume, and this pair is
                      ordinary pod placement for the one workload that provisions them.
                    type: object
                  controllerReplicas:
                    default: 1
                    description: ControllerReplicas is the number of controller-plugin
                      instances.
                    format: int32
                    minimum: 1
                    type: integer
                  controllerResources:
                    description: |-
                      ControllerResources and NodeResources set requests and limits for the two
                      plugins. Unset enforces no limits.
                    properties:
                      claims:
                        description: |-
