                    type: object
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: |-
                      NodeSelector restricts which workers run the node plugin. Empty means
                      every schedulable worker, which is the usual case: a node that cannot
                      attach a volume cannot run a workload that needs one.
                    type: object
                  sidecarImages:
                    description: |-
                      SidecarImages overrides the six CSI sidecars, one field each. Unset takes
                      the version this operator release ships.
                    properties:
                      attacher:
                        description: Attacher is csi-attacher, on the controller plugin.
                        pattern: ^($|(quay\.io/simplyblock-io|docker\.io/simplyblock|public\.ecr\.aws/simply-block)/[a-z0-9][a-z0-9._-]*:[a-zA-Z0-9][a-zA-Z0-9._-]*(@sha256:[a-f0-9]{64})?)$
                        type: string
                      healthMonitor:
                        description: |-
                          HealthMonitor is csi-external-health-monitor-controller, on the
                          controller plugin.
                        pattern: ^($|(quay\.io/simplyblock-io|docker\.io/simplyblock|public\.ecr\.aws/simply-block)/[a-z0-9][a-z0-9._-]*:[a-zA-Z0-9][a-zA-Z0-9._-]*(@sha256:[a-f0-9]{64})?)$
                        type: string
                      nodeDriverRegistrar:
                        description: NodeDriverRegistrar is node-driver-registrar,
