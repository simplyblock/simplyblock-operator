apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: driverdeployments.fleet.simplyblock.io
spec:
  group: fleet.simplyblock.io
  names:
    kind: DriverDeployment
    listKind: DriverDeploymentList
    plural: driverdeployments
    shortNames:
    - dd
    singular: driverdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.memberRef
      name: Member
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.driver.image
