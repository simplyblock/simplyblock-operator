---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: fleetmembers.fleet.simplyblock.io
spec:
  group: fleet.simplyblock.io
  names:
    kind: FleetMember
    listKind: FleetMemberList
    plural: fleetmembers
    shortNames:
    - fm
    singular: fleetmember
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.inventory.eligibleWorkers
      name: Workers
      type: integer
    - jsonPath: .status.storage.nodesOnline
      name: Nodes
      type: integer
    - jsonPath: .status.link.lastContact
      name: Contact
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FleetMember is one enrolled Kubernetes cluster. Its spec says which cluster
          and what a detachment does, because everything else about a member is
          observed rather than declared.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FleetMemberSpec identifies the Kubernetes cluster a member
              is.
            properties:
              clusterRef:
                description: |-
                  ClusterRef names the Open Cluster Management ManagedCluster this member is.
                  That kind is cluster-scoped and its names are unique, so a bare name is
                  unambiguous.
                type: string
                x-kubernetes-validations:
                - message: field is immutable
                  rule: self == oldSelf
              detachPolicy:
                default: Retain
                description: |-
                  DetachPolicy is what happens to what the fleet applied when this member is
                  deleted. Retain orphans it, leaving a working standalone deployment.
                enum:
                - Retain
                - Delete
                type: string
              inventoryRefreshInterval:
                description: |-
                  InventoryRefreshInterval is how often the hub asks the member to re-probe
                  its workers. Absent inherits the fleet's default, and zero means never.
                type: string
            required:
            - clusterRef
            type: object
          status:
            description: |-
              FleetMemberStatus is the member's readiness and three blocks that come from
              different places and go stale independently.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inventory:
                description: Inventory is a summary and never the reports, which stay
                  in the member.
                properties:
                  deviceClasses:
                    description: |-
                      DeviceClasses are the classes present, so a fleet-wide list can answer
                      which members could take a cluster of a class without fetching a report.
                    items:
                      type: string
                    type: array
                  eligibleWorkers:
                    description: EligibleWorkers is how many a cluster could be built
                      on.
                    format: int32
                    type: integer
                  observedAt:
                    description: |-
                      ObservedAt is when the summary was computed, which is what stops a stale
                      one reading as current.
                    format: date-time
                    type: string
                  rawCapacity:
                    anyOf:
                    - type: integer
                    - type: string
                    description: RawCapacity is the sum of the candidate devices.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  revision:
                    description: Revision identifies the report set this summary was
                      computed from.
                    type: string
                  unreadableReports:
                    description: |-
                      UnreadableReports counts workers whose report could not be parsed, which
                      is otherwise reported only by an event inside the member.
                    format: int32
                    type: integer
                  workers:
                    description: Workers is how many the member has.
                    format: int32
                    type: integer
                type: object
              link:
                description: Link is what the add-on reports about itself, and it
                  goes stale with it.
                properties:
                  addOnVersion:
                    description: AddOnVersion is the add-on's own version.
                    type: string
                  driverVersion:
                    description: DriverVersion is the CSI driver the member runs.
                    type: string
                  lastContact:
                    description: LastContact is when the add-on last reported.
                    format: date-time
                    type: string
                  operatorVersion:
                    description: OperatorVersion is the simplyblock operator the member
                      runs.
                    type: string
                  storageAPIVersions:
                    description: |-
                      StorageAPIVersions are the versions of storage.simplyblock.io the member
                      serves, which is what makes schema skew visible before a payload is pruned
                      by it rather than after.
                    items:
                      type: string
                    type: array
                type: object
              message:
                description: Message is why the phase is what it is.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation this status was
                  computed from.
                format: int64
                type: integer
              phase:
                description: Phase is the member's readiness to be deployed into.
                enum:
                - Pending
                - Enrolling
                - Ready
                - Degraded
                - Unreachable
                - Detaching
                type: string
              storage:
                description: Storage is read from the control plane rather than from
                  the member.
                properties:
                  clusters:
                    description: Clusters is how many storage clusters the member
                      holds.
                    format: int32
                    type: integer
                  devicesDegraded:
                    description: DevicesDegraded is how many devices are serving and
                      should not be.
                    format: int32
                    type: integer
                  nodes:
                    description: Nodes is how many storage nodes those clusters have.
                    format: int32
                    type: integer
                  nodesOnline:
                    description: NodesOnline is how many of them answer.
                    format: int32
                    type: integer
                  observedAt:
                    description: |-
                      ObservedAt is when the control plane was last read, so that a stale
                      projection is distinguishable from a current one.
                    format: date-time
                    type: string
                  pools:
                    description: Pools is how many pools the member's clusters carry.
                    format: int32
                    type: integer
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
