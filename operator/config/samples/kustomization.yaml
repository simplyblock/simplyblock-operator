## Samples that become the bundle's alm-examples ##
# Only the resources a customer creates during installation are listed, so the
# OpenShift console offers no examples for the kinds the operator manages
# itself (those CRDs are internal-objects in the CSV). The other sample files
# in this directory stay as references and can be applied one by one.
resources:
- storage_v1alpha2_controlplane.yaml
- storage_v1alpha2_simplyblockdriver.yaml
- storage_v1alpha2_operatorops.yaml
# +kubebuilder:scaffold:manifestskustomizesamples
