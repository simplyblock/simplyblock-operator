---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: replicationpairs.storage.simplyblock.io
spec:
  group: storage.simplyblock.io
  names:
    kind: ReplicationPair
    listKind: ReplicationPairList
    plural: replicationpairs
    shortNames:
    - relpair
    singular: replicationpair
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.policyRef
      name: Policy
      type: string
    - jsonPath: .spec.pvcRef
      name: PVC
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.direction
      name: Direction
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ReplicationPair tracks the live replication relationship between a source PVC
          and its replicated counterpart on a target cluster. One ReplicationPair is
          created per PVC by the PVCAnnotationWatcher controller and owned by that PVC,
          so deleting the PVC triggers garbage collection of the pair. The ReplicationPair
          reconciler drives all backend calls: attach, monitor, cutover, failover, and detach.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReplicationPairSpec defines the immutable identity of a replication
              relationship.
            properties:
              policyRef:
                description: PolicyRef is the name of the ReplicationPolicy that owns
                  this pair. Immutable.
                type: string
              pvcRef:
                description: PVCRef is the name of the PVC being replicated. Immutable.
                type: string
              volumeID:
                description: VolumeID is the backend lvol UUID of the source volume.
                  Immutable.
                type: string
            required:
            - policyRef
            - pvcRef
            - volumeID
            type: object
          status:
            description: ReplicationPairStatus holds the observed state of a ReplicationPair.
            properties:
              conditions:
                description: Conditions holds standard Kubernetes condition types.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              direction:
                description: Direction is which side of the replication relationship
                  this cluster holds.
                enum:
                - source
                - target
                type: string
              lastReplicatedAt:
                description: LastReplicatedAt is the timestamp of the last successful
                  replication snapshot.
                format: date-time
                type: string
              message:
                description: Message provides a human-readable description of the
                  current state.
                type: string
              sourceLvolID:
                description: SourceLvolID is the UUID of the source volume on Cluster
                  A.
                type: string
              state:
                description: State is the current replication state for this pair.
                enum:
                - attaching
                - replicating
                - cutover_pending
                - cutover_done
                - failed_over
                - detaching
                - error
                type: string
              targetLvolID:
                description: TargetLvolID is the UUID of the replicated volume on
                  Cluster B.
                type: string
              targetNQN:
                description: TargetNQN is the NVMe NQN on the target cluster (populated
                  after failover).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
