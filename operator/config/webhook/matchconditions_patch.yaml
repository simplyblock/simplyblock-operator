# kubebuilder webhook markers cannot express matchConditions, so two validators
# with failurePolicy=Fail are scoped here, which keeps a webhook outage from
# blocking unrelated writes:
#
# - pinned-volume-validator sees only PVCs carrying a pin annotation. The
#   expression must match every spelling of kube.KeySelectedStorageNode and
#   kube.KeyHostID. A change to any of them is a pin change the validator must
#   see.
# - storageclass-validator sees only StorageClasses carrying the pool label
#   (pool.LabelPool), the ones assigned to a StoragePool.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- name: pinned-volume-validator.simplyblock.io
  matchConditions:
  - name: has-pinned-volume-annotation
    expression: "has(object.metadata.annotations) && ('simplyblock.io/selected-storage-node' in object.metadata.annotations || 'storage.simplyblock.io/selected-storage-node' in object.metadata.annotations || 'storage.simplyblock.io/host-id' in object.metadata.annotations || 'simplyblock.io/host-id' in object.metadata.annotations || 'simplybk/host-id' in object.metadata.annotations)"
- name: storageclass-validator.simplyblock.io
  matchConditions:
  - name: has-storage-pool-label
    expression: "has(object.metadata.labels) && 'storage.simplyblock.io/pool' in object.metadata.labels"
