# AWS EBS CSI driver, installed only on Amazon EKS and only when the cluster has
# no CSIDriver ebs.csi.aws.com (neither the EKS add-on nor a self-managed
# install). It provisions the gp3 volumes of the control plane's FoundationDB
# and Prometheus.
#
# Rendered from the upstream Helm chart, without the Windows node DaemonSet and
# the chart's test pod, with every image pinned by digest:
#
#   helm template aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver #     --version 2.67.1 -n kube-system
#
# The controller authenticates to AWS through the node's instance role, or
# through the IAM role in ControlPlane spec.source.local.eksRoleARN, which the
# operator annotates its ServiceAccount with. Either role needs the AWS managed
# policy AmazonEBSCSIDriverPolicy.
