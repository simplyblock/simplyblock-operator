    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: |-
          StorageSiteDeployment requests a managed site's storage cluster from the hub:
          a discovery on the site, the sizing of the draft it writes, and the approval
          that expands the draft into a StorageCluster. The hub carries the request
          through OCM and projects the site's draft and cluster into the status.
          Deleting the request leaves the storage cluster alone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StorageSiteDeploymentSpec is the request for one site's storage
              cluster.
            properties:
              approved:
                default: false
                description: |-
                  Approved is the review gate, delivered to the draft on the site. One-way,
                  as the draft's own gate is.
                type: boolean
              cluster:
                description: |-
                  Cluster is the OCM ManagedCluster the storage is deployed on. The request's
                  ManifestWork and views live in its namespace on the hub. Immutable.
                maxLength: 63
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: cluster is immutable
                  rule: self == oldSelf
              discover:
                description: |-
                  Discover is the discovery the site runs first. Changing it runs another
                  discovery, which rewrites the draft.
                properties:
                  enableControlPlaneNodes:
                    description: |-
                      EnableControlPlaneNodes lets the discovery consider the nodes that run the
                      API server. Every server of a small distribution is one, so a three-node
                      site has no storage without it.
                    type: boolean
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: NodeSelector limits the discovery to the nodes carrying
                      these labels.
                    type: object
                  workers:
                    description: Workers limits the discovery to these nodes. Empty
                      is every worker.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              draftName:
                default: site-draft
                description: |-
                  DraftName is the ClusterDeploymentConfig the discovery writes on the site
                  and the request sizes and approves. Immutable.
                maxLength: 63
                type: string
                x-kubernetes-validations:
                - message: draftName is immutable
                  rule: self == oldSelf
              siteNamespace:
                default: simplyblock
                description: |-
                  SiteNamespace is the simplyblock operator's namespace on the site, where
                  the discovery and the draft live.
                maxLength: 63
                type: string
              sizing:
                description: |-
                  Sizing is written onto the draft's cluster template once the draft exists,
                  so the reviewer sees the sized draft before approving it.
                properties:
                  enableDriveFormat:
                    description: EnableDriveFormat lets the deployment format the
                      devices it takes.
                    type: boolean
                  enableJournalDevice:
                    description: EnableJournalDevice dedicates one device per node
                      to the journal.
                    type: boolean
                  maxSubsystemCount:
                    description: MaxSubsystemCount is the number of NVMe-oF subsystems
                      each node serves.
                    format: int32
                    minimum: 1
                    type: integer
                  minHugePagesSize:
                    description: |-
                      MinHugePagesSize is the hugepage memory each storage node takes, as a
                      quantity ("8G").
                    type: string
                  name:
                    description: Name is the StorageCluster's name on the site.
                    maxLength: 63
                    type: string
                  stripe:
                    description: Stripe is the erasure-coding layout.
                    properties:
                      dataChunks:
                        description: DataChunks is the number of data chunks per stripe
                          (ndcs).
                        format: int32
                        minimum: 1
                        type: integer
                      parityChunks:
                        description: |-
                          ParityChunks is the number of parity chunks per stripe (npcs), and
                          therefore how many chunk losses a stripe survives.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: the erasure-coding scheme must be one of 1+0, 1+1,
                        2+1, 4+1, 1+2, 2+2, or 4+2, written as dataChunks+parityChunks,
                        and an unstated half is 1
                      rule: '[has(self.dataChunks) ? self.dataChunks : 1, has(self.parityChunks)
                        ? self.parityChunks : 1] in [[1, 0], [1, 1], [2, 1], [4, 1],
                        [1, 2], [2, 2], [4, 2]]'
                  vcpuCount:
                    description: VCPUCount is the number of vCPUs each storage node
                      takes.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
            required:
            - cluster
            type: object
            x-kubernetes-validations:
            - message: 'approval is one-way: an approved deployment cannot be un-approved'
              rule: '!has(oldSelf.approved) || !oldSelf.approved || self.approved'
