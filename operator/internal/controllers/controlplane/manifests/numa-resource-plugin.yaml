# The NUMA device plugin the ControlPlane's owner runs beside the storage workers.
#
# The plugin advertises numa-align/numa-<socket> on each storage worker, and the
# storage pods request one. The operator embeds this file (numaplugin.go), sets the
# namespace to its own, and applies it owned by the ControlPlane, which is what
# gives a CRD-only (OLM) install the plugin without the Helm chart. The image is
# replaced from SB_NUMA_PLUGIN_IMAGE when that is set.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simplyblock-numa-resource-plugin
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: simplyblock-numa-resource-plugin
  labels:
    app: simplyblock-numa-resource-plugin
spec:
  selector:
    matchLabels:
      app: simplyblock-numa-resource-plugin
  template:
    metadata:
      annotations:
        log-collector/enabled: "true"
      labels:
        app: simplyblock-numa-resource-plugin
    spec:
      serviceAccountName: simplyblock-numa-resource-plugin
      priorityClassName: system-node-critical
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # Every worker a StorageCluster enrolled: the operator labels it so.
              - matchExpressions:
                  - key: io.simplyblock.storagenodeset
                    operator: Exists
      tolerations:
        # Every taint, control-plane nodes included: a storage worker may be one.
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: numa-plugin
          image: quay.io/simplyblock-io/numa-resource-plugin:latest
          imagePullPolicy: Always
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seLinuxOptions:
              type: container_device_plugin_t
          env:
            # Not a setting: the node bootstrap waits for allocatable to read
            # exactly this.
            - name: NUMA_CAPACITY
              value: "100"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ls /var/lib/kubelet/device-plugins/numa-*.sock >/dev/null 2>&1"
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: device-plugin-kubelet
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
              readOnly: true
      volumes:
        - name: device-plugin-kubelet
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
            type: Directory
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
