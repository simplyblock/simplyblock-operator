apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-host-02
  name: discovered-discover-host-02
  namespace: simplyblock
spec:
  approved: false
  cluster:
    enableDriveFormat: true
    maxSubsystemCount: 30
    name: discovered-discover-host-02-cluster
    stripe:
      dataChunks: 1
      parityChunks: 1
    vcpuCount: 4
  environment: K3s
  nodeSets:
  - groups:
    - devices:
        block:
        - /dev/sdb
        - /dev/sdc
      mgmtInterface: eth0
      name: group-1-block-2x100G
      workers:
      - githubactions-lblk-storage-node-1
      - githubactions-lblk-storage-node-2
      - githubactions-lblk-storage-node-3
    name: discovered
status:
  step: {}
