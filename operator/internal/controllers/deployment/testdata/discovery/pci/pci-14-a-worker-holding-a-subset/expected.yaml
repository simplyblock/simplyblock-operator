    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
        - 0000:af:00.0
        - 0000:b0:00.0
      mgmtInterface: eth0
      name: group-1-nvme-4x3T
      workers:
      - worker-01
      - worker-02
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
        - 0000:af:00.0
      mgmtInterface: eth0
      name: group-2-nvme-3x3T
      workers:
      - worker-03
    name: discovered
