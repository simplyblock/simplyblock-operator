metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-pci-14
  name: discovered-discover-pci-14
spec:
  cluster:
    clusterMode: null
    enableNodeAffinity: true
    name: discovered-discover-pci-14-cluster
    stripe:
      dataChunks: 1
  nodeSets:
