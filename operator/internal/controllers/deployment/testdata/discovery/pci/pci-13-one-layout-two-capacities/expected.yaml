apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-pci-13
  name: discovered-discover-pci-13
  namespace: simplyblock
spec:
  approved: false
  cluster:
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-pci-13-cluster
    vcpuCount: 16
  environment: K3s
  nodeSets:
  - groups:
    - devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
      mgmtInterface: eth0
      name: group-1-nvme-2x2T
      workers:
      - worker-01
      - worker-02
    name: discovered
status:
  step: {}
