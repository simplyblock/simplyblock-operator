apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-pci-07
  name: discovered-discover-pci-07
  namespace: simplyblock
spec:
  approved: false
  cluster:
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-pci-07-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
    vcpuCount: 16
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - devices:
        nvme:
        - "10000:01:00.0"
        - "10000:02:00.0"
      mgmtInterface: eth0
      name: group-1-nvme-2x3T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
