metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-pci-07
  name: discovered-discover-pci-07
spec:
  cluster:
    enableNodeAffinity: true
    name: discovered-discover-pci-07-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - "10000:01:00.0"
        - "10000:02:00.0"
      mgmtInterface: eth0
      name: group-1-nvme-2x3T
      workers:
      - worker-01
    name: discovered
