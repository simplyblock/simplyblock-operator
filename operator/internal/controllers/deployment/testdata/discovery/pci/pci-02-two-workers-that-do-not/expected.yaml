metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-pci-02
  name: discovered-discover-pci-02
spec:
  cluster:
    clusterMode: Dual
    enableNodeAffinity: true
    name: discovered-discover-pci-02-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
        - 0000:af:00.0
        - 0000:b0:00.0
      mgmtInterface: eth0
      name: group-1-nvme-4x3T
      workers:
      - worker-01
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:3b:00.0
        - 0000:3c:00.0
        - 0000:d8:00.0
        - 0000:d9:00.0
      mgmtInterface: eth0
      name: group-2-nvme-4x3T
      workers:
      - worker-02
    name: discovered
