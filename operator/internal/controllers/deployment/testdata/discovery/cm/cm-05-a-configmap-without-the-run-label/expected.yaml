metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-cm-05
  name: discovered-discover-cm-05
spec:
  cluster:
    clusterMode: Dual
    enableNodeAffinity: true
    name: discovered-discover-cm-05-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
        - 0000:af:00.0
        - 0000:b0:00.0
      mgmtInterface: eth0
      name: group-1-nvme-4x3T
      workers:
      - worker-02
      - worker-03
    name: discovered
