metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-filt-11
  name: discovered-discover-filt-11
spec:
  cluster:
    enableNodeAffinity: true
    name: discovered-discover-filt-11-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
      mgmtInterface: eth0
      name: group-1-nvme-2x2T
      workers:
      - worker-01
    name: discovered
