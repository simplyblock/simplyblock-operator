apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-filt-07
  name: discovered-discover-filt-07
  namespace: simplyblock
spec:
  approved: false
  cluster:
    clusterMode: Single
    enableDriveFormat: true
    enableJournalDevice: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-filt-07-cluster
    network:
      spdkOnHostNetwork: true
    stripe:
      dataChunks: 2
      parityChunks: 1
    vcpuCount: 30
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/sdb
        - /dev/sdc
        - /dev/vdb
        - /dev/vdc
        - /dev/vdd
      mgmtInterface: eth0
      name: group-1-block-5x3.19T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
