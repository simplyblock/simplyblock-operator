apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-filt-08
  name: discovered-discover-filt-08
  namespace: simplyblock
spec:
  approved: false
  cluster:
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-filt-08-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
    vcpuCount: 16
  environment: K3s
  nodeSets:
  - groups:
    - devices:
        block:
        - /dev/vdb
        - /dev/vdc
      mgmtInterface: eth0
      name: group-1-block-2x4T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
