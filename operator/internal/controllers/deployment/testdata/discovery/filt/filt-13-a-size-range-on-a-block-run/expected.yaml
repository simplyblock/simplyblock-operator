metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-filt-13
  name: discovered-discover-filt-13
spec:
  cluster:
    enableJournalDevice: true
    enableNodeAffinity: true
    name: discovered-discover-filt-13-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/vdb
        - /dev/vdc
        - /dev/vdd
      mgmtInterface: eth0
      name: group-1-block-3x4T
      workers:
      - worker-01
    name: discovered
