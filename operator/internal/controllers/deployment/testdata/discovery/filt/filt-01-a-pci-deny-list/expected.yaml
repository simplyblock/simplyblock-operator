metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-filt-01
  name: discovered-discover-filt-01
spec:
  cluster:
    enableJournalDevice: true
    name: discovered-discover-filt-01-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5f:00.0
        - 0000:af:00.0
      mgmtInterface: eth0
      name: group-1-nvme-2x1.25T
      workers:
      - worker-01
    name: discovered
