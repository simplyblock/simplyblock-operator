metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-filt-14
  name: discovered-discover-filt-14
spec:
  cluster:
    enableJournalDevice: true
    enableNodeAffinity: true
    name: discovered-discover-filt-14-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5f:00.0
        - 0000:af:00.0
      mgmtInterface: eth0
      name: group-1-nvme-3x1.5T
      workers:
      - worker-01
    name: discovered
