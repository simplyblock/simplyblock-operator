apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-dev-20
  name: discovered-discover-dev-20
  namespace: simplyblock
spec:
  approved: false
  cluster:
    clusterMode: Single
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-dev-20-cluster
    stripe:
      dataChunks: 2
      parityChunks: 1
    vcpuCount: 16
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/vdb
        - /dev/vdc
        - /dev/vdd
        - /dev/vde
      mgmtInterface: eth0
      name: group-1-block-4x2T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
