metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-dev-05
  name: discovered-discover-dev-05
spec:
  cluster:
    enableJournalDevice: true
    name: discovered-discover-dev-05-cluster
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/nvme0n1
        - /dev/nvme1n1
        - /dev/vdb
        - /dev/vdc
      mgmtInterface: eth0
      name: group-1-block-4x2.5T
      workers:
      - worker-01
    name: discovered
