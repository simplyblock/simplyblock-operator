metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-dev-18
  name: discovered-discover-dev-18
spec:
  cluster:
    enableJournalDevice: true
    name: discovered-discover-dev-18-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/sdb
        - /dev/vdb
      mgmtInterface: eth0
      name: group-1-block-2x2T
      workers:
      - worker-01
    name: discovered
