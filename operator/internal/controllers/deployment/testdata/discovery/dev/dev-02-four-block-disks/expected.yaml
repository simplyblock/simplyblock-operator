metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-dev-02
  name: discovered-discover-dev-02
spec:
  cluster:
    enableJournalDevice: true
    name: discovered-discover-dev-02-cluster
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/vdb
        - /dev/vdc
        - /dev/vdd
        - /dev/vde
      mgmtInterface: eth0
      name: group-1-block-4x2T
      workers:
      - worker-01
    name: discovered
