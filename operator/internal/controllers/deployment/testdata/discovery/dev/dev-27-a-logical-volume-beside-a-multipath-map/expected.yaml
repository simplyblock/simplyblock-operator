apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-dev-27
  name: discovered-discover-dev-27
  namespace: simplyblock
spec:
  approved: false
  cluster:
    clusterMode: Single
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-dev-27-cluster
    network:
      spdkOnHostNetwork: true
    stripe:
      dataChunks: 1
      parityChunks: 0
    vcpuCount: 5
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/vdb
      mgmtInterface: eth0
      name: group-1-block-1x2T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
