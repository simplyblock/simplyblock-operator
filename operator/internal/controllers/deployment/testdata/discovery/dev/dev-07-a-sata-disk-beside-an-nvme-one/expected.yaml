metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-dev-07
  name: discovered-discover-dev-07
spec:
  cluster:
    enableJournalDevice: true
    name: discovered-discover-dev-07-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        block:
        - /dev/nvme0n1
        - /dev/sda
      mgmtInterface: eth0
      name: group-1-block-2x3.5T
      workers:
      - worker-01
    name: discovered
