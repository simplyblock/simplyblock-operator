metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-net-25
  name: discovered-discover-net-25
spec:
  cluster:
    name: discovered-discover-net-25-cluster
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth0
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
        - 0000:5e:00.2
        - 0000:5e:00.3
      mgmtInterface: eth1
      name: group-1-nvme-4x3T
      workers:
      - worker-01
    name: discovered
