apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-net-71
  name: discovered-discover-net-71
  namespace: simplyblock
spec:
  approved: false
  cluster:
    clusterMode: Dual
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-net-71-cluster
    stripe:
      dataChunks: 1
      parityChunks: 1
    vcpuCount: 14
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
        - 0000:5e:00.2
        - 0000:5e:00.3
      name: group-1-nvme-4x3T
      networkAttachment:
        management: storage-mgmt
      workers:
      - worker-01
      - worker-02
    name: discovered
status:
  step: {}
