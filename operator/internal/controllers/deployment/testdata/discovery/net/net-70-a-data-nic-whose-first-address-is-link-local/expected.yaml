apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-net-70
  name: discovered-discover-net-70
  namespace: simplyblock
spec:
  approved: false
  cluster:
    clusterMode: Single
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-net-70-cluster
    network:
      podNetwork: true
    stripe:
      dataChunks: 2
      parityChunks: 1
    vcpuCount: 30
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
        - 0000:5e:00.2
        - 0000:5e:00.3
      mgmtInterface: ens5f0
      name: group-1-nvme-4x3T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
