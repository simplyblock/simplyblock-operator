metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-net-55
  name: discovered-discover-net-55
spec:
  cluster:
    name: discovered-discover-net-55-cluster
  nodeSets:
  - groups:
    - dataInterfaces:
      - ens5f1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
        - 0000:5e:00.2
        - 0000:5e:00.3
      mgmtInterface: ens5f0
      name: group-1-nvme-4x3T
      workers:
      - worker-01
    name: discovered
