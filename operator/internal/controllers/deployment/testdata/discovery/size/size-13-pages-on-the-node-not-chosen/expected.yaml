metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-size-13
  name: discovered-discover-size-13
spec:
  cluster:
    enableNodeAffinity: true
    minHugePagesSize: null
    name: discovered-discover-size-13-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
      mgmtInterface: eth0
      name: group-1-nvme-2x3T
      workers:
      - worker-01
    name: discovered
