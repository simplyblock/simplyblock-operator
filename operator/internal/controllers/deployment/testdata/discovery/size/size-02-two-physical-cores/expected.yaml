metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-size-02
  name: discovered-discover-size-02
spec:
  cluster:
    name: discovered-discover-size-02-cluster
    vcpuCount: 4
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
        - 0000:5e:00.2
        - 0000:5e:00.3
      mgmtInterface: eth0
      name: group-1-nvme-4x3T
      workers:
      - worker-01
    name: discovered
