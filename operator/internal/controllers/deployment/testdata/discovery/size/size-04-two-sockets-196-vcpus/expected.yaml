metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-size-04
  name: discovered-discover-size-04
spec:
  cluster:
    enableNodeAffinity: true
    minHugePagesSize: 128G
    name: discovered-discover-size-04-cluster
    stripe:
      dataChunks: 1
    vcpuCount: 9
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
      mgmtInterface: eth0
      name: group-1-nvme-2x3T
      workers:
      - worker-01
    name: discovered
