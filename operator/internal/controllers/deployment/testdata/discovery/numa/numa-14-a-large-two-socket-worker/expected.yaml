metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-numa-14
  name: discovered-discover-numa-14
spec:
  cluster:
    minHugePagesSize: 256G
    name: discovered-discover-numa-14-cluster
    vcpuCount: 9
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
        - 0000:5e:00.2
        - 0000:5e:00.3
        - 0000:5e:00.4
      mgmtInterface: eth0
      name: group-1-nvme-5x3T
      workers:
      - worker-01
    name: discovered
