metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-numa-05
  name: discovered-discover-numa-05
spec:
  cluster:
    enableNodeAffinity: true
    name: discovered-discover-numa-05-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:7e:00.0
        - 0000:7e:00.1
      mgmtInterface: eth0
      name: group-1-nvme-2x2T
      workers:
      - worker-01
    name: discovered
