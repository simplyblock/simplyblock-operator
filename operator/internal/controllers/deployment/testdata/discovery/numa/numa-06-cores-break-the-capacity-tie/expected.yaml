apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-numa-06
  name: discovered-discover-numa-06
  namespace: simplyblock
spec:
  approved: false
  cluster:
    enableDriveFormat: true
    maxSubsystemCount: 30
    minHugePagesSize: 16G
    name: discovered-discover-numa-06-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
    vcpuCount: 24
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - devices:
        nvme:
        - 0000:7e:00.0
        - 0000:7e:00.1
      mgmtInterface: eth0
      name: group-1-nvme-2x3T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
