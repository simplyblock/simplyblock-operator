apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: discover-numa-08
  name: discovered-discover-numa-08
  namespace: simplyblock
spec:
  approved: false
  cluster:
    enableDriveFormat: true
    maxSubsystemCount: 30
    name: discovered-discover-numa-08-cluster
    stripe:
      dataChunks: 1
      parityChunks: 0
    vcpuCount: 8
  environment: K3s
  hostOS:
    distro: ubuntu
    family: Debian
  nodeSets:
  - groups:
    - devices:
        nvme:
        - 0000:fe:00.0
        - 0000:fe:00.1
        - 0000:fe:00.2
      mgmtInterface: eth0
      name: group-1-nvme-3x3T
      workers:
      - worker-01
    name: discovered
status:
  step: {}
