metadata:
  labels:
    storage.simplyblock.io/nodeprobe-run: discover-numa-12
  name: discovered-discover-numa-12
spec:
  cluster:
    clusterMode: Dual
    enableNodeAffinity: true
    name: discovered-discover-numa-12-cluster
    stripe:
      dataChunks: 1
  nodeSets:
  - groups:
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
        - 0000:5e:00.1
      mgmtInterface: eth0
      name: group-1-nvme-2x3T
      workers:
      - worker-01
    - dataInterfaces:
      - eth1
      devices:
        nvme:
        - 0000:5e:00.0
      mgmtInterface: eth0
      name: group-2-nvme-1x3T
      workers:
      - worker-02
    name: discovered
