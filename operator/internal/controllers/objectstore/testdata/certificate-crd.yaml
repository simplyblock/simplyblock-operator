# The one cert-manager CRD this suite needs, reduced to what the apiserver
# has to know to store a Certificate and serve its status subresource.
#
# ObjectStoreReconciler reads and writes Certificates as unstructured objects
# against a hardcoded GVK, never through a typed cert-manager scheme, so the
# schema below deliberately validates nothing beyond the group, version, and
# kind: preserving unknown fields is exactly the contract the reconciler
# already relies on. Vendoring cert-manager's real CRD bundle would pin this
# suite to a cert-manager release it otherwise has no opinion about.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  scope: Namespaced
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
