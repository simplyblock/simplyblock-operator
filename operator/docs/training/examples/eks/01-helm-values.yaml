# The Helm values of a standalone install on Amazon EKS: the operator hosts its
# own control plane, cert-manager issues the certificates, every ServiceAccount
# the release creates carries the IAM role the control plane and the storage
# nodes assume, and the first discovery run is confined to the node group that
# carries instance store. cert-manager has to exist before this install, because
# the chart renders its Certificates as release objects and refuses to render
# where cert-manager.io/v1 is not served.
#
#   helm install simplyblock-operator simplyblock/simplyblock-operator \
#     --namespace simplyblock --create-namespace --values 01-helm-values.yaml
deployment:
  profile: standalone

tls:
  enabled: true
  provider: cert-manager
  mutual_enabled: true

controlplane:
  local:
    eksRoleARN: arn:aws:iam::123456789012:role/simplyblock-storage

discovery:
  enabled: true
  name: eks
  nodeSelector:
    eks.amazonaws.com/nodegroup: storage
  enablePartitionedDevices: true
  deviceFilter:
    pcieModel: Instance Storage
