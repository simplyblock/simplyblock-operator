# Forecasts moving every bound claim on gen1, in every namespace, to gen2.
# Nothing is enrolled, copied, or cut over.
apiVersion: storage.simplyblock.io/v1alpha1
kind: ReplicationOps
metadata:
  name: forecast-gen1-move
  namespace: simplyblock
spec:
  action: migration
  scope: cluster
  ref: gen1
  policyRef: gen1-move
  dryRun: true
