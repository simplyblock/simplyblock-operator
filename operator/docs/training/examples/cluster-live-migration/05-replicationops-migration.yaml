# The move: the same scope and policy, without dryRun.
# deleteSource deletes each source volume after its cutover, and the
# operator then marks the PersistentVolume with relocated-to.
apiVersion: storage.simplyblock.io/v1alpha1
kind: ReplicationOps
metadata:
  name: move-gen1
  namespace: simplyblock
spec:
  action: migration
  scope: cluster
  ref: gen1
  policyRef: gen1-move
  deleteSource: true
