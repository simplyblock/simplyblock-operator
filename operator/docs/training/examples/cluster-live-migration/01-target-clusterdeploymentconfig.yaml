# The target cluster, which has to exist before anything moves: a second
# StorageCluster, gen2, on three new workers, registered with the same control
# plane as the source cluster gen1. The document is kept short: the cluster's
# name, the two required sizing values, and one node group with its interfaces
# and devices. The stripe, the huge-page floor, and the provisioning budget keep
# their defaults. It can be written by hand or
# come from a discovery run restricted to the new workers, and either way it
# creates nothing until it is approved, as it is here.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: gen2
  namespace: simplyblock
spec:
  approved: true
  cluster:
    name: gen2
    maxSubsystemCount: 50
    vcpuCount: 8
  nodeSets:
    - name: gen2
      groups:
        - name: default
          workers:
            - gen2-worker-0
            - gen2-worker-1
            - gen2-worker-2
          mgmtInterface: eth0
          dataInterfaces:
            - eth0
          devices:
            nvme:
              - "0000:01:00.0"
              - "0000:02:00.0"
