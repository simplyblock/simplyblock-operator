# The removal of example 01 after spec.abort was set, which is how a removal
# held in Validating is called off. Validating has changed nothing on the
# node, so the operation ends Aborted and the node keeps serving. From
# ShuttingDown on, the same edit is refused with an AbortRefused event and the
# removal runs on. spec.abort is the only field of the spec that can change
# after creation.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageNodeOps
metadata:
  name: production-worker-5-0-remove
  namespace: simplyblock
spec:
  nodeRef: production-worker-5-0
  action: Remove
  abort: true
