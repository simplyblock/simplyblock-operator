# The removal of example 01 after spec.abort is set. In Validating, nothing
# has changed yet, so the operation ends Aborted and the node keeps serving.
# From ShuttingDown on, the abort is refused with an AbortRefused event.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageNodeOps
metadata:
  name: production-worker-5-0-remove
  namespace: simplyblock
spec:
  nodeRef: production-worker-5-0
  action: Remove
  abort: true
