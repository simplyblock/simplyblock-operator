# The same document with a KMIP appliance as the key store instead of Vault.
# It is an alternative to the previous file, not a second document: one
# cluster has one key store, chosen before it is created. The endpoint is a
# host and a port with no scheme, because KMIP is a binary protocol over TLS
# rather than an HTTP API. It is the only KMIP setting the API has.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: secure
  namespace: simplyblock
spec:
  approved: true
  environment: Vanilla
  cluster:
    name: secure
    maxSubsystemCount: 50
    vcpuCount: 8
    stripe:
      dataChunks: 1
      parityChunks: 1
    kms:
      kmip:
        endpoint: kmip.corp.example.com:5696
  nodeSets:
    - name: secure
      groups:
        - name: default
          workers:
            - worker-1
            - worker-2
            - worker-3
          mgmtInterface: eth0
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
