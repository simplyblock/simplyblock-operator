# The control plane of a cluster that keeps its keys in Vault. Its web API
# certificate signs it in to the key store. cert-manager and mutual TLS give
# that certificate the client-auth usage. Both are defaults, set here to show
# them.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ControlPlane
metadata:
  name: simplyblock
  namespace: simplyblock
spec:
  source:
    local:
      image: quay.io/simplyblock-io/simplyblock:26.4.0-beta4
      foundationDB:
        replicas: 3
      tls:
        enableTLS: true
        enableMutualTLS: true
        provider: cert-manager
