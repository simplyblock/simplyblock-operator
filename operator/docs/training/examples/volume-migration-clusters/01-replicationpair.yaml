# The two clusters of the move: site-a, the StorageCluster the volumes live on
# today, and site-b, the cluster they move to. One control plane serves both,
# and here both StorageCluster objects live in this namespace, so each side is
# named by its object. A target whose StorageCluster object lives on another
# Kubernetes cluster is named by its backend UUID instead. Several policies can
# share one pair, so a pair already written for DR between the same two
# clusters serves the move as well.
apiVersion: storage.simplyblock.io/v1alpha1
kind: ReplicationPair
metadata:
  name: site-a-to-site-b
  namespace: simplyblock
spec:
  sourceCluster: site-a
  targetCluster: site-b
