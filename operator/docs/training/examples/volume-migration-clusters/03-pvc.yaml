# A claim enrolled into the move by its annotation. It lives in the
# simplyblock namespace beside the policy, because a migration at scope
# policy, volume, or target sees only the ReplicationSlots of its own
# namespace, which is the policy's. Claims in workload namespaces are moved
# by scope cluster, which enrolls them itself. Once the claim is Bound, the
# operator creates the slot move-to-site-b-ledger-db beside it, owned by it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-db
  namespace: simplyblock
  annotations:
    storage.simplyblock.io/replication-policy: move-to-site-b
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: simplyblock-site-a
  resources:
    requests:
      storage: 100Gi
