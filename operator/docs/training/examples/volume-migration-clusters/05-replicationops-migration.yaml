# The move itself: the same scope without dryRun, and with deleteSource. The
# operation waits until every slot of the policy is replicating, creates one
# migration plan, and reads it back every 30 seconds until each volume has
# cut over. deleteSource deletes each source volume after its cutover, and the
# operator then writes storage.simplyblock.io/relocated-to on the volume's
# PersistentVolume, the handle the CSI driver stages and deletes it through
# from then on.
apiVersion: storage.simplyblock.io/v1alpha1
kind: ReplicationOps
metadata:
  name: move-to-site-b
  namespace: simplyblock
spec:
  action: migration
  scope: policy
  ref: move-to-site-b
  deleteSource: true
