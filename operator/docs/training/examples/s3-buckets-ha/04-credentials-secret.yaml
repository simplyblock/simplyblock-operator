# The gateway's environment, passed through spec.envFrom unread by the
# operator. The root key pair is required: without it every gateway pod exits
# at start. VGW_PORT is the address the gateway listens on, and the operator
# does not derive it from spec.port, so the two are kept equal here. The IAM
# cache line is the gateway's default, written out because it is how long a
# revoked key keeps working on a replica that cached it.
apiVersion: v1
kind: Secret
metadata:
  name: s3-ha-credentials
  namespace: simplyblock
type: Opaque
stringData:
  ROOT_ACCESS_KEY_ID: replace-with-a-root-access-key
  ROOT_SECRET_ACCESS_KEY: replace-with-a-root-secret-key
  VGW_PORT: ":9000"
  VGW_IAM_CACHE_TTL: "120"
