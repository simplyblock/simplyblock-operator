# The way back once site-a is up again: the changes made on site-b are
# shipped back, then a commit switches each volume back to site-a. The
# operation lives beside the slots, because a failback reaches only the slots
# in its own namespace.
apiVersion: storage.simplyblock.io/v1alpha1
kind: ReplicationOps
metadata:
  name: failback-dr-policy
  namespace: shop
spec:
  action: failback
  scope: policy
  ref: dr-policy
