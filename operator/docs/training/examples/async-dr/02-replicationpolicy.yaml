# The DR schedule on the pair: a replication snapshot every five minutes, the
# last three kept on the target, in failover mode, which makes the target a
# standby that is promoted by a ReplicationOps and never on its own. Every
# volume that follows this policy gets one ReplicationSlot. The interval is the
# only cadence the API states: there is no recovery-point objective field.
apiVersion: storage.simplyblock.io/v1alpha1
kind: ReplicationPolicy
metadata:
  name: dr-policy
  namespace: simplyblock
spec:
  pairRef: site-a-to-site-b
  mode: failover
  interval: 5m
  snapshotRetention: 3
