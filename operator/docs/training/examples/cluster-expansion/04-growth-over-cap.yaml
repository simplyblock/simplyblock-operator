# A later growth, written when prod has 30 storage nodes. 30 + 3 = 33, over
# the cap of 32, so the draft holds with MemberTooLarge:
#
#   the document adds 3 storage nodes to cluster prod, which has 30, and a
#   cluster holds at most 32
#
# The webhook does not check the cap. Approved as it is, the document would go
# Failed. Two workers fit.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: prod-growth-4
  namespace: simplyblock
spec:
  approved: false
  clusterRef: prod
  nodeSets:
    - name: growth-2027-05
      groups:
        - name: zone-a
          failureDomain: zone-a
          workers:
            - worker-31
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: zone-b
          failureDomain: zone-b
          workers:
            - worker-32
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: zone-c
          failureDomain: zone-c
          workers:
            - worker-33
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
