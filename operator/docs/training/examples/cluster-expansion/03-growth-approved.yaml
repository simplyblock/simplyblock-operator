# The same document after review. The reviewer read status.message, which said
# the document is valid and waiting for spec.approved, checked one worker per
# zone and two devices per worker, renamed the node set so the StorageNodes
# record which growth they came from, and set approved. The approving edit is
# checked at admission against the live cluster, and from then on the spec is
# immutable: this document is the record of the growth.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: prod-growth-1
  namespace: simplyblock
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: prod-grow-1
spec:
  approved: true
  environment: OpenShift
  clusterRef: prod
  nodeSets:
    - name: growth-2026-11
      groups:
        - name: zone-a
          failureDomain: zone-a
          workers:
            - worker-07
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: zone-b
          failureDomain: zone-b
          workers:
            - worker-08
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: zone-c
          failureDomain: zone-c
          workers:
            - worker-09
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
