# The growth document as the discovery run wrote it. approved is false, so
# nothing is created yet. The operator checks the draft on every pass and
# writes the result into status.message. There is no spec.cluster: sizing,
# stripe, and failure domains come from the StorageCluster prod.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: prod-growth-1
  namespace: simplyblock
  labels:
    storage.simplyblock.io/component: nodeprobe
    storage.simplyblock.io/nodeprobe-run: prod-grow-1
spec:
  approved: false
  environment: OpenShift
  clusterRef: prod
  nodeSets:
    - name: discovered
      groups:
        - name: group-1-nvme-2x3T
          failureDomain: zone-a
          workers:
            - worker-07
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: group-2-nvme-2x3T
          failureDomain: zone-b
          workers:
            - worker-08
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: group-3-nvme-2x3T
          failureDomain: zone-c
          workers:
            - worker-09
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
