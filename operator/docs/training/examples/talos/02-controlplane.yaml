# The simplyblock control plane on a Talos cluster, written by hand. The Helm
# chart's standalone profile hands the operator the same object. cert-manager
# is the issuer and it can issue client certificates, so mutual TLS stays on.
# The operator reconciles only a ControlPlane named simplyblock in its own
# namespace.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ControlPlane
metadata:
  name: simplyblock
  namespace: simplyblock
spec:
  source:
    local:
      image: quay.io/simplyblock-io/simplyblock:26.4.0-beta4
      foundationDB:
        replicas: 3
      tls:
        enableTLS: true
        enableMutualTLS: true
        provider: cert-manager
