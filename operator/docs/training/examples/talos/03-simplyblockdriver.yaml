# The CSI driver, as the object the operator builds it from. It is the same on
# Talos as anywhere else: the node plugin's NVMe-oF initiator modules are built
# into the Talos kernel, and the guard that installs them on an Ubuntu host
# leaves a Talos host alone. It reports Unavailable until a storage cluster
# exists, which is expected on a fresh install.
apiVersion: storage.simplyblock.io/v1alpha2
kind: SimplyblockDriver
metadata:
  name: simplyblock
  namespace: simplyblock
spec:
  driverName: csi.simplyblock.io
  enableVolumeSnapshots: true
