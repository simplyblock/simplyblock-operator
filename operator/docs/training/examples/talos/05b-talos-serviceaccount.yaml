# The Talos ServiceAccount a Managed deployment creates in the simplyblock
# namespace before the storage nodes are added. It is a Talos resource served
# through Kubernetes, not a simplyblock object. Talos answers it with a Secret
# of the same name that holds a talosconfig for the os:admin role, and the
# storage node mounts that Secret into its talosctl Jobs. The name is the one
# the storage node looks for.
#
#   kubectl apply -f 05b-talos-serviceaccount.yaml
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-api-access-talos-secrets
  namespace: simplyblock
spec:
  roles:
    - os:admin
