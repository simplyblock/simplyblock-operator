# A discovery run on a Talos cluster whose control plane is separate from its
# workers. The Helm chart raises one like it on a fresh standalone install,
# named after discovery.name. The run concludes Talos from the talos.dev API
# group, the talos.dev/ node labels, and the Talos OS image, and records it as
# status.environment. The control-plane machines carry the control-plane role
# label and, by default, the control-plane taint, so the run leaves them out
# and says so in its status. enableControlPlaneNodes stays at its default,
# because the three storage machines are the workers.
apiVersion: storage.simplyblock.io/v1alpha2
kind: OperatorOps
metadata:
  name: talos
  namespace: simplyblock
spec:
  action: Discover
  discover:
    enablePartitionedDevices: true
