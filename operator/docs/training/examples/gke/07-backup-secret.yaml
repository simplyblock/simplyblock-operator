# The access key for the backup bucket. The draft's backup store names this
# Secret with credentials.source Secret. Apply it before approving the draft.
apiVersion: v1
kind: Secret
metadata:
  name: simplyblock-backup-credentials
  namespace: simplyblock
type: Opaque
stringData:
  access_key_id: REPLACE_WITH_ACCESS_KEY_ID
  secret_access_key: REPLACE_WITH_SECRET_ACCESS_KEY
