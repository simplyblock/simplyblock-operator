# The draft the discovery run wrote, after review. The reviewer shortened the
# cluster name, raised vcpuCount, added a backup store, and set approved. The
# document cannot change after that.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: discovered-gke
  namespace: simplyblock
spec:
  approved: true
  environment: GKE
  hostOS:
    distro: cos
  cluster:
    name: gke
    network:
      spdkOnHostNetwork: true
    maxSubsystemCount: 50
    vcpuCount: 8
    enableDriveFormat: true
    stripe:
      dataChunks: 1
      parityChunks: 1
    fabricType: tcp
    enableFailureDomains: false
    nodeProvisioningBudget: 1
    backup:
      endpoint: https://s3.us-east-1.amazonaws.com
      bucket: simplyblock-gke-backups
      region: us-east-1
      credentials:
        source: Secret
        secretRef:
          name: simplyblock-backup-credentials
  nodeSets:
    - name: discovered
      groups:
        - name: group-1-nvme-1x750G
          workers:
            - gke-storage-simplyblock-storage-7f3e2a1b-k2xz
            - gke-storage-simplyblock-storage-7f3e2a1b-p9qw
            - gke-storage-simplyblock-storage-7f3e2a1b-v4mn
          mgmtInterface: eth0
          failureDomain: us-east1-b
          devices:
            nvme:
              - "0000:00:04.0"
