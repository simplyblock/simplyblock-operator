# The first volume. The cluster wrote its default pool, gke-default, and the
# StorageClass simplyblock-gke for it, so nothing is authored between the
# cluster coming Online and this claim. The persistent-disk class the
# coordinators use is not involved: it is the control plane's, not the
# workloads'.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: first-volume
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: simplyblock-gke
  resources:
    requests:
      storage: 10Gi
