# Moves one storage node to another worker of the same Kubernetes cluster.
# The node keeps its UUID and its volumes.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageNodeOps
metadata:
  name: move-production-worker-3-0
  namespace: simplyblock
spec:
  nodeRef: production-worker-3-0
  action: Migrate
  migrate:
    targetWorkerNode: worker-5
