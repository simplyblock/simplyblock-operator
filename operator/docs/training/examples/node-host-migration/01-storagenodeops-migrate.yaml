# The smallest migration: one StorageNode relocated from the worker it runs on
# to another worker of the same Kubernetes cluster. It is shown first because
# it is all a migration needs when the target has the same hardware as the
# source: the node keeps its backend UUID and its volumes, and no
# PersistentVolumeOps is created. Every field but spec.abort is immutable once
# the object exists.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageNodeOps
metadata:
  name: move-production-worker-3-0
  namespace: simplyblock
spec:
  nodeRef: production-worker-3-0
  action: Migrate
  migrate:
    targetWorkerNode: worker-5
