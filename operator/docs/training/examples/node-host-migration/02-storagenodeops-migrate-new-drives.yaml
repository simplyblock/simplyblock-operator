# Moves the node to a target whose drives sit at new PCI addresses.
# The addresses are bound on the target and added to the node's allow list.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageNodeOps
metadata:
  name: move-production-worker-3-0-new-drives
  namespace: simplyblock
spec:
  nodeRef: production-worker-3-0
  action: Migrate
  migrate:
    targetWorkerNode: worker-5
    newSsdPcie:
      - "0000:88:00.0"
      - "0000:89:00.0"
