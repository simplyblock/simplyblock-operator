# The ControlPlane of the management cluster, as the chart's standalone profile
# hands it to the operator through the bootstrap ConfigMap with the values of
# 02-helm-values.yaml. The operator installs FoundationDB, the object store,
# and the management API from it. Every edge cluster's StorageCluster becomes
# one backend cluster in this FoundationDB. Only a ControlPlane named
# simplyblock in the operator's namespace is reconciled.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ControlPlane
metadata:
  name: simplyblock
  namespace: simplyblock
spec:
  source:
    local:
      image: quay.io/simplyblock-io/simplyblock:26.4.0-beta4
      foundationDB:
        replicas: 3
      tls:
        enableTLS: true
        enableMutualTLS: false
        provider: cert-manager
      adminTokenSecretRef:
        name: edge-admin-token
      observability:
        enableMonitoring: true
        secretRef:
          name: simplyblock-grafana-secrets
