# The static admin token of the management cluster, created by hand before the
# chart is installed. The ControlPlane names it in
# spec.source.local.adminTokenSecretRef, and the operator projects the token key
# into the management API container as the environment variable
# SB_ADMIN_TOKENS through a secretKeyRef, so the operator never reads the value
# itself. Every edge cluster presents the same value from its own Secret
# (controlplane.managed.credentialsSecretRef there). A Kubernetes TokenReview
# never crosses a cluster boundary, which is why a static token exists at all.
#
# The chart does not create this Secret. The management API pods do not start
# until it exists, because the environment variable is not optional.
#
#   kubectl create namespace simplyblock
#   kubectl -n simplyblock create secret generic edge-admin-token \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: edge-admin-token
  namespace: simplyblock
type: Opaque
stringData:
  token: replace-with-a-long-random-value
