# The static admin tokens the management API accepts. Create it before the
# chart is installed. The management API pods do not start without it.
#
#   kubectl create namespace simplyblock
#   kubectl -n simplyblock create secret generic edge-admin-token \
#     --from-literal=token="$(openssl rand -hex 32),$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: edge-admin-token
  namespace: simplyblock
type: Opaque
stringData:
  # A comma-separated list. Each value is a full admin token. Here: one per edge.
  token: replace-with-the-token-of-edge-north,replace-with-the-token-of-edge-south
