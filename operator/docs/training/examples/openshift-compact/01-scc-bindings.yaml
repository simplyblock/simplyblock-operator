# Lets the simplyblock pods run privileged on OpenShift. Apply this before you
# install the operator: the operator does not grant SCCs itself.
#
#   oc create namespace simplyblock
#   oc apply -f 01-scc-bindings.yaml
#
# The namespace also needs the privileged Pod Security level:
#
#   oc label namespace simplyblock \
#     pod-security.kubernetes.io/enforce=privileged \
#     pod-security.kubernetes.io/audit=privileged \
#     pod-security.kubernetes.io/warn=privileged
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simplyblock-scc-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:simplyblock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simplyblock-scc-anyuid
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:simplyblock
