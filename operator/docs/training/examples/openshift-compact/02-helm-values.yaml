# Helm values for a standalone install on a compact OpenShift cluster.
# The operator runs its own control plane, certificates come from the OpenShift
# service CA, and discovery may use the control-plane nodes.
#
#   helm install simplyblock-operator simplyblock/simplyblock-operator \
#     --namespace simplyblock --values 02-helm-values.yaml
deployment:
  profile: standalone

tls:
  enabled: true
  # The service CA needs no cert-manager.
  provider: openshift
  # The service CA issues no client certificates.
  mutual_enabled: false

discovery:
  enabled: true
  name: compact
  enableControlPlaneNodes: true
  enablePartitionedDevices: true
