# A discovery run for a compact cluster. With Helm, the chart creates one like
# it on a fresh install. After an OperatorHub install you apply it yourself.
#
#   oc apply -f 05-operatorops-discover.yaml
#   oc get oops compact -n simplyblock -w
apiVersion: storage.simplyblock.io/v1alpha2
kind: OperatorOps
metadata:
  name: compact
  namespace: simplyblock
spec:
  action: Discover
  discover:
    enableControlPlaneNodes: true
    enablePartitionedDevices: true
