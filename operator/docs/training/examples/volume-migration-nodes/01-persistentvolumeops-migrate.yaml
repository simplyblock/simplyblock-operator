# Moves one volume to another storage node of the same cluster.
# Cluster-scoped, so there is no namespace. The cluster is read from the volume.
apiVersion: storage.simplyblock.io/v1alpha2
kind: PersistentVolumeOps
metadata:
  name: pg-data-to-worker-4
spec:
  persistentVolumeName: pvc-5b8e2f31-7c4d-4a9e-8f12-3d6b0a1c9e47
  action: Migrate
  migrate:
    targetNodeRef:
      namespace: simplyblock
      name: prod-worker-4-0
