# A hand-written move of one volume to another storage node of the same
# cluster, based on the repository's sample in
# operator/config/samples/storage_v1alpha2_persistentvolumeops.yaml.
#
# The object is cluster-scoped because a PersistentVolume is, so it carries no
# namespace of its own. It names the volume, not the claim, and the target as a
# StorageNode object, not as a backend UUID. The cluster, pool, and volume UUIDs
# are read from the volume's CSI handle, so no cluster is named here.
apiVersion: storage.simplyblock.io/v1alpha2
kind: PersistentVolumeOps
metadata:
  name: pg-data-to-worker-4
spec:
  persistentVolumeName: pvc-5b8e2f31-7c4d-4a9e-8f12-3d6b0a1c9e47
  action: Migrate
  migrate:
    targetNodeRef:
      namespace: simplyblock
      name: prod-worker-4-0
