# One backup of a whole consistency group, now: one crash-consistent generation
# of the group, every member copied, committed as one unit. It sits beside the
# group's claims, finds them by their membership label, and takes the cluster
# from their volumes. The member copies are recorded as StorageBackups beside
# this object, each labeled storage.simplyblock.io/group-backup with its name.
# Deleting it deletes no copy and no record.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageGroupBackup
metadata:
  name: orders-now
  namespace: app-a
spec:
  source:
    consistencyGroupName: orders
