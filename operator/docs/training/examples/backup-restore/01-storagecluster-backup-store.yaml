# The backup store of a cluster: the S3 location its copies are written to and
# the inventory the operator mirrors into StorageBackup objects. spec.backup is
# a block of the StorageCluster rather than an object of its own, so the whole
# cluster is shown, reduced to the two sizing fields the API requires. The
# block is mutable: a cluster that was created without a store gains one by
# acquiring the field, and every copy already in the bucket, whichever cluster
# wrote it, becomes visible. The Secret beside it holds the two keys the
# control plane reads.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageCluster
metadata:
  name: prod
  namespace: simplyblock
spec:
  maxSubsystemCount: 50
  vcpuCount: 8
  backup:
    endpoint: https://s3.eu-central-1.amazonaws.com
    bucket: prod-simplyblock-backups
    region: eu-central-1
    credentials:
      source: Secret
      secretRef:
        name: prod-backup-store
---
apiVersion: v1
kind: Secret
metadata:
  name: prod-backup-store
  namespace: simplyblock
type: Opaque
stringData:
  access_key_id: AKIAEXAMPLEKEYID
  secret_access_key: example-secret-access-key
