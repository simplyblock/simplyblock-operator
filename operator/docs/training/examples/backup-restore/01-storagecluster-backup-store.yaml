# A storage cluster with a backup store, and the Secret with its keys.
# spec.backup is part of the StorageCluster, so the whole cluster is shown,
# with only the two sizing fields the API requires. The store is sent to the
# control plane when the cluster is created.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageCluster
metadata:
  name: prod
  namespace: simplyblock
spec:
  maxSubsystemCount: 50
  vcpuCount: 8
  backup:
    endpoint: https://s3.eu-central-1.amazonaws.com
    bucket: prod-simplyblock-backups
    region: eu-central-1
    credentials:
      source: Secret
      secretRef:
        name: prod-backup-store
---
apiVersion: v1
kind: Secret
metadata:
  name: prod-backup-store
  namespace: simplyblock
type: Opaque
stringData:
  access_key_id: AKIAEXAMPLEKEYID
  secret_access_key: example-secret-access-key
