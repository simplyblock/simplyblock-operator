# Three claims forming a consistency group. The group is born from the first
# volume provisioned with the storage.simplyblock.io/consistency-group label,
# and every later volume carrying the same value joins it at creation and is
# placed on the same node and logical volume store. A label added to a claim
# whose volume already exists joins nothing today. The group is what a group
# policy, a StorageGroupBackup, and a VolumeGroupSnapshot name.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-db
  namespace: app-a
  labels:
    storage.simplyblock.io/consistency-group: orders
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: simplyblock-prod
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-wal
  namespace: app-a
  labels:
    storage.simplyblock.io/consistency-group: orders
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: simplyblock-prod
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orders-index
  namespace: app-a
  labels:
    storage.simplyblock.io/consistency-group: orders
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: simplyblock-prod
  resources:
    requests:
      storage: 20Gi
