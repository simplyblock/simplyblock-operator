# The bearer token the edge operator authenticates to the central control plane
# with, in the shape the operator reads: a Secret in the operator's namespace
# holding the token under the key token (the key secret is read as well, token
# first). The same value is held on the central site in the Secret its
# controlplane.local.adminTokenSecretRef names, under token, which is what the
# central management API accepts it against. A Kubernetes TokenReview never
# crosses a cluster boundary, so a static token is what links the two sites.
apiVersion: v1
kind: Secret
metadata:
  name: central-control-plane
  namespace: simplyblock
type: Opaque
stringData:
  token: replace-with-the-admin-token-the-central-control-plane-accepts
