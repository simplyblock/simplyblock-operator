# The admin token the edge operator presents to the central control plane.
# The central site accepts the same value through adminTokenSecretRef.
apiVersion: v1
kind: Secret
metadata:
  name: central-control-plane
  # The operator's namespace.
  namespace: simplyblock
type: Opaque
stringData:
  # Read first. The key secret is read when token is absent.
  token: replace-with-the-admin-token-the-central-control-plane-accepts
