# The Helm values of the edge cluster: the managed profile, which installs the
# operator and the CSI driver here and no control plane. The ControlPlane the
# chart hands the operator through the bootstrap ConfigMap points at the
# central management API, and the storage nodes take their image from
# controlplane.managed.storageNodeImage, because a managed control plane is
# another cluster's install and carries no image of its own to fall back to.
# The chart renders no discovery run for this profile, so the OperatorOps is
# written by hand (04-operatorops-discover.yaml).
#
#   helm install simplyblock-operator simplyblock/simplyblock-operator \
#     --namespace simplyblock --create-namespace --values 01-helm-values.yaml
deployment:
  profile: managed

controlplane:
  managed:
    endpoint: https://control.central.example.com
    credentialsSecretRef: central-control-plane
    storageNodeImage: quay.io/simplyblock-io/simplyblock:26.4.0-beta4
