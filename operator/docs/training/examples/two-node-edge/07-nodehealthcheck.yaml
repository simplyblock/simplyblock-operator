# The medik8s NodeHealthCheck that turns the StorageFenced condition into a
# StorageFenceRemediation. The NodeHealthCheck operator must be installed.
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: simplyblock-storage-fenced
spec:
  # The nodes that run a storage node of the cluster edge. The operator sets
  # this label, so an OpenShift arbiter node never matches.
  selector:
    matchLabels:
      io.simplyblock.storagenodeset: edge
  # Lets the check act on one node out of two.
  maxUnhealthy: 1
  unhealthyConditions:
    - type: StorageFenced
      status: "True"
      duration: 2s
  remediationTemplate:
    apiVersion: storage.simplyblock.io/v1alpha2
    kind: StorageFenceRemediationTemplate
    namespace: simplyblock
    name: storage-fence
