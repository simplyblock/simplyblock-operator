# The ControlPlane the chart's managed profile hands the operator. The operator
# installs nothing for it: it probes the endpoint and reports the phase.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ControlPlane
metadata:
  # The only name the operator reconciles.
  name: simplyblock
  namespace: simplyblock
spec:
  source:
    # Fixed at creation: managed cannot become local, or the reverse.
    managed:
      endpoint: http://control.central.example.com
      credentialsSecretRef:
        name: central-control-plane
      storageNodeImage: quay.io/simplyblock-io/simplyblock:26.4.0-beta4
