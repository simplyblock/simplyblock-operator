# The discovery run, written by hand because the managed profile renders none.
apiVersion: storage.simplyblock.io/v1alpha2
kind: OperatorOps
metadata:
  name: edge
  namespace: simplyblock
spec:
  action: Discover
  discover:
    # Only these two nodes are inspected. Every other node stays out.
    workers:
      - edge-0
      - edge-1
    # Both nodes carry the control-plane role on a two-node OpenShift cluster.
    enableControlPlaneNodes: true
