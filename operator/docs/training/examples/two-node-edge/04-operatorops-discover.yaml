# The discovery run of the edge cluster, written by hand because the chart
# renders none for the managed profile. It names the two storage nodes, so
# the run inspects those two and nothing else: an OpenShift arbiter node, or
# any other machine on the site, is never inspected and never proposed. A fleet
# of exactly two is proposed as a two-node cluster, clusterMode Dual with a 1+1
# stripe. The two nodes carry the control-plane role on a two-node OpenShift
# cluster, so the run has to be allowed to use control-plane nodes as well.
apiVersion: storage.simplyblock.io/v1alpha2
kind: OperatorOps
metadata:
  name: edge
  namespace: simplyblock
spec:
  action: Discover
  discover:
    workers:
      - edge-0
      - edge-1
    enableControlPlaneNodes: true
