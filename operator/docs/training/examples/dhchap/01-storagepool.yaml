# A pool whose volumes only two named hosts may connect to. DHCHAP is decided
# here, at creation, inside volumeDefaults, which is immutable once set. The
# allowedNodes list is the part that stays editable, and the operator turns it
# into node labels and into the control plane's allowed hosts for this pool.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StoragePool
metadata:
  name: payments
  namespace: simplyblock
spec:
  clusterRef: production
  allowedNodes:
    - worker-1
    - worker-2
  limits:
    capacity: 20T
  volumeDefaults:
    enableDHCHAP: true
    filesystem: xfs
