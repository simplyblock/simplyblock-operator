# The class for the pool, written by hand. The operator writes a class only for
# a cluster's default pool, so a DHCHAP pool's class is authored, and the
# dhchap_node_selector parameter is what keeps its volumes on the allowed
# hosts. The parameter's value contains the pool's status.uuid, so the class is
# written after the pool is Ready. The cluster id is the cluster's status.uuid.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: simplyblock-production-payments
  labels:
    storage.simplyblock.io/namespace: simplyblock
    storage.simplyblock.io/cluster: production
    storage.simplyblock.io/pool: payments
provisioner: csi.simplyblock.io
parameters:
  cluster_id: b2d4e6f8-1a3c-4e5f-8a9b-0c1d2e3f4a5b
  pool_name: payments
  csi.storage.k8s.io/fstype: xfs
  dhchap_node_selector: storage.simplyblock.io/storage-pool.3f9a1c2e-7b4d-4e8a-9c61-2d5f0a7b8e14
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
