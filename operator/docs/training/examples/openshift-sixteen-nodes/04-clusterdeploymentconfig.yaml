# The draft of the tier after review. The reviewer added the second socket's
# drives and both sockets, so the cluster has 32 storage nodes. The reviewer
# also set the 4+2 scheme, a budget of four workers, and the container size.
# SPDK memory and huge pages are left to simplyblock to compute.
#
#   oc edit cdc discovered-tier -n simplyblock
#   oc get cdc discovered-tier -n simplyblock -w
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: discovered-tier
  namespace: simplyblock
spec:
  approved: true
  environment: OpenShift
  cluster:
    name: tier
    maxSubsystemCount: 100
    vcpuCount: 16
    stripe:
      dataChunks: 4
      parityChunks: 2
    socketsToUse:
      - "0"
      - "1"
    nodesPerSocket: 1
    nodeProvisioningBudget: 4
    enableDriveFormat: true
    fabricType: tcp
    tolerations:
      - key: storage.simplyblock.io/dedicated
        operator: Equal
        value: "true"
        effect: NoSchedule
    containerResources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  nodeSets:
    - name: discovered
      groups:
        - name: eight-drive
          workers:
            - storage-01
            - storage-02
            - storage-03
            - storage-04
            - storage-05
            - storage-06
            - storage-07
            - storage-08
            - storage-09
            - storage-10
          mgmtInterface: br-ex
          dataInterfaces:
            - ens2f0
          reservedSystemCPU: 0-3
          devices:
            nvme:
              - "0000:5e:00.0"
              - "0000:5f:00.0"
              - "0000:60:00.0"
              - "0000:61:00.0"
              - "0000:af:00.0"
              - "0000:b0:00.0"
              - "0000:b1:00.0"
              - "0000:b2:00.0"
        - name: four-drive
          workers:
            - storage-11
            - storage-12
            - storage-13
            - storage-14
            - storage-15
            - storage-16
          mgmtInterface: br-ex
          dataInterfaces:
            - ens2f0
          reservedSystemCPU: 0-3
          devices:
            nvme:
              - "0000:5e:00.0"
              - "0000:5f:00.0"
              - "0000:af:00.0"
              - "0000:b0:00.0"
