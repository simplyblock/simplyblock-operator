# A discovery run over six workers labeled cabinet=cabinet-a, cabinet-b, or
# cabinet-c. failureDomainLabel names the label to read, and
# enableFailureDomains turns failure-domain mode on in the draft. The draft is
# named discovered-cabinets.
apiVersion: storage.simplyblock.io/v1alpha2
kind: OperatorOps
metadata:
  name: cabinets
  namespace: simplyblock
spec:
  action: Discover
  discover:
    failureDomainLabel: cabinet
    enableFailureDomains: true
    enablePartitionedDevices: true
