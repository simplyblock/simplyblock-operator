# The draft the run wrote, as it reads after review: six workers in three
# cabinets of two, one group per cabinet, and failure-domain mode on. The run
# grouped the workers by hardware and by failure domain, so it produced three
# groups on its own and named them group-1-nvme-2x3.49T and so on, and the
# reviewer renamed them after their cabinets, shortened the cluster's name,
# and set approved. The layout passes the activation rule for a 1+1 stripe:
# three distinct domains, two workers in each.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: discovered-cabinets
  namespace: simplyblock
spec:
  approved: true
  environment: OpenShift
  cluster:
    name: cabinets
    maxSubsystemCount: 50
    vcpuCount: 8
    minHugePagesSize: 32G
    stripe:
      dataChunks: 1
      parityChunks: 1
    fabricType: tcp
    enableFailureDomains: true
    nodeProvisioningBudget: 2
  nodeSets:
    - name: cabinets
      groups:
        - name: cabinet-a
          failureDomain: cabinet-a
          workers:
            - worker-0
            - worker-1
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: cabinet-b
          failureDomain: cabinet-b
          workers:
            - worker-2
            - worker-3
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: cabinet-c
          failureDomain: cabinet-c
          workers:
            - worker-4
            - worker-5
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
