# The reviewed draft: six workers in three cabinets of two, one node set, one
# group per cabinet, and failure-domain mode on. A 1+1 stripe needs three
# domains of equal size, and this layout has them. The groups were renamed
# after their cabinets, cluster.name was shortened, and approved was set.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: discovered-cabinets
  namespace: simplyblock
spec:
  approved: true
  environment: OpenShift
  cluster:
    name: cabinets
    maxSubsystemCount: 50
    vcpuCount: 8
    minHugePagesSize: 32G
    stripe:
      dataChunks: 1
      parityChunks: 1
    fabricType: tcp
    enableFailureDomains: true
    nodeProvisioningBudget: 2
  nodeSets:
    - name: cabinets
      groups:
        - name: cabinet-a
          failureDomain: cabinet-a
          workers:
            - worker-0
            - worker-1
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: cabinet-b
          failureDomain: cabinet-b
          workers:
            - worker-2
            - worker-3
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: cabinet-c
          failureDomain: cabinet-c
          workers:
            - worker-4
            - worker-5
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
