# The Helm values of a standalone install on an OpenShift cluster whose six
# workers stand in three cabinets. The chart's own discovery run reads failure
# domains from topology.kubernetes.io/zone and offers no value for another
# label, so on a fleet that labels cabinets the chart's run is turned off and
# the run is written by hand (02-operatorops-discover.yaml). Everything else
# is what chapter 1 installed.
#
#   helm install simplyblock-operator simplyblock/simplyblock-operator \
#     --namespace simplyblock --create-namespace --values 01-helm-values.yaml
deployment:
  profile: standalone

tls:
  enabled: true
  provider: openshift
  mutual_enabled: false

discovery:
  enabled: false
