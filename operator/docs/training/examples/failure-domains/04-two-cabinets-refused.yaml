# The refusal example: the same six workers in two cabinets of three, with
# failure-domain mode on and a 1+1 stripe. The API admits the document, because
# nothing in its schema is wrong, and validation refuses it on every pass with
# FailureDomainLayout, so it is held in Draft with this status.message:
#
#   failure-domain mode with 1+1 needs at least 3 distinct failure domains (the
#   stripe's parity plus two), and the workers are in 2 (cabinet-a: 3,
#   cabinet-b: 3)
#
# It is shown to be read, not applied. Approving it as it stands turns the hold
# into a failure, because an approved document can no longer be edited.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: discovered-two-cabinets
  namespace: simplyblock
spec:
  approved: false
  environment: OpenShift
  cluster:
    name: two-cabinets
    maxSubsystemCount: 50
    vcpuCount: 8
    minHugePagesSize: 32G
    stripe:
      dataChunks: 1
      parityChunks: 1
    fabricType: tcp
    enableFailureDomains: true
  nodeSets:
    - name: two-cabinets
      groups:
        - name: cabinet-a
          failureDomain: cabinet-a
          workers:
            - worker-0
            - worker-1
            - worker-2
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
        - name: cabinet-b
          failureDomain: cabinet-b
          workers:
            - worker-3
            - worker-4
            - worker-5
          mgmtInterface: br-ex
          dataInterfaces:
            - br-ex
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
