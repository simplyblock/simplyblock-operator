# A fourth placement group, added after the supercluster is Online. The
# document names the supercluster in clusterRef, so each of its node sets
# becomes a new member rather than nodes of an existing one. The sizing of the
# new member is stated in spec.cluster as on a creating document: the schema
# requires cluster.name and the expansion does not use it, because the
# supercluster already has one. Three of the 32 workers are listed and a
# comment stands for the rest.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: grow-prod-pg-d
  namespace: simplyblock
spec:
  approved: true
  environment: OpenShift
  clusterRef: prod
  cluster:
    name: prod
    maxSubsystemCount: 50
    vcpuCount: 8
    minHugePagesSize: 64G
    stripe:
      dataChunks: 4
      parityChunks: 2
    fabricType: tcp
    socketsToUse:
      - "0"
    nodesPerSocket: 1
    nodeProvisioningBudget: 4
  nodeSets:
    - name: pg-d
      groups:
        - name: default
          workers:
            - worker-097
            - worker-098
            - worker-099
            # ... through worker-128, 32 workers in the real document
          mgmtInterface: br-ex
          dataInterfaces:
            - ens2f0
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
