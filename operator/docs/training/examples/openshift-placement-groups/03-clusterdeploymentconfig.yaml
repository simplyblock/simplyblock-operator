# The draft the run wrote, as it reads after review: one cluster template and
# three node sets, one per placement-group label value, each of 32 workers.
# Three node sets make the document a supercluster document, so approval
# creates the supercluster prod and one member per node set. Every group below
# lists its first workers and a comment stands for the rest: the real document
# names all 32 of each node set, one PCI address per device, with nothing left
# to a filter.
apiVersion: storage.simplyblock.io/v1alpha2
kind: ClusterDeploymentConfig
metadata:
  name: discovered-prod
  namespace: simplyblock
spec:
  approved: true
  environment: OpenShift
  cluster:
    name: prod
    maxSubsystemCount: 50
    vcpuCount: 8
    minHugePagesSize: 64G
    stripe:
      dataChunks: 4
      parityChunks: 2
    fabricType: tcp
    socketsToUse:
      - "0"
    nodesPerSocket: 1
    nodeProvisioningBudget: 4
  nodeSets:
    - name: pg-a
      groups:
        - name: default
          workers:
            - worker-001
            - worker-002
            - worker-003
            # ... through worker-032, 32 workers in the real document
          mgmtInterface: br-ex
          dataInterfaces:
            - ens2f0
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
    - name: pg-b
      groups:
        - name: default
          workers:
            - worker-033
            - worker-034
            - worker-035
            # ... through worker-064, 32 workers in the real document
          mgmtInterface: br-ex
          dataInterfaces:
            - ens2f0
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
    - name: pg-c
      groups:
        - name: default
          workers:
            - worker-065
            - worker-066
            - worker-067
            # ... through worker-096, 32 workers in the real document
          mgmtInterface: br-ex
          dataInterfaces:
            - ens2f0
          devices:
            nvme:
              - "0000:c1:00.0"
              - "0000:c2:00.0"
