# A pool on the supercluster. It is created under this name in every placement
# group. The capacity limit is shared evenly by the groups that take volumes.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StoragePool
metadata:
  name: prod-databases
  namespace: simplyblock
spec:
  clusterRef: prod
  limits:
    capacity: 300T
  volumeDefaults:
    filesystem: xfs
