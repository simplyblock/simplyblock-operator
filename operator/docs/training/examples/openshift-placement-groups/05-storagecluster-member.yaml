# One placement group, created by the operator from node set pg-a. It has the
# template's sizing, the node set's interfaces, and superclusterRef naming the
# supercluster. The suffix kqv is random. Shortened to the fields the chapter
# discusses.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageCluster
metadata:
  name: prod-pg-a-kqv
  namespace: simplyblock
spec:
  superclusterRef: prod
  maxSubsystemCount: 50
  vcpuCount: 8
  minHugePagesSize: 64G
  stripe:
    dataChunks: 4
    parityChunks: 2
  fabricType: tcp
  deviceClass: NVMe
  storageNodes:
    mgmtInterface: br-ex
    dataInterfaces:
      - ens2f0
    socketsToUse:
      - "0"
    nodesPerSocket: 1
    nodeProvisioningBudget: 4
    enableFormat4K: true
    enableCpuTopology: true
    enableKubeletConfiguration: true
    openshift:
      machineConfigPool: worker
