# One member, as the expansion writes it from node set pg-a: the template's
# sizing, the node set's interfaces, the flags spec.environment resolved to,
# and superclusterRef naming the supercluster. The suffix kqv was drawn when
# the member was named and carries no meaning. Nobody writes this object by
# hand on this path, and the fields the expansion copies from the template are
# abbreviated to the ones the chapter reads.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageCluster
metadata:
  name: prod-pg-a-kqv
  namespace: simplyblock
spec:
  superclusterRef: prod
  maxSubsystemCount: 50
  vcpuCount: 8
  minHugePagesSize: 64G
  stripe:
    dataChunks: 4
    parityChunks: 2
  fabricType: tcp
  deviceClass: NVMe
  storageNodes:
    mgmtInterface: br-ex
    dataInterfaces:
      - ens2f0
    socketsToUse:
      - "0"
    nodesPerSocket: 1
    nodeProvisioningBudget: 4
    enableFormat4K: true
    enableCpuTopology: true
    enableKubeletConfiguration: true
    openshift:
      machineConfigPool: worker
