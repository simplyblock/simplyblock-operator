# The supercluster. The operator creates it with spec.supercluster empty. An
# administrator then set the placement strategy and the two thresholds, the
# only other fields a supercluster allows.
apiVersion: storage.simplyblock.io/v1alpha2
kind: StorageCluster
metadata:
  name: prod
  namespace: simplyblock
spec:
  supercluster:
    placement:
      strategy: MostAvailableCapacity
  warningThreshold:
    capacity: 80
  criticalThreshold:
    capacity: 90
