# ArgoCD Application that syncs the storage plane: the approved
# ClusterDeploymentConfig in storage/. The operator expands it into the
# StorageCluster and StorageNodeSet, which ArgoCD does not track.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simplyblock-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<org>/<gitops-repo>.git
    targetRevision: main
    path: simplyblock/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: simplyblock
  syncPolicy:
    automated:
      # A ClusterDeploymentConfig removed from git must not take the storage
      # cluster with it; deleting one stays a deliberate kubectl delete.
      prune: false
      selfHeal: true
    syncOptions:
      # The kind is served only once the simplyblock Application has synced.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        maxDuration: 5m
