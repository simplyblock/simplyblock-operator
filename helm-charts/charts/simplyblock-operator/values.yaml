    name: defaultbackend
    image:
      registry: "quay.io/simplyblock-io"
      image: defaultbackend-amd64
      tag: "1.5"
tls:
  # On by default. Everything this chart deploys reaches the control plane over
  # the pod network, and the control plane holds every cluster definition, node
  # registration, and volume record, so plaintext is a deployment's decision to
  # state rather than the one it reaches by leaving a value alone.
  #
  # It requires an issuer: with provider=cert-manager the chart refuses to render
  # where cert-manager.io/v1 is not served, and with provider=openshift it
  # refuses off OpenShift. A cluster that has neither sets this to false.
  enabled: true

  # Provider responsible for issuing serving certificates. One of: openshift, cert-manager. Required if enabled.
  provider: cert-manager

  # Required if provider == cert-manager. Names a ClusterIssuer used to mint
  # the chart's own CA Certificate.
  cert-manager:
    # When true, the chart creates a self-signed ClusterIssuer whose name is
    # given by cluster-issuer. Set to false to use an issuer you created yourself.
    createSelfSignedIssuer: true
    cluster-issuer: selfsigned
    # Namespace where cert-manager is installed. The chart's CA secret is placed
    # here so that the ClusterIssuer can locate it (ClusterIssuers always read CA
    # secrets from the cert-manager controller namespace).
    namespace: cert-manager

  # Mutual TLS (clients present and verify certificates). Only allowed when
  # provider == cert-manager. On by default, with tls.enabled: the chart issues a
  # client certificate for each of the operator, the two CSI plugins, Prometheus,
  # and FoundationDB's peers, so there is nothing left for a deployment to
  # provision before it can be required.
  mutual_enabled: true
