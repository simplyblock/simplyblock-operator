deployment:
  # One of: standalone, managed.
  #
  # standalone hosts its own control plane. The operator installs FoundationDB,
  # the object store, and the management API from the ControlPlane object this
  # chart writes.
  #
  # managed registers this cluster's storage with a control plane elsewhere,
  # named by controlplane.managed below. Nothing is installed here.
  #
  # Observability under controlplane is rendered for standalone only: it stores
  # what it collects in the object store a hosted control plane brings.
  profile: standalone

# The CSI driver, as the SimplyblockDriver the chart renders for every profile
# that runs one.
#
# The plugins themselves are the operator's: it applies the DaemonSet, the
# StatefulSet, their RBAC, and the CSIDriver registration from this object, so
# these values reach them through a spec rather than through a template. What
# each one replaces is in design-simplyblockdriver.md §8.
#
# An empty field means whatever this operator release ships, which is the
# pairing the release was tested as. Set one only to move away from it.
driver:
  # The CSI driver name a StorageClass provisions with.
  #
  # It is immutable once the object exists, and every PersistentVolume the
  # driver created records it, so changing it later orphans every volume rather
  # than renaming anything. An upgraded cluster registered under another name has
  # to set it here before the operator adopts the running deployment.
  driverName: csi.simplyblock.io

  # The plugin image both plugins run. Empty takes the operator's own registry
  # and tag with the CSI driver's repository.
  image:
    repository: ""
    tag: ""
    # Always, because the default image follows a moving tag: IfNotPresent
    # against a tag that was rebuilt leaves some workers on the old plugin and
    # some on the new one.
    pullPolicy: Always

  # Instances of the controller plugin, which is what provisions volumes.
  controllerReplicas: 1

  # Where the node plugin runs. Empty is every schedulable worker, which is the
  # usual case: a worker that cannot attach a volume cannot run a workload that
  # needs one.
  nodeSelector: {}
  tolerations: []

  # Where the controller plugin runs. This is ordinary pod placement for one
  # workload, unlike the pair above.
  controllerNodeSelector: {}
  controllerTolerations: []

  # Whether snapshot support is part of this deployment: the VolumeSnapshotClass
  # for driverName, and the CRDs and a controller where the cluster serves
  # neither.
  enableVolumeSnapshots: true

  # Authenticate both plugins to the management API with their pod's
  # service-account token instead of the static cluster secret.
  #
  # Set it together with controlplane.trustCSIServiceAccounts above. This is the
  # plugins' half and that is the control plane's: one without the other is
  # either a driver whose tokens are refused, or a control plane trusting
  # accounts nothing presents.
  enableServiceAccountAuth: false

  # Overrides for the seven CSI sidecars, as full `repository:tag` references.
  # Empty takes the version this operator release ships, which is the
  # combination it was tested against. csiAddons's own default is already the
  # real upstream image (quay.io/csiaddons/k8s-sidecar) rather than a
  # quay.io/simplyblock-io mirror, which does not exist yet -- see
  # SimplyblockDriverSpec.SidecarImages.CSIAddons.
  sidecarImages:
    provisioner: ""
    attacher: ""
    resizer: ""
    snapshotter: ""
    healthMonitor: ""
    nodeDriverRegistrar: ""
    csiAddons: ""

controlplane:
  # deployment.profile: standalone options -- this cluster's own control plane.
  local:
    # Secret in this namespace holding a static admin bearer token this
    # control plane accepts, under `token`, in addition to this operator's
    # own Kubernetes identity. It is what lets a cluster this control plane
    # manages remotely (deployment.profile: managed there,
    # controlplane.managed.credentialsSecretRef naming the same value) create
    # its backend cluster identity, since a Kubernetes TokenReview can never
    # cross a cluster boundary. Empty grants no additional admin credential.
    adminTokenSecretRef: ""

  # Where the control plane is, for deployment.profile: managed.
  managed:
    # Base URL of the management API. Required for that profile. A loopback or
    # link-local address is rejected.
    endpoint: ""
    # Secret in this namespace holding the bearer token, under `token` or
    # `secret`. Empty sends no token.
    credentialsSecretRef: ""
    # Secret holding the CA the endpoint is verified against, under `ca.crt` or
    # `tls.crt`. Empty uses the system trust store. Named and unusable fails.
    caBundleSecretRef: ""

  # Accept a pod's service-account token from the CSI driver's two accounts
  # instead of requiring the static cluster secret. This is the control
  # plane's half of the switch: set it together with
  # spec.enableServiceAccountAuth on the SimplyblockDriver, which is what
  # makes the plugins present a token in the first place.
  trustCSIServiceAccounts: false

  observability:
    enabled: false
    secret: "sWbpOgba1bKnCfcPkVQi"
    deletionInterval: "3d"
    level: "DEBUG"
    # Parser used by fluent-bit to read /var/log/containers/*.log.
    # "cri" is correct for every CRI runtime (containerd and CRI-O), which covers
    # OpenShift, vanilla Kubernetes >= 1.24, k3s/RKE2, Talos, kind and the managed
    # clouds. Only set this to "docker" on legacy dockershim clusters (k8s <= 1.23),
    # which write Docker JSON log files instead.
    logParser: "cri"
    graylog:
      repository: quay.io/simplyblock-io/graylog
      tag: "5.0"
      pullPolicy: Always 
      rootPasswordSha2: "b87c15a8ae4736d771ca60a7cc2014baaeab19b11c31f5fedef9421958a403c9"
      passwordSecret: "is6SP2EdWg0NdmVGv6CEp5hRHNL7BKVMFem4t9pouMqDQnHwXMSomas1qcbKSt5yISr8eBHv4Y7Dbswhyz84Ut0TW6kqsiPs"
      maxNumberIndex: "3"
      retentionPeriod: "7d"
    grafana:
      repository: quay.io/simplyblock-io/grafana
      tag: 10.0.12
      pullPolicy: IfNotPresent
      endpoint: ""
      # Receivers Grafana provisions into the "grafana-alerts" contact point.
      # Every enabled channel is notified for every simplyblock alert. With none
      # of them enabled, no contact point and no notification policy are
      # provisioned, and Grafana's own default policy stays in place.
      #
      # The credentials below are rendered into the simplyblock-grafana-alerting
      # ConfigMap, so read access to the release namespace is read access to
      # them.
      notifications:
        slack:
          enabled: false
          # Incoming webhook URL of the channel the alerts are posted to.
          url: ""
        teams:
          # Microsoft Teams, through an incoming webhook or a workflow URL.
          enabled: false
          url: ""
        pagerduty:
          enabled: false
          # Integration key of an Events API v2 service.
          integrationKey: ""
          # One of info, warning, error, or critical.
          severity: "critical"
          # Optional PagerDuty event fields, left to PagerDuty's defaults when
          # empty. Every one of them accepts a Grafana notification template.
          class: ""
          component: ""
          group: ""
        opsgenie:
          enabled: false
          apiKey: ""
          # https://api.eu.opsgenie.com/v2/alerts for accounts in the EU region.
          apiUrl: "https://api.opsgenie.com/v2/alerts"
          # Close the Opsgenie alert when the Grafana alert resolves.
          autoClose: true
          # Derive the Opsgenie priority from an og_priority alert label.
          overridePriority: false
          # How alert labels are carried over: tags, details, or both.
          sendTagsAs: "tags"
        webhook:
          # Generic receiver, sent Grafana's own alert JSON payload unmodified.
          enabled: false
          url: ""
          # POST or PUT.
          httpMethod: "POST"
          # Basic authentication. Left out of the request when username is empty.
          username: ""
          password: ""
          # Authorization header, as an alternative to basic authentication:
          # scheme "Bearer" with the token as the credentials, for example.
          authorizationScheme: ""
          authorizationCredentials: ""
          # Cap on the alerts in a single notification. 0 sends all of them.
          maxAlerts: 0
    thanos:
      repository: quay.io/simplyblock-io/thanos
      tag: v0.31.0
      pullPolicy: IfNotPresent
    minio:
      repository: quay.io/simplyblock-io/minio
      tag: RELEASE.2024-01-16T16-07-38Z
      pullPolicy: IfNotPresent
      mcRepository: quay.io/simplyblock-io/minio-client
      mcTag: RELEASE.2024-01-16T16-06-34Z
      bucket: thanos
      accessKey: minioadmin
      secretKey: minioadmin
      storageSize: 50Gi
      storageClass:
    fluentbit:
      repository: quay.io/simplyblock-io/fluent-bit
      tag: "1.8.11"
      pullPolicy: IfNotPresent

  tolerations:
    create: false
    list:
    - operator: Exists
      effect:
      key: 
      value:
  nodeSelector:
    create: false
    key: 
    value:

  ports:
    lvolNvmfPortStart: 9110

  csiHostpathDriver:
    enabled: false
    image:
      csiProvisioner:
        repository: quay.io/simplyblock-io/csi-provisioner
        tag: v6.0.0
      csiResizer:
        repository: quay.io/simplyblock-io/csi-resizer
        tag: v2.0.0
      nodeDriverRegistrar:
        repository: quay.io/simplyblock-io/csi-node-driver-registrar
        tag: v2.12.0
      hostpathPlugin:
        repository: quay.io/simplyblock-io/hostpathplugin
        tag: v1.15.0
      livenessProbe:
        repository: quay.io/simplyblock-io/livenessprobe
        tag: v2.15.0

  storageclass:  
    name:  
    allowedTopologyZones: []

  foundationdb:
    enabled: true
    multiAZ: false
    # redundancyMode controls FDB coordinator count:
    # "double" = 3 coordinators (suitable for 3 workers, tolerates 1 failure)
    # "triple" = 5 coordinators (suitable for 5+ workers, tolerates 2 failures)
    redundancyMode: double
    # nodeSelector pins FDB pods to dedicated nodes, leaving the remaining
    # storage workers as non-FDB nodes that can be added in parallel.
    # Label target nodes first: kubectl label node <node> simplyblock.io/fdb-node=true
    # Example:
    #   nodeSelector:
    #     simplyblock.io/fdb-node: "true"
    nodeSelector: {}
    image:
      operator:
        repository: quay.io/simplyblock-io/fdb-kubernetes-operator
        tag: v2.13.0
      monitor:
        repository: quay.io/simplyblock-io/fdb-kubernetes-monitor
        tag: "7.3.63"
      # Set baseImage to use a custom FDB image registry. With imageType: unified
      # the same fdb-kubernetes-monitor image runs as the foundationdb container,
      # so this points at the monitor repo. When empty, no imageConfigs block is
      # rendered and the operator uses its default.
      mainContainer:
        baseImage: "quay.io/simplyblock-io/fdb-kubernetes-monitor"
    # Prometheus exporter for the FoundationDB cluster. Reads the machine-readable
    # `status json` via the multi-version FDB client and exposes DB-level metrics
    # (workload, latency, storage, coordinator health) on :9444/metrics.
    # Upstream: https://github.com/aikoven/foundationdb-exporter
    exporter:
      enabled: true
      image:
        repository: aikoven/foundationdb-exporter
        tag: "3.1.0"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

operator:
  openShiftCluster: true

# How a volume's move is raised. The operator raises one when the rebalancer
# moves a volume off a hot node, when a node is drained, and when a claim is
# pinned to a node it is not on.
#
# The redesigned PersistentVolumeOps is the default and the registered
# VolumeMigration is opt-in. Turn the registered kind back on for an upgrade,
# and only for as long as the migrations already raised against it take to
# drain: a rename and a scope change make a new CRD rather than a new version,
# so an in-flight migration cannot be carried across and is left to finish on
# the kind it started on.
volumeMigration:
  legacy: false

# The CSI link: the CSI node and controller pods dial the operator and hold the
# connection open, so the operator can query a node's storage state without
# anything listening on the node. Always on: the operator serves the endpoint
# and both plugins dial it.
csiLink:
  # Port the operator listens on, and the Service that fronts it.
  port: 9500

  # Optional. Secret holding the operator's serving certificate (keys tls.crt /
  # tls.key), whose SANs must cover the service name below; with cert-manager,
  # point a Certificate at it. Empty serves the link without TLS, and the CSI
  # pods dial plaintext to match, so the tokens they present travel in the
  # clear. Set it on a cluster where that matters.
  certSecret: ""

  # Name the CSI pods verify against that certificate, and dial.
  serviceName: simplyblock-csi-link

  # The CSI pods read the CA from the simplyblock-csi-link-ca ConfigMap, mounted
  # optional. No ConfigMap means no TLS, which matches an empty certSecret.

  # Audience the CSI pods' projected tokens carry, and the operator requires. A
  # token bound to no particular audience is one anything holding it can replay
  # against the operator.
  audience: simplyblock-csi-link
# The aggregated metrics API, served by the operator at
# metrics.simplyblock.io/v1alpha2. It publishes two readings, both computed on
# demand and never stored: LogicalVolumeMetrics, the space each logical volume
# actually occupies, read with `kubectl get lvm -n <namespace>` and confined to a
# tenant's own claims by ordinary namespaced RBAC; and StorageDeviceMetrics, the
# space each storage device holds, read with `kubectl get sdm -n <namespace>` in
# the namespace the storage cluster's own CRs live in.
#
# Disabling it removes the APIService, the Service, and the delegated-auth
# bindings, and starts the operator with --enable-metrics-api=false. Nothing else
# depends on it: no reconciler reads the readings, and no volume behaves
# differently when it is off.
metricsAPI:
  enabled: true
  # The container port the kube-apiserver is proxied to. Change it only on a
  # conflict; the Service and the APIService follow this value.
  port: 6443
  # Where the capacity samples are read from. A logical volume's used size is
  # not in the control plane's own API, only in the metrics it exports, so an
  # empty value serves each volume's provisioned size and nothing measured.
  prometheusURL: http://simplyblock-prometheus:9090

