controlplane:
  # Accept a pod's service-account token from the CSI driver's two accounts
  # instead of requiring the static cluster secret. This is the control
  # plane's half of the switch: set it together with
  # spec.enableServiceAccountAuth on the SimplyblockDriver, which is what
  # makes the plugins present a token in the first place.
  trustCSIServiceAccounts: false

  observability:
    enabled: false
    secret: "sWbpOgba1bKnCfcPkVQi"
    deletionInterval: "3d"
    level: "DEBUG"
    # Parser used by fluent-bit to read /var/log/containers/*.log.
    # "cri" is correct for every CRI runtime (containerd and CRI-O), which covers
    # OpenShift, vanilla Kubernetes >= 1.24, k3s/RKE2, Talos, kind and the managed
    # clouds. Only set this to "docker" on legacy dockershim clusters (k8s <= 1.23),
    # which write Docker JSON log files instead.
    logParser: "cri"
    graylog:
      repository: quay.io/simplyblock-io/graylog
      tag: "5.0"
      pullPolicy: Always 
      rootPasswordSha2: "b87c15a8ae4736d771ca60a7cc2014baaeab19b11c31f5fedef9421958a403c9"
      passwordSecret: "is6SP2EdWg0NdmVGv6CEp5hRHNL7BKVMFem4t9pouMqDQnHwXMSomas1qcbKSt5yISr8eBHv4Y7Dbswhyz84Ut0TW6kqsiPs"
      maxNumberIndex: "3"
      retentionPeriod: "7d"
    grafana:
      repository: quay.io/simplyblock-io/grafana
      tag: 10.0.12
      pullPolicy: IfNotPresent
      # Alert rules derived from the control plane's cluster event log rather
      # than from Thanos. The event log carries what the metrics cannot: the
      # transition a node, device, or cluster made, and therefore whether an
      # operator asked for it. Reading it needs a REST data source, which is
      # what the Infinity plugin below provides.
      eventAlerts:
        enabled: false
        # Every rule reads the newest `logLimit` records of the event log and
        # folds them into the current state of each node, device, and cluster.
        # A limit too low silently heals an alert whose opening transition has
        # scrolled out of the window, so raise it on a cluster that produces
        # events quickly; every rule evaluation pays for it in one request.
        logLimit: 1000
        # How often the rules run, and how long a condition must hold before it
        # notifies. Both are Grafana durations.
        interval: 1m
        for: 1m
        plugin:
          # The Grafana image this chart deploys is a plain upstream mirror with
          # no plugins in it, and /var/lib/grafana is an emptyDir, so the plugin
          # is fetched on every pod start. Grafana's entrypoint reads
          # GF_INSTALL_PLUGINS as a URL, a semicolon, and an install folder.
          #
          # 2.12.2 is the last Infinity release whose grafanaDependency
          # (>=9.5.15) admits the Grafana 10.0.12 pinned above; every release
          # still in the plugin catalog requires >=10.4.8. Moving Grafana
          # forward is what unpins this.
          url: "https://grafana.com/api/plugins/yesoreyeram-infinity-datasource/versions/2.12.2/download"
          # Set to true once the plugin is baked into the Grafana image, which
          # is what an air-gapped or restart-sensitive install wants: the
          # download is ~74 MB and repeats on every pod start.
          preinstalled: false
      endpoint: ""
      # Receivers Grafana provisions into the "grafana-alerts" contact point.
      # Every enabled channel is notified for every simplyblock alert. With none
      # of them enabled, no contact point and no notification policy are
      # provisioned, and Grafana's own default policy stays in place.
      #
      # The credentials below are rendered into the simplyblock-grafana-alerting
      # ConfigMap, so read access to the release namespace is read access to
      # them.
      notifications:
        slack:
          enabled: false
          # Incoming webhook URL of the channel the alerts are posted to.
          url: ""
        teams:
          # Microsoft Teams, through an incoming webhook or a workflow URL.
          enabled: false
          url: ""
        pagerduty:
          enabled: false
          # Integration key of an Events API v2 service.
          integrationKey: ""
          # One of info, warning, error, or critical.
          severity: "critical"
          # Optional PagerDuty event fields, left to PagerDuty's defaults when
          # empty. Every one of them accepts a Grafana notification template.
          class: ""
          component: ""
          group: ""
        opsgenie:
          enabled: false
          apiKey: ""
          # https://api.eu.opsgenie.com/v2/alerts for accounts in the EU region.
          apiUrl: "https://api.opsgenie.com/v2/alerts"
          # Close the Opsgenie alert when the Grafana alert resolves.
          autoClose: true
          # Derive the Opsgenie priority from an og_priority alert label.
          overridePriority: false
          # How alert labels are carried over: tags, details, or both.
          sendTagsAs: "tags"
        webhook:
          # Generic receiver, sent Grafana's own alert JSON payload unmodified.
          enabled: false
          url: ""
          # POST or PUT.
          httpMethod: "POST"
          # Basic authentication. Left out of the request when username is empty.
          username: ""
          password: ""
          # Authorization header, as an alternative to basic authentication:
          # scheme "Bearer" with the token as the credentials, for example.
          authorizationScheme: ""
          authorizationCredentials: ""
          # Cap on the alerts in a single notification. 0 sends all of them.
          maxAlerts: 0
