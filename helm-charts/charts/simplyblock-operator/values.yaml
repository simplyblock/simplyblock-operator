          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

operator:
  enabled: true
  openShiftCluster: true

# The CSI link: the CSI node and controller pods dial the operator and hold the
# connection open, so the operator can query a node's storage state without
# anything listening on the node. Off by default; it needs a serving
# certificate, which is why it is not simply on.
csiLink:
  enabled: false

  # Port the operator listens on, and the Service that fronts it.
  port: 9500

  # Secret holding the operator's serving certificate (keys tls.crt / tls.key).
  # Its SANs must cover the service name below. With cert-manager, point a
  # Certificate at this Secret.
  certSecret: simplyblock-csi-link-cert

  # Name the CSI pods verify against that certificate, and dial.
  serviceName: simplyblock-csi-link

  # CA bundle that signs the certificate, as a ConfigMap key. Leave the
  # ConfigMap empty to fall back to the system roots (only right for a
  # publicly rooted certificate).
  caConfigMap: simplyblock-csi-link-ca
  caKey: ca.crt

  # Audience the CSI pods' projected tokens carry, and the operator requires. A
  # token bound to no particular audience is one anything holding it can replay
  # against the operator.
  audience: simplyblock-csi-link
# The aggregated metrics API, served by the operator at
# metrics.simplyblock.io/v1alpha1. It publishes LogicalVolumeMetrics: the space
# each logical volume actually occupies, read with
# `kubectl get lvm -n <namespace>` and confined to a tenant's own claims by
# ordinary namespaced RBAC.
#
# Disabling it removes the APIService, the Service, and the delegated-auth
# bindings, and starts the operator with --enable-metrics-api=false. Nothing else
# depends on it: no reconciler reads the readings, and no volume behaves
# differently when it is off.
metricsAPI:
  enabled: true
  # The container port the kube-apiserver is proxied to. Change it only on a
  # conflict; the Service and the APIService follow this value.
  port: 6443
  # Where the capacity samples are read from. A logical volume's used size is
  # not in the control plane's own API, only in the metrics it exports, so an
  # empty value serves each volume's provisioned size and nothing measured.
  prometheusURL: http://simplyblock-prometheus:9090

