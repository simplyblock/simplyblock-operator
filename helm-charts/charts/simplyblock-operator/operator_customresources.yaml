apiVersion: storage.simplyblock.io/v1alpha1
kind: StorageCluster
metadata:
  name: simplyblock-cluster
  namespace: simplyblock
spec:
  fabricType: tcp
  # enableNodeAffinity: false
  # clientDataIfname: eth1
  # nvmfBasePort: 4420
  # rpcBasePort: 9502
  # snodeApiPort: 8090
  # Cluster-wide storage-node sizing — required, and applies to every storage
  # node in the cluster. maxSubsystemCount must not exceed the backend's
  # MAX_SUBSYSTEMS_PER_NODE (75); vcpuCount is an explicit core count.
  maxSubsystemCount: 50
  vcpuCount: 8
  # maxHugePagesSize: "100G"
  stripe:
    dataChunks: 1
    parityChunks: 1
  warningThreshold:
    capacity: 80
    provisionedCapacity: 80
  criticalThreshold:
    capacity: 90
    provisionedCapacity: 90
  hashicorpVaultSettings:
    baseURL: https://vault.example.com:8200

---
apiVersion: storage.simplyblock.io/v1alpha1
kind: StoragePool
metadata:
  name: simplyblock-pool
  namespace: simplyblock
spec:
  clusterName: simplyblock-cluster
  # capacityLimit: 500G
  # logicalVolumeMaxSize: 50G
  # dhchap: false
  # allowedNodes:
  #   - worker-node-1
  #   - worker-node-2
  #   - worker-node-3
  # qos:
  #   iops: 10000
  #   throughput:
  #     read: 500
  #     write: 250
  #     readWrite: 750
  # storageClassParameters:
  #   encryption: false
  #   fabric: tcp
  #   filesystem: ext4
  #   maxNamespacePerSubsys: "1"
  #   qosRMbytes: "0"
  #   qosWMbytes: "0"
  #   qosRwMbytes: "0"
  #   qosRwIops: "0"
  #   tune2fsReservedBlocks: "0"

---
apiVersion: storage.simplyblock.io/v1alpha1
kind: StorageNodeSet
metadata:
  name: simplyblock-node
  namespace: simplyblock
spec:
  clusterName: simplyblock-cluster
  # clusterImage: "quay.io/simplyblock-io/simplyblock:26.2.2-PRE"
  # spdkImage: "quay.io/simplyblock-io/spdk:26.2.2-PRE"
  # spdkProxyImage: "quay.io/simplyblock-io/simplyblock:26.2.2-PRE"
  #spdkSystemMemory: 4G
  mgmtIfname: br-ex
  dataIfname:
    - br-ex
  workerNodes: []
    # - worker-node-1
    # - worker-node-2
    # - worker-node-3
  # enableJournalDevice: false
  nodesPerSocket: 1
  reservedSystemCPU: "0,1"
  socketsToUse:
    - "0"
  journalManager:
    count: 3
    percentPerDevice: 3
  # deviceNames:
  #   - nvme0n1
  #   - nvme1n1
  # pcieAllowList:
  #   - "0000:01:00.0"
  # pcieDenyList:
  #   - "0000:02:00.0"
  # pcieModel: "INTEL SSDPE2KX010T8"
  # driveSizeRange: "100G-2T"
  skipKubeletConfiguration: false
  enableCpuTopology: true
  openShiftCluster: true
  ubuntuHost: false
  forceFormat4K: true
  # tolerations:
  #   - key: node-role.kubernetes.io/storage
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule
  