apiVersion: storage.simplyblock.io/v1alpha1
kind: StorageCluster
metadata:
  name: simplyblock-cluster
  namespace: simplyblock
spec:
  fabricType: tcp
  haType: ha
  # isSingleNode: false
  # enableNodeAffinity: false
  # strictNodeAntiAffinity: false
  # blockSize: 4096
  # clientDataIfname: eth1
  # clientQpairCount: 4
  # qpairCount: 4
  # nvmfBasePort: 4420
  # rpcBasePort: 9502
  # snodeApiPort: 8090
  # pageSizeInBlocks: 128
  # maxQueueSize: 64
  # maxFaultTolerance: 1
  # inflightIOThreshold: 128
  stripe:
    dataChunks: 1
    parityChunks: 1
  warningThreshold:
    capacity: 80
    provisionedCapacity: 80
  criticalThreshold:
    capacity: 90
    provisionedCapacity: 90
  # hashicorpVaultSettings:
  #   baseURL: https://vault.example.com:8200
  volumeMigrationSettings:
    enabled: true
    rebalancerImage: docker.io/simplyblock/simplyblock-rebalancer:main
  #   rebalancerImage: "quay.io/simplyblock-io/simplyblock-rebalancer:latest"

---
apiVersion: storage.simplyblock.io/v1alpha1
kind: Pool
metadata:
  name: simplyblock-pool
  namespace: simplyblock
spec:
  clusterName: simplyblock-cluster
  # capacityLimit: 500G
  # logicalVolumeMaxSize: 50G
  # dhchap: false
  # allowedNodes:
  #   - worker-node-1
  #   - worker-node-2
  #   - worker-node-3
  # qos:
  #   iops: 10000
  #   throughput:
  #     read: 500
  #     write: 250
  #     readWrite: 750
  # storageClassParameters:
  #   compression: "False"
  #   encryption: false
  #   fabric: tcp
  #   lvolPriorityClass: "0"
  #   maxNamespacePerSubsys: "1"
  #   numDataChunks: "1"
  #   numParityChunks: "1"
  #   qosRMbytes: "0"
  #   qosWMbytes: "0"
  #   qosRwMbytes: "0"
  #   qosRwIops: "0"
  #   replicate: false
  #   tune2fsReservedBlocks: "0"

---
apiVersion: storage.simplyblock.io/v1alpha1
kind: StorageNodeSet
metadata:
  name: simplyblock-node
  namespace: simplyblock
spec:
  clusterName: simplyblock-cluster
  # clusterImage: "quay.io/simplyblock-io/simplyblock:26.2.2-PRE"
  # spdkImage: "quay.io/simplyblock-io/spdk:26.2.2-PRE"
  # spdkProxyImage: "quay.io/simplyblock-io/simplyblock:26.2.2-PRE"
  #spdkSystemMemory: 4G
  mgmtIfname: eth0
  dataIfname:
    - eth0
  workerNodes:
  - vm02.simplyblock3.localdomain
  - vm03.simplyblock3.localdomain
  - vm04.simplyblock3.localdomain
  #- vm15.simplyblock3.localdomain
    # - worker-node-1
    # - worker-node-2
    # - worker-node-3
  maxLogicalVolumeCount: 20
  partitions: 0
  corePercentage: 50
  nodesPerSocket: 1
  # maxSize: 0
  reservedSystemCPU: "0,1"
  socketsToUse:
    - "0"
  journalManager:
    count: 3
    percentPerDevice: 3
  # deviceNames:
  #   - nvme0n1
  #   - nvme1n1
  # pcieAllowList:
  #   - "0000:01:00.0"
  # pcieDenyList:
  #   - "0000:02:00.0"
  # pcieModel: "INTEL SSDPE2KX010T8"
  # driveSizeRange: "100G-2T"
  skipKubeletConfiguration: true
  enableCpuTopology: true
  openShiftCluster: false
  ubuntuHost: false
  forceFormat4K: true
  # tolerations:
  #   - key: node-role.kubernetes.io/storage
  #     operator: Equal
  #     value: "true"
  #     effect: NoSchedule

  # nodeConfigs allows per-worker-node overrides. Any field set here takes
  # precedence over the fleet-wide default above for that specific node.
  # Omit a worker entry to use fleet defaults for that node.
  nodeConfigs:
    vm02.simplyblock3.localdomain:
      maxLogicalVolumeCount: 20
      corePercentage: 50
      spdkSystemMemory: "1G"
      reservedSystemCPU: "0,1"
      enableCpuTopology: true
      journalManager:
        count: 3
        percentPerDevice: 3
      # failureDomain: 1
      # deviceNames:
      #   - nvme0n1
      #   - nvme1n1
      # pcieAllowList:
      #   - "0000:01:00.0"
    vm03.simplyblock3.localdomain:
      maxLogicalVolumeCount: 25
      corePercentage: 50
      spdkSystemMemory: "2G"
      reservedSystemCPU: "0,1"
      enableCpuTopology: true
      journalManager:
        count: 3
        percentPerDevice: 3
      # failureDomain: 2
    vm04.simplyblock3.localdomain:
      maxLogicalVolumeCount: 30
      corePercentage: 50
      spdkSystemMemory: "3G"
      reservedSystemCPU: "0,1"
      enableCpuTopology: true
      journalManager:
        count: 3
        percentPerDevice: 3
      # failureDomain: 3

