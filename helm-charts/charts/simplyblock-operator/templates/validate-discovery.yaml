# The one thing about a discovery run that cannot be reported after the fact.
#
# A StorageCluster's name is accepted by the API server at any length a Kubernetes
# object name may be, and refused by the control plane past what its derived names
# have room for. A draft naming a longer one is a document that reviews cleanly,
# is approved, and then fails at CreatingCluster with the cluster already
# immutable in the part that matters. There is nowhere later to catch it, so it is
# caught before the release is installed.
{{- if and (eq .Values.deployment.profile "standalone") (.Values.discovery.enabled) }}
{{- $draft := .Values.discovery.draft.name | default (printf "discovered-%s" (.Values.discovery.name | default "initial-discovery")) }}
{{- $cluster := .Values.discovery.draft.cluster.name | default (printf "%s-cluster" $draft) }}
{{- if gt (len $cluster) 37 }}
{{- fail (printf "the initial draft would propose the StorageCluster %q, which is %d characters: the control plane derives names from it and accepts at most 37. Set discovery.draft.cluster.name to something shorter." $cluster (len $cluster)) }}
{{- end }}

{{/*
4K atomicity means nothing without checksum validation, and the StorageCluster
refuses the pair. The ClusterDeploymentConfig does not, so a draft carrying one
without the other reviews cleanly, is approved, and fails at CreatingCluster with
the document already immutable. It is caught here for the reason the name is.
*/}}
{{- if and .Values.discovery.draft.cluster.enableAtomicity4K (not .Values.discovery.draft.cluster.enableChecksumValidation) }}
{{- fail "discovery.draft.cluster.enableAtomicity4K is set and enableChecksumValidation is not: 4K atomicity is what lets checksum validation run on a device whose logical block size is under 4K, and the StorageCluster refuses the one without the other. Set enableChecksumValidation too, or drop enableAtomicity4K." }}
{{- end }}
{{- end }}
