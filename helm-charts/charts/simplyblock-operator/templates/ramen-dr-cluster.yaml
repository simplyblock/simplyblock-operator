{{/*
  Ramen dr-cluster operator — the managed-cluster half of RamenDR: executes
  the protection where the volumes live, reconciling VolumeReplicationGroups
  (plus the group-replication and maintenance-mode kinds) against the CSI
  replication, snapshot, VolSync and Velero machinery. Enable it in the same
  install that deploys the local simplyblock operator on each managed cluster.

  Vendored from RamenDR/ramen v0.1.0-rc1 config/dr-cluster; names and labels
  are exactly what upstream's kustomize produces (namePrefix
  ramen-dr-cluster-, namespace ramen-system). The RBAC rules below are
  config/dr-cluster/rbac/role.yaml verbatim.
*/}}
{{- if .Values.ramen.drCluster.enabled }}
{{- $ramen := .Values.ramen }}
{{- include "sbramen.operator" (dict "root" $ "role" "dr-cluster" "vals" $ramen.drCluster) }}
---
{{ include "sbramen.leaderElection" (dict "root" $ "role" "dr-cluster") }}
---
