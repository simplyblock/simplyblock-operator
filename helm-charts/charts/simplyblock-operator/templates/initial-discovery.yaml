# The discovery run an installation customized through `discovery.*` values.
#
# It renders only when a value other than `enabled` and `draft` is set. The draft
# values are accepted and unused. An installation that
# states nothing gets the operator's own default run, which needs no object here.
# Either way exactly one run happens: the operator declines to raise its own the
# moment any OperatorOps exists, this one included.
{{- $d := .Values.discovery }}
{{- $set := false }}
{{- range $key, $value := omit $d "enabled" "draft" }}
{{- if or $value (kindIs "bool" $value) }}{{ $set = true }}{{ end }}
{{- end }}
{{- if and (eq .Values.deployment.profile "standalone") $d.enabled $set }}
{{- $name := $d.name | default "initial-discovery" }}
{{- /* The draft is "discovered-<name>" and its cluster "<draft>-cluster", which the control plane accepts at 37 characters. */}}
{{- if gt (len (printf "discovered-%s-cluster" $name)) 37 }}
{{- fail (printf "discovery.name %q would make the draft's StorageCluster %d characters, and the control plane accepts at most 37. Use a name of at most 18 characters." $name (len (printf "discovered-%s-cluster" $name))) }}
{{- end }}
---
apiVersion: storage.simplyblock.io/v1alpha2
kind: OperatorOps
metadata:
  name: {{ $name }}
  namespace: {{ $d.namespace | default .Release.Namespace }}
spec:
  action: Discover
  discover:
    # The default run waives a partition table, so a chart-rendered one does too.
    enablePartitionedDevices: {{ if hasKey $d "enablePartitionedDevices" }}{{ $d.enablePartitionedDevices }}{{ else }}true{{ end }}
    {{- with $d.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $d.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- range $field := list "enableControlPlaneNodes" "enableLogicalBlockDevices" "forceJournalDevice" }}
    {{- if hasKey $d $field }}
    {{ $field }}: {{ index $d $field }}
    {{- end }}
    {{- end }}
    {{- with $d.deviceFilter }}
    deviceFilter:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
