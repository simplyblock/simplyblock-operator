{{- if .Values.simplyblockDriver.create }}
# The CSI driver as a resource the operator reconciles, rather than as objects
# this chart renders. What used to be node.yaml, controller.yaml, driver.yaml,
# the two RBAC files, and snapshotclass.yaml is now one object, and the operator
# applies the eighteen the deployment is made of.
#
# A Kubernetes cluster holds one of these, enforced at admission. The name is
# "simplyblock" because that is what the operator's own derivation expects: it
# names every object <name>-csi-<component>, which reproduces the names the
# chart wrote literally and lets an existing deployment be adopted in place.
---
apiVersion: storage.simplyblock.io/v1alpha2
kind: SimplyblockDriver
metadata:
  name: simplyblock
  namespace: {{ .Release.Namespace }}
spec:
  image: "{{ .Values.simplyblockDriver.image.repository }}:{{ .Values.simplyblockDriver.image.tag }}"
  imagePullPolicy: {{ .Values.simplyblockDriver.image.pullPolicy }}
  driverName: {{ .Values.simplyblockDriver.driverName | quote }}
  enableVolumeSnapshots: {{ .Values.simplyblockDriver.enableVolumeSnapshots }}
  enableServiceAccountAuth: {{ .Values.simplyblockDriver.enableServiceAccountAuth }}
  controllerReplicas: {{ .Values.simplyblockDriver.controller.replicas }}
  {{- with .Values.simplyblockDriver.controller.nodeSelector }}
  controllerNodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.simplyblockDriver.controller.tolerations }}
  controllerTolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.simplyblockDriver.controller.resources }}
  controllerResources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.simplyblockDriver.node.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.simplyblockDriver.node.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.simplyblockDriver.node.resources }}
  nodeResources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.simplyblockDriver.sidecarImages }}
  sidecarImages:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
