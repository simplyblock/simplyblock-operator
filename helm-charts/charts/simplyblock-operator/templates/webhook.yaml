{{- if .Values.operator.enabled }}
################# WEBHOOK SERVICE ####################################
# Serves the rebalancer pod-injection mutating webhook. The operator
# provisions the serving certificate at runtime (self-signed via
# cert-controller or via cert-manager, per SB_TLS_PROVIDER) and injects
# the CA bundle into the MutatingWebhookConfiguration below.
---
apiVersion: v1
kind: Service
metadata:
  name: simplyblock-operator-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: simplyblock-operator
    app: simplyblock-operator
spec:
  selector:
    app: simplyblock-operator
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
################# MUTATING WEBHOOK CONFIGURATION #####################
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: simplyblock-operator-mutating-webhook-configuration
  labels:
    control-plane: simplyblock-operator
    app: simplyblock-operator
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: simplyblock-operator-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /mutate-v1-pod-simplyblock-rebalancer
    failurePolicy: Ignore
    name: simplyblock-rebalancer-injector.simplyblock.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
{{- end }}