{{/*
externallyManagedSecret.create, and not the block holding it. The guard tested
the map, which is non-empty whatever create says, so the secret was rendered for
every release and setting create: false did nothing.
*/}}
{{- if .Values.externallyManagedSecret.create }}
---
{{- if and .Values.csiConfig.simplybk.uuid .Values.csiSecret.simplybk.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: simplyblock-csi-secret-v2
  namespace: {{ .Release.Namespace }}
  annotations:
    # The driver mounts this Secret, and `helm uninstall` leaves the driver
    # running, so deleting it would fail every plugin pod that restarts afterward.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret.json: |-
    {
      "clusters": [
{{- if .Values.multiCluster.enable }}
{{- $clusters := default (list) .Values.multiCluster.clusters -}}
{{- range $i, $c := $clusters }}
        {{- if $i }},{{ end }}
        {
          "cluster_id": {{ required "multiCluster.clusters[].cluster_id is required" $c.cluster_id | quote }},
          "cluster_endpoint": "{{ include "simplyblock.controlPlaneAddr" $ }}",
          "cluster_secret": {{ required "multiCluster.clusters[].secret is required" $c.secret | quote }}
        }
{{- end }}
{{- else }}
        {
          "cluster_id": {{ .Values.csiConfig.simplybk.uuid | quote }},
          "cluster_endpoint": "{{ include "simplyblock.controlPlaneAddr" . }}",
          "cluster_secret": {{ .Values.csiSecret.simplybk.secret | quote }}
        }
{{- end }}
      ]
    }
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: simplyblock-csi-secret-v2
  namespace: {{ .Release.Namespace }}
  annotations:
    # The driver mounts this Secret, and `helm uninstall` leaves the driver
    # running, so deleting it would fail every plugin pod that restarts afterward.
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}

{{- end }}
