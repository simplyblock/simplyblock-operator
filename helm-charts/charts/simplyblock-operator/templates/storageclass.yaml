{{- /*
One block StorageClass per storage cluster given at install time, in
csiConfig.simplybk or multiCluster.clusters, that names a pool.

Such a cluster has no StorageCluster or StoragePool object on this Kubernetes
cluster, so the pool reconciler, which writes the classes of the clusters it
manages, never writes one for it. Without a class nothing can provision from
the cluster, and the pNFS metadata server finds no class of the cluster to
derive its state disk's class from.

Rendered under the same guard as simplyblock-csi-secret-v2, which is what gives
the driver the cluster's endpoint and secret: a class for a cluster the driver
cannot reach would bind nothing. A cluster without a pool gets no class, since
pool_name is what scopes a volume to a pool.
*/}}
{{- if and .Values.externallyManagedSecret.create .Values.csiConfig.simplybk.uuid .Values.csiSecret.simplybk.secret }}
{{- $entries := list }}
{{- if .Values.multiCluster.enable }}
{{- range (default (list) .Values.multiCluster.clusters) }}
{{- $entries = append $entries (dict "clusterID" .cluster_id "pool" .pool "name" .storageClassName) }}
{{- end }}
{{- else }}
{{- $entries = append $entries (dict "clusterID" .Values.csiConfig.simplybk.uuid "pool" .Values.csiConfig.simplybk.pool "name" .Values.csiConfig.simplybk.storageClassName) }}
{{- end }}
{{- $seen := dict }}
{{- range $entries }}
{{- if .pool }}
{{- $name := default (printf "simplyblock-%s" .pool) .name }}
{{- if hasKey $seen $name }}
{{- fail (printf "StorageClass %s is rendered for two clusters; set storageClassName on one of them" $name) }}
{{- end }}
{{- $_ := set $seen $name true }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $name }}
provisioner: {{ $.Values.driver.driverName | quote }}
parameters:
  cluster_id: {{ .clusterID | quote }}
  pool_name: {{ .pool | quote }}
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
{{- end }}
{{- end }}
{{- end }}
