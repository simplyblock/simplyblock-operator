  - delete
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ramen-hub-operator-rolebinding
  namespace: {{ $ramen.namespace }}
  labels:
    {{- include "sbramen.labels" (dict "app" "ramen-hub") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ramen-hub-operator-role
subjects:
  - kind: ServiceAccount
    name: ramen-hub-operator
    namespace: {{ $ramen.namespace }}
{{- end }}
