{{/*
  Ramen hub operator — the management-cluster half of RamenDR: reconciles
  DRPolicy, DRPlacementControl and DRCluster and drives placement through
  Open Cluster Management (the cluster needs the OCM hub — RHACM or
  standalone OCM — or the manager fails on the missing OCM kinds).

  Vendored from RamenDR/ramen v0.1.0-rc1 config/hub; names and labels are
  exactly what upstream's kustomize produces (namePrefix ramen-hub-,
  namespace ramen-system). The RBAC rules below are config/hub/rbac/role.yaml
  verbatim.
*/}}
{{- if .Values.ramen.hub.enabled }}
{{- $ramen := .Values.ramen }}
{{- include "sbramen.operator" (dict "root" $ "role" "hub" "vals" $ramen.hub) }}
---
{{ include "sbramen.leaderElection" (dict "root" $ "role" "hub") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ramen-hub-operator-role
  labels:
    {{- include "sbramen.labels" (dict "app" "ramen-hub") | nindent 4 }}
rules:
