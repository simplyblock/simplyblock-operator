---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ramen-hub-operator-rolebinding
  labels:
    {{- include "sbramen.labels" (dict "app" "ramen-hub") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ramen-hub-operator-role
subjects:
  - kind: ServiceAccount
    name: ramen-hub-operator
    namespace: {{ $ramen.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ramen-hub-operator-role
  namespace: {{ $ramen.namespace }}
  labels:
    {{- include "sbramen.labels" (dict "app" "ramen-hub") | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - update
- apiGroups:
  - policy.open-cluster-management.io
  resources:
  - placementbindings
  - policies
  verbs:
