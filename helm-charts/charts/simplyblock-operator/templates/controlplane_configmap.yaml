                        - key: limit
                          value: {{ $logLimit | quote }}
                    root_selector: |-
                      (
                        $window := 120000;
                        $ms := function($d) { $toMillis($substring($d & '.000', 0, 23), '[Y0001]-[M01]-[D01] [H01]:[m01]:[s01].[f001]') };
                        $healthy := ['online', 'in_creation'];
                        $nodeEv := [$[Event = 'STATUS_CHANGE' and $contains(Message, 'Storage node status changed from: ')]];
                        $cascades := [$map($nodeEv[$not($substringAfter(Message, ' to: ') in $healthy)], function($e) { $ms($e.Date) })];
                        $devEv := [$[Event = 'STATUS_CHANGE' and $contains(Message, 'Device status changed from: ')]];
                        $fold := function($evs) {
                          $reduce($evs, function($a, $e) {
                            {
                              'state': $substringAfter($e.Message, ' to: '),
                              'since': $e.Date,
                              'at': $ms($e.Date),
                              'order': $e.Storage_ID
                            }
                          }, { 'state': 'online', 'since': '', 'at': 0, 'order': '' })
                        };
                        $devs := $count($devEv) = 0 ? [] : [$each($devEv{ NodeId: [$] }, function($evs, $id) {
                          (
                            $f := $fold($evs);
                            $merge([
                              { 'device': $id, 'cascade': $count($cascades[$ <= $f.at and $f.at - $ <= $window]) > 0 },
