        # Rules derived from the control plane's cluster event log rather than
        # from Thanos. Each query folds the newest log records into the current
        # state of every node, device, and cluster and returns one row per entity
        # that is currently wrong. Healing is therefore structural: the reverting
        # event -- a node back online, a device back online, a cluster back to
        # active -- removes the row, the row's absence removes the alert
        # instance, and noDataState: OK turns an entirely empty result into the
        # resolved state.
        #
        # The fold has to read the transitions because the cause is not in the
        # payload. cluster_ops.get_logs drops caused_by, and set_node_status
        # writes every transition under the same default caused_by regardless.
        # What separates a shutdown an operator asked for from a fault is the
        # state it passes through -- only shutdown_storage_node reaches
        # in_shutdown -- and that is what the two suppression rules key on.
        - orgId: 1
          name: simplyblock_events
          folder: grafana_folder
          interval: {{ $eventAlerts.interval | default "1m" }}
          rules:
{{- range $eventClusters }}
{{- $cid := .id }}
{{- $dsUid := printf "sbev-%s" (sha256sum .id | trunc 12) }}
            - uid: {{ printf "sbev-%s-%s" (sha256sum $cid | trunc 8) "node-left-online" }}
              title: StorageNode_left_online_{{ $cid }}
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: {{ $dsUid }}
                  model:
                    refId: A
                    type: json
                    source: url
                    format: table
                    # Only the backend parser runs server-side, which is what
                    # an alert rule needs. root_selector is tried as a gjson
                    # path first and falls back to JSONata; opening with a
                    # bracket guarantees the fallback. The v2 endpoint returns
                    # the records unwrapped, so $ is the record array itself.
                    parser: backend
                    url: /api/v2/clusters/{{ $cid }}/logs
                    url_options:
                      method: GET
                      params:
                        - key: limit
                          value: {{ $logLimit | quote }}
                    root_selector: |-
                      (
                        $planned := ['in_shutdown', 'in_removal', 'pending_removal', 'removed'];
                        $healthy := ['online', 'in_creation'];
                        $ev := [$[Event = 'STATUS_CHANGE' and $contains(Message, 'Storage node status changed from: ')]];
                        $fold := function($evs) {
                          $reduce($evs, function($a, $e) {
                            (
                              $to := $substringAfter($e.Message, ' to: ');
                              {
                                'state': $to,
                                'since': $e.Date,
                                'planned': $to in $planned or ($a.planned and $to = 'offline')
                              }
                            )
                          }, { 'state': 'online', 'since': '', 'planned': false })
                        };
                        $nodes := $count($ev) = 0 ? [] : [$each($ev{ NodeId: [$] }, function($evs, $id) {
                          $merge([{ 'node': $id }, $fold($evs)])
                        })];
                        [$nodes[$not(state in $healthy) and $not(planned)].{
                          'node': node,
                          'state': state,
                          'since': since,
                          'value': 1
                        }]
                      )
