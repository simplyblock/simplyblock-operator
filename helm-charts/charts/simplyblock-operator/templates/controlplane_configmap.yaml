{{- if .Values.operator.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplyblock-config
  namespace: {{ .Release.Namespace }}

data:
  LOG_LEVEL: {{ .Values.controlplane.observability.level }}
  LOG_DELETION_INTERVAL: {{ .Values.controlplane.observability.deletionInterval }}

{{- if .Values.controlplane.observability.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplyblock-fluent-bit-config
  namespace: {{ .Release.Namespace }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf 
        storage.path              /var/flb-db
        storage.sync              normal
        storage.checksum          off
        storage.max_chunks_up     128
        storage.backlog.mem_limit 50MB

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            {{ .Values.controlplane.observability.logParser | default "cri" }}
        Tag               kube.*
        Exclude_Path      /var/log/containers/*fluent-bit*.log
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        DB                /var/flb-db/flb_kube.db
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Merge_Log_Key       log
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Buffer_Size         0
        Annotations         On

    [FILTER]
        Name      lua
        Match     kube.*
        script    filter.lua
        call      filter_tagged_pods

    [OUTPUT]
        Name          gelf
        Match         *
        Host          simplyblock-graylog
        Port          12201
        Mode          tcp
        Gelf_Short_Message_Key log
        Gelf_Host_Key host

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    # CRI log line: "<time> <stream> <logtag> <message>". The message is captured
    # as "log" (rather than the upstream "message") so that the kubernetes filter's
    # Merge_Log and the GELF output's Gelf_Short_Message_Key keep working unchanged.
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) ?(?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

  filter.lua: |
    function filter_tagged_pods(tag, timestamp, record)
        if record["kubernetes"] ~= nil then
            local annotations = record["kubernetes"]["annotations"]
            if annotations ~= nil and annotations["log-collector/enabled"] == "true" then
                -- GELF requires a top-level "host" field. Without it Graylog logs a
                -- warning per message and falls back to the fluent-bit pod IP as the
                -- message source, which makes logs impossible to attribute to a node.
                record["host"] = record["kubernetes"]["host"] or record["kubernetes"]["pod_name"]
                -- GELF rejects an empty short_message, so blank log lines would be
                -- dropped by the output with an "error encoding to GELF" per line.
                -- They carry no information, so drop them here quietly instead.
                local msg = record["log"]
                if msg == nil or (type(msg) == "string" and msg:match("^%s*$") ~= nil) then
                    return -1, timestamp, record
                end
                return 1, timestamp, record
            end
        end
        return -1, timestamp, record
    end
{{- end }}

---

{{- $name := "simplyblock-prometheus-config" -}}
{{- $existing := (lookup "v1" "ConfigMap" .Release.Namespace $name) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    app: simplyblock-prometheus
  namespace: {{ .Release.Namespace }}
data:
  {{- if $existing }}
  prometheus.yml: |
{{ index $existing.data "prometheus.yml" | indent 4 }}
  {{- else }}
  prometheus.yml: |
    global:
      scrape_interval: 30s
      external_labels:
        monitor: 'codelab-monitor'

    scrape_configs:

      - job_name: 'cluster_metrics'
        static_configs:
          - targets: ['simplyblock-webappapi:5000']
        honor_labels: true
        metrics_path: '/api/v1/cluster/metrics'
        {{- if .Values.tls.enabled }}
        scheme: https
        tls_config:
          insecure_skip_verify: true
          {{- if .Values.tls.mutual_enabled }}
          cert_file: /etc/prometheus/certs/tls.crt
          key_file: /etc/prometheus/certs/tls.key
          {{- end }}
        {{- end }}
        basic_auth:
          username:
          password:
      {{- if .Values.controlplane.foundationdb.exporter.enabled }}

      - job_name: 'fdb_metrics'
        static_configs:
          - targets: ['simplyblock-fdb-exporter:9444']
            # The FoundationDB Grafana dashboard filters every panel by a
            # `namespace` label; attach it here since a static target has none.
            labels:
              namespace: {{ .Release.Namespace }}
        honor_labels: true
        metrics_path: '/metrics'
      {{- end }}
  {{- end }}
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplyblock-objstore-config
  labels:
    app: simplyblock-thanos
  namespace: {{ .Release.Namespace }}
data:
  objstore.yml: |
    type: S3
    config:
      bucket: {{ .Values.controlplane.observability.minio.bucket }}
      endpoint: simplyblock-minio:9000
      access_key: {{ .Values.controlplane.observability.minio.accessKey }}
      secret_key: {{ .Values.controlplane.observability.minio.secretKey }}
      insecure: true
{{- if .Values.controlplane.observability.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplyblock-grafana-datasource
  labels:
    app: simplyblock-grafana
  namespace: {{ .Release.Namespace }}
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
    - name: Thanos
      type: prometheus
      url: http://simplyblock-thanos:9091
      isDefault: true
      access: proxy
      uid: PBFA97CFB590B2093
      editable: true
{{- $eventAlerts := .Values.controlplane.observability.grafana.eventAlerts | default dict }}
{{- $eventClusters := include "simplyblock.eventAlertClusters" . | fromJsonArray }}
{{- if and $eventAlerts.enabled $eventClusters }}
{{- $cpAddr := include "simplyblock.controlPlaneAddr" . }}
    # One Infinity data source per cluster. The v2 API authenticates with the
    # cluster secret as a bearer token, and Grafana binds credentials to a data
    # source rather than to a query, so a cluster needs its own. The secret goes
    # through secureJsonData, which Grafana stores encrypted and never returns
    # to the browser; Infinity reads the pair as a custom request header.
{{- range $eventClusters }}
    - name: Simplyblock Events {{ .id }}
      type: yesoreyeram-infinity-datasource
      uid: {{ printf "sbev-%s" (sha256sum .id | trunc 12) }}
      url: {{ $cpAddr }}
      access: proxy
      editable: false
      jsonData:
        httpHeaderName1: Authorization
        # Without this the health check probes the bare base URL, which the
        # control plane answers with a string Infinity cannot read as a table.
        customHealthCheckEnabled: false
        tlsSkipVerify: true
        timeoutInSeconds: 30
      secureJsonData:
        httpHeaderValue1: {{ printf "Bearer %s" .secret | quote }}
{{- end }}
{{- end }}
