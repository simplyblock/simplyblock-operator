                      - selector: node
                        text: node
                        type: string
                      - selector: state
                        text: state
                        type: string
                      - selector: since
                        text: since
                        type: string
                      - selector: value
                        text: value
                        type: number
                - refId: B
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: threshold
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params: []
                        reducer:
                          params: []
                          type: last
                        type: query
