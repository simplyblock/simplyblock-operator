                        text: order
                        type: string
                      - selector: since
                        text: since
                        type: string
                      - selector: value
                        text: value
                        type: number
                - refId: B
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: threshold
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params: []
                        reducer:
                          params: []
                          type: last
                        type: query
              # A row exists only for something currently wrong, so an empty
              # result is the healthy state and has to resolve the alert. A
              # failing query is not: that is the alert source being broken.
              noDataState: OK
              execErrState: Error
              for: {{ $for }}
              annotations:
                summary: 'Device {{ "{{" }} $labels.device {{ "}}" }} (cluster device order {{ "{{" }} $labels.order {{ "}}" }}) is unavailable.'
                description: 'The rule fires for a device that is currently unavailable and did not become so as part of a whole node going down. A node leaving online cascades every one of its devices to unavailable within seconds, and that is reported once as the storage node alert rather than once per device. The alert clears when the device returns to online.'
              labels:
                app: simplyblock
                cluster: {{ $cid }}
                severity: warning
              isPaused: false
