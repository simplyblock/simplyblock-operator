              annotations:
                summary: 'The journal on storage node {{ "{{" }} $labels.node {{ "}}" }} holds more records awaiting compression than the configured threshold.'
                description: 'Compression is not keeping up with the journal, and journal replay on the next restart or failover grows with every record. The control plane latches this alert on the upward crossing and re-arms silently, emitting nothing when the backlog drains, so the alert clears an hour after the last crossing rather than on a recovery event.'
              labels:
                app: simplyblock
                cluster: {{ $cid }}
                severity: critical
              isPaused: false
            - uid: {{ printf "sbev-%s-%s" (sha256sum $cid | trunc 8) "jm-compression-error" }}
              title: JM_compression_error_{{ $cid }}
              condition: B
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: {{ $dsUid }}
                  model:
                    refId: A
                    type: json
                    source: url
                    format: table
                    # Only the backend parser runs server-side, which is what
                    # an alert rule needs. root_selector is tried as a gjson
                    # path first and falls back to JSONata; opening with a
                    # bracket guarantees the fallback. The v2 endpoint returns
                    # the records unwrapped, so $ is the record array itself.
                    parser: backend
                    url: /api/v2/clusters/{{ $cid }}/logs
                    url_options:
                      method: GET
                      params:
                        - key: limit
                          value: {{ $logLimit | quote }}
                    root_selector: |-
                      (
                        $ev := [$[Event = 'jm_compression']];
                        $latest := $count($ev) = 0 ? [] : [$each($ev{ (NodeId & '/' & VUID): [$] }, function($evs, $key) {
                          (
                            $e := $evs[-1];
                            {
                              'node': $substringBefore($key, '/'),
                              'jm_vuid': $substringAfter($key, '/'),
                              'level': $e.Level,
                              'detail': $e.Message
                            }
                          )
                        })];
                        [$latest[level = 'Error'].{
                          'node': node,
                          'jm_vuid': jm_vuid,
                          'detail': detail,
                          'value': 1
                        }]
                      )
                    # Exactly one numeric field and the rest strings is what
                    # makes Grafana read the frame as a numeric table, turning
                    # every string field into a label of its own alert instance.
                    columns:
                      - selector: node
                        text: node
                        type: string
                      - selector: jm_vuid
                        text: jm_vuid
                        type: string
                      - selector: detail
                        text: detail
                        type: string
                      - selector: value
                        text: value
                        type: number
                - refId: B
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: threshold
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    conditions:
                      - evaluator:
                          params:
                            - 0
                          type: gt
                        operator:
                          type: and
                        query:
                          params: []
                        reducer:
                          params: []
                          type: last
                        type: query
              # A row exists only for something currently wrong, so an empty
              # result is the healthy state and has to resolve the alert. A
              # failing query is not: that is the alert source being broken.
              noDataState: OK
              execErrState: Error
              for: {{ $for }}
              annotations:
                summary: 'Journal compression failed on storage node {{ "{{" }} $labels.node {{ "}}" }} for jm_vuid {{ "{{" }} $labels.jm_vuid {{ "}}" }}: {{ "{{" }} $labels.detail {{ "}}" }}.'
                description: 'The rule tracks the newest compression event per node and journal and fires while that event is an error, which is either a compression_failed status or a non-zero error code. The alert clears when the same journal reports a clean compression run.'
              labels:
                app: simplyblock
                cluster: {{ $cid }}
                severity: critical
              isPaused: false
{{- end }}
{{- end }}

{{- $grafana := .Values.controlplane.observability.grafana }}
{{- $notifications := $grafana.notifications | default dict }}
{{- $slack := $notifications.slack | default dict }}
{{- $teams := $notifications.teams | default dict }}
{{- $pagerduty := $notifications.pagerduty | default dict }}
{{- $opsgenie := $notifications.opsgenie | default dict }}
{{- $webhook := $notifications.webhook | default dict }}
{{- $anyReceiver := or $slack.enabled $teams.enabled $pagerduty.enabled $opsgenie.enabled $webhook.enabled }}
  alert_resources.yaml: |
{{- if $anyReceiver }}
    policies:
      - orgId: 1
        receiver: grafana-alerts
        group_by: ['grafana_folder', 'alertname']
        routes:
          - receiver: grafana-alerts
            object_matchers:
              - ['app', '=', 'simplyblock']

    contactPoints:
      - orgId: 1
        name: grafana-alerts
        receivers:
    {{- if $slack.enabled }}
          - uid: grafana
            type: slack
            settings:
              username: grafana_bot
              url: '{{ $slack.url }}'
              title: '{{ "{{" }} template "simplyblock.title" . {{ "}}" }}'
              text: '{{ "{{" }} template "simplyblock.message" . {{ "}}" }}'
    {{- end }}
    {{- if $teams.enabled }}
          - uid: grafana-teams
            type: teams
            settings:
              url: '{{ $teams.url }}'
              title: '{{ "{{" }} template "simplyblock.title" . {{ "}}" }}'
              message: '{{ "{{" }} template "simplyblock.message" . {{ "}}" }}'
    {{- end }}
    {{- if $pagerduty.enabled }}
          - uid: grafana-pagerduty
            type: pagerduty
            settings:
              severity: '{{ $pagerduty.severity | default "critical" }}'
              summary: '{{ "{{" }} template "simplyblock.title" . {{ "}}" }}'
      {{- with $pagerduty.class }}
              class: '{{ . }}'
      {{- end }}
      {{- with $pagerduty.component }}
              component: '{{ . }}'
      {{- end }}
      {{- with $pagerduty.group }}
              group: '{{ . }}'
      {{- end }}
            secureSettings:
              integrationKey: '{{ $pagerduty.integrationKey }}'
    {{- end }}
    {{- if $opsgenie.enabled }}
          - uid: grafana-opsgenie
            type: opsgenie
            settings:
              apiUrl: '{{ $opsgenie.apiUrl | default "https://api.opsgenie.com/v2/alerts" }}'
              autoClose: {{ dig "autoClose" true $opsgenie }}
              overridePriority: {{ dig "overridePriority" false $opsgenie }}
              sendTagsAs: '{{ $opsgenie.sendTagsAs | default "tags" }}'
              message: '{{ "{{" }} template "simplyblock.title" . {{ "}}" }}'
              description: '{{ "{{" }} template "simplyblock.message" . {{ "}}" }}'
            secureSettings:
              apiKey: '{{ $opsgenie.apiKey }}'
    {{- end }}
    {{- if $webhook.enabled }}
          # No title and no message: without them Grafana posts its own alert
          # JSON payload unmodified, which is what a generic receiver expects.
          - uid: grafana-webhook
            type: webhook
            settings:
              url: '{{ $webhook.url }}'
              httpMethod: '{{ $webhook.httpMethod | default "POST" }}'
              maxAlerts: {{ $webhook.maxAlerts | default 0 }}
      {{- with $webhook.username }}
              username: '{{ . }}'
      {{- end }}
      {{- with $webhook.authorizationScheme }}
              authorization_scheme: '{{ . }}'
      {{- end }}
      {{- $useBasicAuth := and $webhook.username $webhook.password }}
      {{- $useAuthHeader := and $webhook.authorizationScheme $webhook.authorizationCredentials }}
      {{- if or $useBasicAuth $useAuthHeader }}
            secureSettings:
        {{- if $useBasicAuth }}
              password: '{{ $webhook.password }}'
        {{- end }}
        {{- if $useAuthHeader }}
              authorization_credentials: '{{ $webhook.authorizationCredentials }}'
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}

    templates:
      - orgId: 1
        name: simplyblock.title
        template: |
          [ALERT] Grafana Alerting Notification

      - orgId: 1
        name: simplyblock.message
        template: |
          {{ "{{" }} range .Alerts {{ "}}" }}*Alert*: {{ "{{" }} .Labels.alertname {{ "}}" }}
          *Summary*: {{ "{{" }} .Annotations.summary {{ "}}" }}
          *Description*: {{ "{{" }} .Annotations.description {{ "}}" }}
          *Go to dashboard:* {{ "{{" }} .DashboardURL {{ "}}" }}
          *Go to panel:* {{ "{{" }} .PanelURL {{ "}}" }}
          {{ "{{" }} end {{ "}}" }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simplyblock-grafana-dashboard-config
  namespace: {{ .Release.Namespace }}
data:
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: "Dashboard provider"
        orgId: 1
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
{{- end }}
{{- end }}
