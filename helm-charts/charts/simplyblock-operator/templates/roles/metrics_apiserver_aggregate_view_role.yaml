# Aggregates read access to this group's readings into the built-in Kubernetes
# "view" ClusterRole, so that anyone already bound to "view" in a namespace can
# see the capacity of what that namespace holds and nothing else.
#
# This is the point of serving the readings as namespaced API resources rather
# than as metrics alone: the confinement is the cluster's own RBAC, enforced by
# the kube-apiserver before the operator is reached, and it needs no per-tenant
# dashboard or query rewriting to hold.
#
# The three resources are confined by the same mechanism and to different
# audiences, because their objects live in different namespaces. A
# LogicalVolumeMetrics is named after a PersistentVolumeClaim and lives in the
# tenant's namespace, so a tenant sees their own volumes. A StorageDeviceMetrics
# lives beside the StorageNode that owns the device, and a StoragePoolMetrics
# beside its StoragePool, which is the namespace the storage cluster's own CRs
# are in, so both reach whoever administers that namespace rather than a tenant.
#
# There are no write verbs because there is nothing to write. The resource is
# computed on demand and the aggregated API server registers no mutating verbs at
# all, so a create or a delete is refused before RBAC is consulted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simplyblock-metrics-aggregate-to-view
  labels:
    app.kubernetes.io/name: simplyblock-operator
    app.kubernetes.io/managed-by: Helm
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups:
  - metrics.simplyblock.io
  resources:
  - logicalvolumemetrics
  - storagedevicemetrics
  - storagepoolmetrics
  verbs:
  - get
  - list
