{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simplyblock-csi-node-sa
{{- end }}
{{- if .Values.rbac.create }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: simplyblock-csi-node-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list","watch","delete"]
# rbac-justified: the node plugin reads a claim's on-disk-filesystem annotation
# before deciding whether a volume may be formatted, and records the filesystem
# there after staging one, so a later stage knows what the volume holds without
# reading the device. patch rather than update: the write is a merge patch of
# that one key, so a concurrent writer of any other annotation is left alone.
# Cluster-wide because claims live in whichever namespace a workload chose, and
# unnamed because their names are not known ahead of time.
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: simplyblock-csi-node-binding
subjects:
- kind: ServiceAccount
  name: simplyblock-csi-node-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: simplyblock-csi-node-role
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
