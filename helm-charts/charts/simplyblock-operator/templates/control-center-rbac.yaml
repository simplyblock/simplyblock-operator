{{/*
  RBAC for the Control Center.

  In serviceaccount mode this role IS the console's authority, for anyone who
  can reach the Service. In passthrough mode the pod needs nothing at all —
  Kubernetes enforces each user's own RBAC — so set controlCenter.rbac.create
  to false there.

  Kept in step with control-center/deploy/k8s/rbac.yaml; that file is the
  plain-manifest equivalent of this one.
*/}}
{{- if and .Values.controlCenter.enabled .Values.controlCenter.rbac.create }}
{{- $name := include "sbcc.fullname" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "sbcc.labels" . | nindent 4 }}
rules:
  # ---- simplyblock entities: read ----
  - apiGroups: ["storage.simplyblock.io"]
    resources:
      - storageclusters
      - storagenodes
      - storagenodesets
      - storagedevices
      - storagepools
      - storagebackups
      - backuppolicies
      - backuprestores
      - backupimports
      - controlplanes
      - replicationpairs
      - replicationpolicies
      - replicationslots
      - volumemigrations
      - tasks
      - simplyblockdrivers
      - clusterdeploymentconfigs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.simplyblock.io"]
    resources:
      - storageclusters/status
      - storagenodes/status
      - storagepools/status
      - replicationpolicies/status
      - replicationslots/status
    verbs: ["get"]

  # ---- day-2 operations ----
  # An action is not a verb against an entity: it is an Ops object the operator
  # reconciles. The console creates one, reads its phase, patches spec.abort to
  # unwind it, and deletes it only to abort.
  - apiGroups: ["storage.simplyblock.io"]
    resources:
      - storageclusterops
      - storagenodeops
      - storagedeviceops
      - storagepoolops
      - storagebackupops
      - controlplaneops
      - persistentvolumeops
      - operatorops
      - replicationops
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # ---- resources the console authors ----
  - apiGroups: ["storage.simplyblock.io"]
    resources: ["replicationpairs", "replicationpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["storage.simplyblock.io"]
    resources: ["storagebackups", "backuppolicies", "backuprestores", "backupimports", "volumemigrations"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["storage.simplyblock.io"]
    resources: ["storageclusters", "storagepools", "storagenodesets"]
    verbs: ["update", "patch"]

  # ---- core Kubernetes ----
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "persistentvolumeclaims", "pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # A PVC annotation is the whole membership model for replication and for
  # backup policies, so patching one is how a volume is attached.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["patch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]

  # ---- workloads, read only, for the Ramen recipe editor ----
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list"]

  # ---- Ramen: instances only, never the CRDs ----
  - apiGroups: ["ramendr.openshift.io"]
    resources: ["drpolicies", "drclusters", "drclusterconfigs", "volumereplicationgroups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ramendr.openshift.io"]
    resources: ["drplacementcontrols"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ramendr.openshift.io"]
    resources: ["recipes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list"]

  # ---- DR hub (dr-simplyblock): every DR screen is a CR ----
  # In serviceaccount mode this is the console's authority for DR: reads on
  # everything, the dr-operator writes, the dr-admin writes on plans/paths/
  # restores, and the override verb the hub's webhook checks before admitting a
  # readiness override. Absent CRDs cost nothing — the DR section then reports
  # that the hub is not installed. Trim to your policy, or use passthrough.
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["protectionplans", "drpaths", "protectedapplications", "recoveryplans", "recoveryactions", "testbubbles", "testschedules", "restoreactions", "drconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["protectionplans", "drpaths", "protectedapplications", "recoveryplans", "recoveryactions", "testbubbles", "testschedules", "restoreactions"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["recoveryactions"]
    verbs: ["override"]
  # AI-assisted discovery (dr-hub ADR 0023): the per-site dependency graph,
  # the proposal bundles and the discovery runs. Its data shards are
  # ConfigMaps in dr-hub's namespace, read with the configmaps rule above.
  # dr-hub owns every status; the console asks for a pull request, a
  # rejection or -- only without a GitOps target -- an approval or a rollback
  # by annotating the bundle (dr.simplyblock.io/request), which dr-hub's
  # webhook admits against the approve / rollback verbs.
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["discoverygraphs", "drproposals", "discoveryruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["discoveryruns"]
    verbs: ["create", "delete"]
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["drproposals"]
    verbs: ["patch", "approve", "rollback"]
  # the forms' Test buttons: dr-hub probes an S3 store, dr-agent health probes, on demand
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["s3proberequests", "healthproberequests"]
    verbs: ["get", "create", "delete"]
  # "Ask" on a guest network: dr-agent asks the NAD's DHCP servers (a
  # short-lived pod on the network; dr-hub needs dr-admin for it too)
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["dhcpproberequests"]
    verbs: ["get", "create", "delete"]
  # Label for DR on a managed site: dr-agent applies the allow-listed labels;
  # the request stays on the hub as the record (no delete)
  - apiGroups: ["dr.simplyblock.io"]
    resources: ["labelrequests"]
    verbs: ["get", "list", "create"]
  # what each site's dr-agent reports, through the view dr-hub keeps of it:
  # the forms offer discovered values (clusters' zones, Velero, classes,
  # namespaces, labels, PVCs, NADs, DHCP servers). Only that view, by name.
  - apiGroups: ["view.open-cluster-management.io"]
    resources: ["managedclusterviews"]
    resourceNames: ["dr-agent-status"]
    verbs: ["get"]
  - apiGroups: ["sitemap.simplyblock.io"]
    resources: ["siteprofiles", "dhcpservers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sitemap.simplyblock.io"]
    resources: ["dhcpservers"]
    verbs: ["create", "update", "patch", "delete"]
  # Site profile bindings (logical and guest networks, the DHCP server) are
  # edited in the console; dr-hub creates and deletes the profiles themselves.
  - apiGroups: ["sitemap.simplyblock.io"]
    resources: ["siteprofiles"]
    verbs: ["update", "patch"]
  # a managed site's storage deployment is requested, sized and approved
  # from the hub console (StorageSiteDeployment, carried to the site by OCM)
  - apiGroups: ["storage.simplyblock.io"]
    resources: ["storagesitedeployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.controlCenter.rbac.hubLabelling }}
  # Label for DR on the hub itself: the console patches the hub's objects
  # directly. RBAC cannot narrow a patch to label keys (the console offers
  # only DR's), so this is opt-in (controlCenter.rbac.hubLabelling).
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "patch"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["list", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  {{- end }}
  # the console asks the API server what its identity may do, to disable controls
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews", "selfsubjectrulesreviews"]
    verbs: ["create"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["selfsubjectreviews"]
    verbs: ["create"]

  # ---- Helm release view ----
  # Helm stores releases as Secrets. This is the only reason the console reads a
  # Secret, and a backup credentialsSecretRef is only ever shown by name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sbcc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
