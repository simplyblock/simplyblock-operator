{{- if and .Values.tls.enabled (eq .Values.tls.provider "cert-manager") }}
{{- if index .Values.tls "cert-manager" "createSelfSignedIssuer" }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ index .Values.tls "cert-manager" "cluster-issuer" | quote }}
spec:
  selfSigned: {}
{{- end }}
---
# The CA Certificate lives in cert-manager's cluster resource namespace, the
# only place the ClusterIssuer below reads its Secret from.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-certificate-authority
  namespace: {{ include "simplyblock.certManagerNamespace" . }}
spec:
  isCA: true
  commonName: simplyblock-certificate-authority
  secretName: simplyblock-certificate-authority-tls
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: {{ index .Values.tls "cert-manager" "cluster-issuer" | quote }}
---
# ClusterIssuer is cluster-scoped; namespace in metadata is ignored.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: simplyblock-certificate-authority-issuer
spec:
  ca:
    secretName: simplyblock-certificate-authority-tls
---
# CA bundle certificate in the release namespace. Pods cannot mount secrets
# across namespaces, so this certificate (issued by the ClusterIssuer above)
# places a secret containing ca.crt into the release namespace for volume mounts.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-ca-bundle
  namespace: {{ .Release.Namespace }}
spec:
  secretName: simplyblock-ca-bundle-tls
  commonName: simplyblock-ca-bundle
  issuerRef:
    kind: ClusterIssuer
    name: simplyblock-certificate-authority-issuer
  usages:
    - digital signature
    - key encipherment
{{- if .Values.tls.mutual_enabled }}
# The FoundationDB peer certificate is not here. The database is the operator's
# install, and its certificate went with it: the operator issues
# simplyblock-foundationdb, under this name and with these usages, as part of
# applying the cluster it certifies. Two Certificates naming one secretName are
# two controllers writing into one Secret.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-prometheus-client
  namespace: {{ .Release.Namespace }}
spec:
  commonName: simplyblock-prometheus
  secretName: simplyblock-prometheus-client-tls
  issuerRef:
    kind: ClusterIssuer
    name: simplyblock-certificate-authority-issuer
  usages:
    - digital signature
    - key encipherment
    - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-operator-client
  namespace: {{ .Release.Namespace }}
spec:
  commonName: simplyblock-operator
  secretName: simplyblock-operator-client-tls
  issuerRef:
    kind: ClusterIssuer
    name: simplyblock-certificate-authority-issuer
  usages:
    - digital signature
    - key encipherment
    - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-csi-node-client
  namespace: {{ .Release.Namespace }}
spec:
  commonName: simplyblock-csi-node
  secretName: simplyblock-csi-node-client-tls
  issuerRef:
    kind: ClusterIssuer
    name: simplyblock-certificate-authority-issuer
  usages:
    - digital signature
    - key encipherment
    - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-csi-controller-client
  namespace: {{ .Release.Namespace }}
spec:
  commonName: simplyblock-csi-controller
  secretName: simplyblock-csi-controller-client-tls
  issuerRef:
    kind: ClusterIssuer
    name: simplyblock-certificate-authority-issuer
  usages:
    - digital signature
    - key encipherment
    - client auth
{{- if and .Values.controlCenter.enabled (include "sbcc.controlPlaneUrl" .) }}
---
# The Control Center's proxy presents this to the management API when it reads
# storage through it (controlCenter.controlPlane).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplyblock-control-center-client
  namespace: {{ .Release.Namespace }}
spec:
  commonName: simplyblock-control-center
  secretName: simplyblock-control-center-client-tls
  issuerRef:
    kind: ClusterIssuer
    name: simplyblock-certificate-authority-issuer
  usages:
    - digital signature
    - key encipherment
    - client auth
{{- end }}
{{- end }}
{{- end }}
