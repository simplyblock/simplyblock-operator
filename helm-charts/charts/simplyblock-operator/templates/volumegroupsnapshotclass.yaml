# A default VolumeGroupSnapshotClass so a VolumeGroupSnapshot can be taken
# against the simplyblock driver without the user first authoring a class
# (design §5.3, §9). Gated on the same snapshotclass.create toggle as the
# per-volume VolumeSnapshotClass.
{{- if .Values.snapshotclass.create -}}
---
apiVersion: groupsnapshot.storage.k8s.io/v1beta1
kind: VolumeGroupSnapshotClass
metadata:
  name: simplyblock-csi-groupsnapshotclass
  annotations:
    helm.sh/hook: post-install,post-upgrade
driver: csi.simplyblock.io
deletionPolicy: Delete

{{- end -}}
