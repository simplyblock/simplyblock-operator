{{- /*
The class names the hostpath provisioner, so it is rendered only where this
release installs one. A class whose provisioner is absent is advertised by
`kubectl get storageclass` and binds nothing: a PVC pointed at it waits for a
provisioner that is never coming, with nothing in the cluster saying why.
*/}}
{{- if .Values.controlplane.csiHostpathDriver.enabled }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-hostpath
  labels:
    app.kubernetes.io/instance: hostpath.csi.k8s.io
    app.kubernetes.io/part-of: csi-driver-host-path
    app.kubernetes.io/name: csi-hostpath-fast
    app.kubernetes.io/component: storageclass
provisioner: hostpath.csi.k8s.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
{{- if .Values.controlplane.storageclass.allowedTopologyZones }}
allowedTopologies:
- matchLabelExpressions:
  - key: topology.kubernetes.io/zone
    values:
{{- range .Values.controlplane.storageclass.allowedTopologyZones }}
    - {{ . }}
{{- end }}
{{- end }}
{{- end }}
