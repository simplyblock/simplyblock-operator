# Migrate storage node 314c90cb-1da5-42f0-9f6c-cab4b9d220cc from worker-2 to worker-4.
#
# A migration is NOT a drain: the node keeps its UUID and its partitions / logical
# volume assignments follow it. It is a storage-node restart pointed at the target
# host's storage-node-api pod (node_address).
#
# The StorageNodeOpsReconciler (action=migrate):
#   1. validates targetWorkerNode exists and is Ready
#   2. labels the target worker (io.simplyblock.node-type=...) so the storage-node
#      DaemonSet schedules a pod there, then waits for that pod to be Ready
#   3. POST /clusters/{c}/storage-nodes/{uuid}/restart
#        { force, reattach_volume, node_address: <worker-4 api pod> }
#   4. polls until the node reports online on worker-4
#   5. re-points the StorageNode CR's spec.workerNode to worker-4 and swaps the
#      owning StorageNodeSet.spec.workerNodes (worker-2 -> worker-4), then Succeeds
#
# spec.workerNode is only mutable by the operator: the StorageNode validating
# webhook rejects user-driven changes and steers them to this ops instead.
#
#   kubectl apply -f test-node-migration.yaml
#   kubectl get snops,storagenodes -n default -w
apiVersion: storage.simplyblock.io/v1alpha1
kind: StorageNodeOps
metadata:
  name: migrate-314c90cb-to-worker-4
  namespace: default
spec:
  storageNodeRef: simplyblock-node-jqameh
  action: migrate
  targetWorkerNode: worker-4
  # reattachVolume: true   # optional — reattach volumes during the restart
  # force: true            # optional — force the restart where the backend allows it
