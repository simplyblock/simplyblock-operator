---
apiVersion: v1
kind: Pod
metadata:
  name: persist-verify
  labels:
    app: persist-verify
spec:
  restartPolicy: Never
  containers:
  - name: fio
    image: nixery.dev/fio
    imagePullPolicy: IfNotPresent
    command: ["fio"]
    args:
    - --name=verify
    - --rw=read
    - --bs=128k
    - --numjobs=1
    - --size=1g
    - --filename=/data/fio.dat
    - --ioengine=sync
    - --verify=md5
    volumeMounts:
    - mountPath: /data
      name: vol
  volumes:
  - name: vol
    persistentVolumeClaim:
      claimName: persist-pvc
