# Builds the pNFS MDS guest (prototype/boards/pnfs-common) for amd64 and arm64
# and publishes it to docker.io/simplyblock/spdkcsi, next to the CSI images the
# MDS image is released with:
#
#   pnfsos-amd64, pnfsos-arm64   one architecture each (scratch: /vmlinuz, /disk.qcow2)
#   pnfsos                       multi-architecture manifest over both, the MDS
#                                image's GUEST_IMAGE
#   pnfsos-<sha>[-<arch>]        the same, pinned to the commit
#
# Both architectures build in one job, one after the other: the builder keeps
# its output in a Docker volume named per host, not per job, so two builds on
# one host would overwrite each other. The concurrency group serializes this
# workflow across branches for the same reason, which matters once a host
# carries more than one runner. build-and-publish.yml uses the same volumes and
# is not in the group yet.
name: Build and Publish pNFS OS

on:
  push:
    branches: [main, pnfs-minimal]
  pull_request:
    branches: [main, pnfs-minimal]
  workflow_dispatch:
    inputs:
      prebuilt_sdk:
        description: "Download the prebuilt SDK instead of building the toolchain"
        type: boolean
        default: true
      parallel:
        description: "Build packages in parallel (per-package directories)"
        type: boolean
        default: true

concurrency:
  group: velaos-builder
  cancel-in-progress: false

env:
  IMAGE: docker.io/simplyblock/spdkcsi
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  # The prebuilt SDKs are built for x86_64 Linux hosts, which the runner is.
  # Every run uses them except a manual one that asks for the toolchain build.
  SDK_FLAG: ${{ (github.event_name != 'workflow_dispatch' || inputs.prebuilt_sdk) && '--prebuilt-sdk' || '' }}
  # Top-level parallel make over per-package directories, likewise on unless
  # a manual run turns it off.
  PARALLEL_FLAG: ${{ (github.event_name != 'workflow_dispatch' || inputs.parallel) && '--parallel' || '' }}

jobs:
  build:
    runs-on: self-hosted
    steps:
      # Keeps .git, and with it the buildroot clone cached in .git/modules,
      # like build-and-publish.yml does.
      - name: Cleanup
        run: |
          rm -rf ./*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker build environment
        run: |
          ./builder initialize
          ./builder docker setup -i
          ./builder docker clean

      # Both boards write to the same images directory, so each one's guest
      # is collected before the next build replaces it.
      - name: Build amd64
        run: |
          ./builder setup pnfs_qemu_x64 ${SDK_FLAG} ${PARALLEL_FLAG}
          ./builder ccache zero
          ./builder build
          ./builder ccache stats
          mkdir -p guest/amd64
          cp -L images/vmlinuz images/disk.qcow2 guest/amd64/

      # A clean output volume, since the two boards differ in architecture
      # and toolchain. Recreating the volumes rather than make clean: the
      # images directory is a bind mount make clean cannot remove. The
      # download and compiler caches are host directories and survive it.
      - name: Build arm64
        run: |
          ./builder docker clean
          ./builder setup pnfs_qemu_arm64 ${SDK_FLAG} ${PARALLEL_FLAG}
          ./builder ccache zero
          ./builder build
          ./builder ccache stats
          mkdir -p guest/arm64
          cp -L images/vmlinuz images/disk.qcow2 guest/arm64/

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: env.PUBLISH == 'true'
        uses: docker/setup-buildx-action@v3

      # buildx, not the builder's legacy docker: one platform per tag for the
      # per-architecture images, and both platforms for the manifests.
      - name: Push images and manifests
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=7 HEAD)"
          dockerfile=prototype/boards/pnfs-common/scripts/Dockerfile.publish
          # Only the branches the MDS image is released from move the shared
          # pnfsos tags. Any other branch pushes the commit-pinned tags alone.
          case "${GITHUB_REF_NAME}" in
            main|pnfs-minimal) moving=true ;;
            *) moving=false ;;
          esac
          for arch in amd64 arm64; do
            tags=(-t "${IMAGE}:pnfsos-${sha}-${arch}")
            if [ "${moving}" = true ]; then tags+=(-t "${IMAGE}:pnfsos-${arch}"); fi
            docker buildx build --platform "linux/${arch}" -f "${dockerfile}" --push \
              "${tags[@]}" guest
          done
          tags=(-t "${IMAGE}:pnfsos-${sha}")
          if [ "${moving}" = true ]; then tags+=(-t "${IMAGE}:pnfsos"); fi
          docker buildx build --platform linux/amd64,linux/arm64 -f "${dockerfile}" --push \
            "${tags[@]}" guest
