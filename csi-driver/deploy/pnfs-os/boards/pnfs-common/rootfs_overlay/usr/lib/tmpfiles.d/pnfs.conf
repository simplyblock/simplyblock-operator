# /etc is read-only, /etc/exports.d points here. Exports are reassembled by
# the operator after every boot, so they are deliberately not persistent.
d /run/exports.d 0755 root root -
d /run/simplyblock 0755 root root -
d /var/lib/simplyblock/exports 0755 root root -

# The one exception is the NFSv4 root, which lists every client the exports
# admit. nfsd maps each request's source address to an export client before it
# reads the request, and an address no export lists is refused with an RPC
# authentication error, which the client passes to the application as EACCES.
# Kept on the state volume, the root is exported from nfsd's first moment after a
# restart, and a client asking for an export not assembled yet is told to retry
# (patch 0003) instead. The agent writes the root through this link.
# The state volume is mounted over /var/lib/nfs at promotion, so mds-agent runs
# systemd-tmpfiles --create for these three lines again once it is mounted.
d /var/lib/nfs/exports 0755 root root -
f /var/lib/nfs/exports/pnfs-root.exports 0644 root root -
L /run/exports.d/pnfs-root.exports - - - - /var/lib/nfs/exports/pnfs-root.exports
