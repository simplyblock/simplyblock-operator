version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - onelinefunc
  settings:
    custom:
      onelinefunc:
        type: module
        description: A function declaration's body does not share a line with its signature.
        original-url: hack/golangci-onelinefunc
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# golangci-lint reports at most three occurrences of the same message and fifty
# per linter by default, so a run that says "3 issues" may be hiding thirty. A
# rule like onelinefunc produces one identical message per site, which is
# exactly the shape that cap truncates, and a gate that under-reports is worse
# than a slow one.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
