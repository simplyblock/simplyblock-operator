name: "Repo: Release"

# Unified release for the whole monorepo. Fires when a v* tag is pushed. Each
# job below is a reusable workflow, wired with `needs:` to only the jobs it
# actually depends on:
#
#   setup
#     ├─ build-atlas ──┬─ build-csi ────────────────────────────┐
#     │                └─ build-operator ─┬─ release-operator ──┤ (OLM bundle)
#     │                                   └─ package-operator-chart ─┐
#     └─ package-csi-chart ──────────────────────────────────────┴─ merge-helm ─┴─ release-helm (FTPS publish)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3) to run the pipeline for (tag must already exist)"
        required: true
        type: string

permissions:
  contents: write   # operator release attaches the OLM bundle to the GitHub release

jobs:
  setup:
    name: Resolve version & ensure release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version resolved (v* tag push or workflow_dispatch input required)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — reusing it"
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
          fi

  # Vet and test gate. A broken library fails the release before any image build.
  build-atlas:
    name: Build atlas
    needs: setup
    uses: ./.github/workflows/atlas_test.yaml
    secrets: inherit

  # Independent of build-operator: neither image consumes the other.
  build-csi:
    name: Build csi
    needs: [setup, build-atlas]
    uses: ./.github/workflows/csi_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  build-operator:
    name: Build operator
    needs: [setup, build-atlas]
    uses: ./.github/workflows/operator_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # Retags build-operator's DockerHub images to Quay, then bundles the OLM
  # manifests against them, so it waits on build-operator.
  release-operator:
    name: Release operator
    needs: [setup, build-operator]
    uses: ./.github/workflows/operator_release.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  package-csi-chart:
    name: Package CSI chart
    needs: setup
    uses: ./.github/workflows/csi_chart_release.yaml
    secrets: inherit

  # Waits on build-operator: the chart's values.yaml pins the image tags it ships.
  package-operator-chart:
    name: Package operator chart
    needs: [setup, build-operator]
    uses: ./.github/workflows/helm_release.yaml
    secrets: inherit

  merge-helm:
    name: Merge helm charts
    needs: [package-csi-chart, package-operator-chart]
    uses: ./.github/workflows/helm_merge_charts.yaml
    with:
      use_artifacts: true
      base_url: https://install.simplyblock.io/helm
    secrets: inherit

  # Publishes the release, so it waits on every image the charts reference.
  release-helm:
    name: Release helm charts
    needs: [merge-helm, build-csi, build-operator, release-operator]
    runs-on: ubuntu-latest
    steps:
      - name: Download merged Helm repo
        uses: actions/download-artifact@v4
        with:
          name: merged-helm-repo
          path: merged-charts

      - name: Publish to install.simplyblock.io via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./merged-charts/
