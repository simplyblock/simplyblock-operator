name: "Repo: Release"

# Unified release for the whole monorepo. Fires when a v* tag is pushed. The
# `setup` job creates the GitHub Release for that tag, and the tag is the version
# fed to the container image builds. Each step below is a reusable workflow, wired
# together with `needs:` so that only the real dependencies are serialized:
#
#   setup
#     └─ build-atlas ──┬─ build-csi ─────────────┐
#                      └─ build-operator ─┬──────┤
#                                         └─ release-operator (OLM bundle)
#     ├─ package-csi-chart ─────┐                │
#     └─ package-operator-chart ┴─ merge-helm ───┴─ release-helm (FTPS publish)
#
# release-helm is the only job that publishes anything, which is why it waits on
# every image the charts it ships reference.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3) to run the pipeline for (tag must already exist)"
        required: true
        type: string

permissions:
  contents: write   # operator release attaches the OLM bundle to the GitHub release

jobs:
  setup:
    name: Resolve version & ensure release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version resolved (v* tag push or workflow_dispatch input required)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — reusing it"
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
          fi

  # The vet and test gate. Everything else hangs off it, so a broken library
  # fails the release before it spends a runner on a multi-arch image build.
  build-atlas:
    name: Build atlas
    needs: setup
    uses: ./.github/workflows/atlas_test.yaml
    secrets: inherit

  # The container images. The two builds are independent: neither image consumes
  # the other, and atlas-lib reaches both through a `replace` directive pointing
  # at this same checkout rather than through a registry.
  build-csi:
    name: Build csi
    needs: [setup, build-atlas]
    uses: ./.github/workflows/csi_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  build-operator:
    name: Build operator
    needs: [setup, build-atlas]
    uses: ./.github/workflows/operator_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # The OLM bundle. `make bundle` resolves the digests of the operator images
  # from Quay and fails if they are absent, so this genuinely waits on the
  # operator build.
  release-operator:
    name: Release operator
    needs: [setup, build-operator]
    uses: ./.github/workflows/operator_release.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # The two chart packaging jobs, each producing the artifact the merge below
  # consumes. Both only read Chart.yaml, the templates, and the committed
  # dependency tarballs, so neither waits on an image. Neither publishes
  # anything either: release-helm is the only job that does.
  package-csi-chart:
    name: Package CSI chart
    needs: setup
    uses: ./.github/workflows/csi_chart_release.yaml
    secrets: inherit

  package-operator-chart:
    name: Package operator chart
    needs: setup
    uses: ./.github/workflows/helm_release.yaml
    secrets: inherit

  # Merge the two packaged charts into one repo index. Consumes the two chart
  # artifacts and nothing else, so it runs as soon as they exist: a merge failure
  # then surfaces without waiting out the image builds.
  merge-helm:
    name: Merge helm charts
    needs: [package-csi-chart, package-operator-chart]
    uses: ./.github/workflows/helm_merge_charts.yaml
    with:
      use_artifacts: true
      base_url: https://install.simplyblock.io/helm
    secrets: inherit

  # 7. release Helm charts (publish the merged repo via FTPS). This is the step
  # that makes the release public, so it waits on every image the published
  # charts reference and on the bundle. Packaging and merging may run early, but
  # a chart is never published against an image that failed to build.
  release-helm:
    name: Release helm charts
    needs: [merge-helm, build-csi, build-operator, release-operator]
    runs-on: ubuntu-latest
    steps:
      - name: Download merged Helm repo
        uses: actions/download-artifact@v4
        with:
          name: merged-helm-repo
          path: merged-charts

      - name: Publish to install.simplyblock.io via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./merged-charts/
