name: "Repo: Release"

# Unified, ordered release for the whole monorepo. Fires when a v* tag is pushed;
# the `setup` job creates the GitHub Release for that tag, and the tag is the version
# fed to the container image builds. Runs:
#   build atlas -> build csi -> build operator -> release csi -> release operator
#   -> merge helm charts -> release (publish) helm charts
#   -> commit helm charts (PR against main)
# Each step is a reusable workflow invoked with `needs:` for ordering.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3) to run the pipeline for (tag must already exist)"
        required: true
        type: string

permissions:
  contents: write       # the OLM bundle upload and the commit-helm-charts branch push
  pull-requests: write  # commit-helm-charts opens the pull request against main

jobs:
  setup:
    name: Resolve version & ensure release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version resolved (v* tag push or workflow_dispatch input required)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — reusing it"
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
          fi

  # 1. build atlas (vet + test gate)
  build-atlas:
    name: Build atlas
    needs: setup
    uses: ./.github/workflows/atlas_test.yaml
    secrets: inherit

  # 2. build csi (container images)
  build-csi:
    name: Build csi
    needs: [setup, build-atlas]
    uses: ./.github/workflows/csi_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # 3. build operator (container images)
  build-operator:
    name: Build operator
    needs: [setup, build-csi]
    uses: ./.github/workflows/operator_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # 4. release csi (package spdk-csi chart -> artifact helm-charts-csi)
  release-csi:
    name: Release csi
    needs: build-operator
    uses: ./.github/workflows/csi_chart_release.yaml
    secrets: inherit

  # 5. release operator (quay images + OLM bundle)
  release-operator:
    name: Release operator
    needs: [setup, release-csi]
    uses: ./.github/workflows/operator_release.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # 5b. package operator chart -> artifact helm-charts-operator (feeds the merge)
  package-operator-chart:
    name: Package operator chart
    needs: release-csi
    uses: ./.github/workflows/helm_release.yaml
    secrets: inherit

  # 6. merge helm charts (operator + csi -> merged-helm-repo)
  merge-helm:
    name: Merge helm charts
    needs: [release-operator, package-operator-chart]
    uses: ./.github/workflows/helm_merge_charts.yaml
    with:
      use_artifacts: true
      base_url: https://install.simplyblock.io/helm
    secrets: inherit

  # 7. release helm charts (publish the merged repo via FTPS)
  release-helm:
    name: Release helm charts
    needs: merge-helm
    runs-on: ubuntu-latest
    steps:
      - name: Download merged Helm repo
        uses: actions/download-artifact@v4
        with:
          name: merged-helm-repo
          path: merged-charts

      - name: Publish to install.simplyblock.io via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./merged-charts/

  # The published repository is rebuilt from the committed charts on every
  # release, and the FTPS sync deletes whatever the rebuild lacks. This pull
  # request commits the charts just published, so the next release keeps them.
  commit-helm-charts:
    name: Commit released helm charts
    needs: [setup, release-helm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Download operator chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-charts-operator
          path: packaged/operator

      - name: Download csi chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-charts-csi
          path: packaged/csi

      - name: Add the released charts
        run: |
          helm-charts/scripts/add-released-charts.sh packaged/operator helm-charts/charts https://install.simplyblock.io/helm
          helm-charts/scripts/add-released-charts.sh packaged/csi csi-driver/charts/spdk-csi https://install.simplyblock.io/helm
          rm -rf packaged

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "The charts of $VERSION are already committed"
            exit 0
          fi
          BRANCH="release/helm-charts-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add helm-charts/charts csi-driver/charts/spdk-csi
          git commit -m "chore(helm): commit the $VERSION charts"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[]')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(helm): commit the $VERSION charts" \
              --body "Commits the operator and spdk-csi charts that $VERSION published to https://install.simplyblock.io/helm. Merge it before the next release: the next release rebuilds the published repository from the committed charts and deletes any chart missing from main."
          fi
