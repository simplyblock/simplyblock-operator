name: "Repo: Release"

# Unified, ordered release for the whole monorepo. Fires when a v* tag is pushed;
# the `setup` job creates the GitHub Release for that tag, and the tag is the version
# fed to the container image builds. Runs:
#   build atlas -> build csi -> build operator -> release csi -> release operator
#   -> release (publish) helm charts through the charts branch
# Each step is a reusable workflow invoked with `needs:` for ordering.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3) to run the pipeline for (tag must already exist)"
        required: true
        type: string

permissions:
  contents: write       # the OLM bundle upload and the push to the charts branch

jobs:
  setup:
    name: Resolve version & ensure release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version resolved (v* tag push or workflow_dispatch input required)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — reusing it"
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --generate-notes --verify-tag
          fi

  # 1. build atlas (vet + test gate)
  build-atlas:
    name: Build atlas
    needs: setup
    uses: ./.github/workflows/atlas_test.yaml
    secrets: inherit

  # 2. build csi (container images)
  build-csi:
    name: Build csi
    needs: [setup, build-atlas]
    uses: ./.github/workflows/csi_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # 3. build operator (container images)
  build-operator:
    name: Build operator
    needs: [setup, build-csi]
    uses: ./.github/workflows/operator_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # 4. release csi (package spdk-csi chart -> artifact helm-charts-csi)
  release-csi:
    name: Release csi
    needs: build-operator
    uses: ./.github/workflows/csi_chart_release.yaml
    secrets: inherit

  # 5. release operator (quay images + OLM bundle)
  release-operator:
    name: Release operator
    needs: [setup, release-csi]
    uses: ./.github/workflows/operator_release.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # 5b. package operator chart -> artifact helm-charts-operator (feeds the publish).
  # The packaged chart carries the release version and names the images this
  # release built.
  package-operator-chart:
    name: Package operator chart
    needs: [setup, release-csi]
    uses: ./.github/workflows/helm_release.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # The published Helm repository lives in the charts branch, which holds every
  # released chart in the <version>/<chart>-<version>.tgz layout the server
  # serves. A release adds its two charts to that branch and uploads the branch,
  # so a tag cut from any release branch keeps the charts of every other release.
  # Publishing waits on every image the charts reference, and a single
  # concurrency group keeps two releases from pushing or uploading at once.
  # Each release adds only its own charts, so a release whose job is canceled
  # stays unpublished; queue: max keeps every waiting release in line instead of
  # replacing the pending one.
  release-helm:
    name: Release helm charts
    needs: [setup, release-csi, release-operator, package-operator-chart]
    runs-on: ubuntu-latest
    concurrency:
      group: helm-charts-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout charts branch
        uses: actions/checkout@v4
        with:
          ref: charts
          path: published

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Download operator chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-charts-operator
          path: packaged/operator

      - name: Download csi chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-charts-csi
          path: packaged/csi

      - name: Add the released charts
        run: |
          helm-charts/scripts/add-released-charts.sh packaged/operator published https://install.simplyblock.io/helm
          helm-charts/scripts/add-released-charts.sh packaged/csi published https://install.simplyblock.io/helm

      - name: Commit to the charts branch
        working-directory: ./published
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The charts of $VERSION are already in the charts branch"
          else
            git commit -m "chore(helm): publish the $VERSION charts"
            git pull --rebase origin charts
            git push origin HEAD:charts
          fi

      - name: Publish to install.simplyblock.io via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./published/
