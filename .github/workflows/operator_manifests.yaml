name: "Operator: Manifests"

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - ".github/workflows/operator_manifests.yaml"
  pull_request:
    paths:
      - "operator/**"
      - ".github/workflows/operator_manifests.yaml"

jobs:
  manifests:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Clone the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: operator/go.mod

      - name: Check every manifest under config/ parses as YAML
        run: make verify-config-yaml

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.7.0"
          KUBECONFORM_SHA256="c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Check generated manifests are up to date
        run: |
          make manifests generate
          git diff --exit-code || (echo "Generated files are out of date. Run 'make manifests generate' and commit the result." && exit 1)

      - name: Build installer
        run: |
          make build-installer
          git diff --exit-code || (echo "dist/install.yaml is out of date. Run 'make build-installer' and commit the result." && exit 1)

      - name: Validate rendered manifests
        run: |
          kubeconform -strict -summary -skip CustomResourceDefinition,Certificate,ClusterIssuer dist/install.yaml

      - name: Check CSV's owned CRD list is complete and documented
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import glob
          import sys

          import yaml

          crd_kinds = set()
          for f in glob.glob("config/crd/bases/*.yaml"):
              d = yaml.safe_load(open(f))
              crd_kinds.add(d["spec"]["names"]["kind"])

          csv = yaml.safe_load(
              open("config/manifests/bases/simplyblock-operator.clusterserviceversion.yaml")
          )
          owned = csv["spec"]["customresourcedefinitions"]["owned"]
          owned_kinds = {o["kind"] for o in owned}

          missing = crd_kinds - owned_kinds
          stale = owned_kinds - crd_kinds
          no_description = sorted(o["kind"] for o in owned if not o.get("description"))

          errors = []
          if missing:
              errors.append(
                  "CRDs with no entry in the CSV's customresourcedefinitions.owned list "
                  f"(the 'Provided APIs' panel on the install page will be incomplete): {sorted(missing)}"
              )
          if stale:
              errors.append(
                  "CSV owned entries with no matching CRD under config/crd/bases/ "
                  f"(stale, referencing a removed/renamed type): {sorted(stale)}"
              )
          if no_description:
              errors.append(
                  "CSV owned entries missing a 'description' (shows as 'Not available' "
                  f"in the console's Provided APIs panel): {no_description}"
              )

          if errors:
              print(
                  "config/manifests/bases/simplyblock-operator.clusterserviceversion.yaml "
                  "is out of sync with config/crd/bases/. Fix it there — this file is "
                  "hand-maintained and not covered by 'make manifests generate'.\n"
              )
              print("\n".join(errors))
              sys.exit(1)
          print("CSV owned CRDs match config/crd/bases/ and all have descriptions.")
          EOF

  helm-sync:
    name: Check Helm chart is in sync with operator
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: operator/go.mod

      - name: Check Helm chart CRDs, RBAC and webhook manifests are up to date
        run: |
          make helm-sync
          git diff --exit-code -- helm-charts || (echo "Helm chart is out of date. Run 'make helm-sync' from the repo root and commit the result." && exit 1)
