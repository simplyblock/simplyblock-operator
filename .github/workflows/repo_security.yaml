# Daily CVE scan of the images that are published, for main and for the two
# supported release lines (26.3 and 26.4). It replaces the per-component scans
# that built an image from source on main, because a CVE disclosed after a
# release went out has to show up here without a new push to any branch.
#
# One job per line and image. Each line resolves to its newest release branch
# (release/<line>.*) and its newest release tag (v<line>.*). The image built
# from that branch is what gates the run: it is the code about to ship, so an
# unfixed CVE there fails the job. The image published for the release tag is
# scanned too, without gating. A CVE found only in the released image is
# already fixed on the branch and waits for the next release, so it is posted
# to Slack as pending and does not fail the run. main has no release to compare
# against and only gets the gating scan.
#
# Add a line to the matrix the day its release becomes supported and remove it
# the day support ends. Beta-only lines belong here once a release branch
# exists for them, because the scan resolves from release/<line>.* and v<line>.*.

name: "Repo: Security Scan"

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  scan:
    name: Security Scan (${{ matrix.component }}, ${{ matrix.line }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line:
          - main
          - "26.3"
          - "26.4"
        component:
          - operator
          - rebalancer
          - csi
        include:
          - component: operator
            image: docker.io/simplyblock/simplyblock-operator
          - component: rebalancer
            image: docker.io/simplyblock/simplyblock-rebalancer
          - component: csi
            image: docker.io/simplyblock/spdkcsi

    steps:
      # The first checkout only supplies git remote access for the tag lookup.
      # The scan itself runs from the second checkout.
      - name: Checkout default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # A release branch carries its own .grype.yaml, so scanning from that
      # checkout lets the exceptions of each line diverge through ordinary
      # commits. Tags order as versions, with a -beta suffix before the bare
      # version and a numeric suffix (v26.3.1-1) after it.
      - name: Resolve branch and image tags
        id: tags
        env:
          LINE: ${{ matrix.line }}
        run: |
          latest() {
            while IFS= read -r name; do
              printf '%s\t%s\n' "$(printf '%s' "$name" | sed -E 's/-([A-Za-z])/~\1/')" "$name"
            done | sort -t "$(printf '\t')" -V -k1,1 | tail -1 | cut -f2
          }
          # A Docker tag admits [a-zA-Z0-9_.-], the same mapping operator_build.yaml applies.
          sanitize() { printf '%s' "$1" | tr -c 'a-zA-Z0-9_.-' '-'; }

          if [[ "$LINE" == main ]]; then
            {
              echo "branch=main"
              echo "branch_tag=main"
              echo "release_tag="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          escaped="${LINE//./\\.}"
          branch="$(git ls-remote --heads --refs origin | sed 's#.*refs/heads/##' \
                      | { grep -E "^release/${escaped}\." || true; } | latest)"
          tag="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' \
                   | { grep -E "^v${escaped}\." || true; } | latest)"

          if [[ -z "$branch" ]]; then
            echo "::error::No release/${LINE}.* branch found."
            exit 1
          fi
          if [[ -z "$tag" ]]; then
            echo "::error::No v${LINE}.* release tag found."
            exit 1
          fi
          # Refuse a tag that does not look like a release, such as a stray
          # tag that happens to share the prefix.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}(-[A-Za-z0-9]+)?$ ]]; then
            echo "::error::Resolved tag '${tag}' for line ${LINE} does not match the release-tag shape."
            exit 1
          fi
          {
            echo "branch=${branch}"
            echo "branch_tag=$(sanitize "$branch")"
            echo "release_tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      # Not the local registry-login action: the second checkout replaces the
      # workspace, and the action's post step then cannot find its own files.
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tags.outputs.branch }}

      - name: Pull branch image
        run: docker pull --platform linux/amd64 ${{ matrix.image }}:${{ steps.tags.outputs.branch_tag }}

      - name: Pull released image
        if: matrix.line != 'main'
        run: docker pull --platform linux/amd64 ${{ matrix.image }}:${{ steps.tags.outputs.release_tag }}

      # The gating scans continue on error so the released-image scans and the
      # diff still run. The "Fail job" step below turns their outcome into the
      # job result.
      #
      # Grype uses Red Hat's Security Data API, much more current than Trivy's OVAL source.
      - name: Run Grype on branch image (gating)
        id: grype-branch
        continue-on-error: true
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ matrix.image }}:${{ steps.tags.outputs.branch_tag }}
          severity-cutoff: medium
          fail-build: true
          only-fixed: true
          output-format: json
          output-file: grype-branch.json

      - name: Run Grype on released image (informational)
        if: matrix.line != 'main'
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ matrix.image }}:${{ steps.tags.outputs.release_tag }}
          severity-cutoff: medium
          fail-build: false
          only-fixed: true
          output-format: json
          output-file: grype-release.json

      - name: Run Trivy on branch image (gating)
        id: trivy-branch
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.tags.outputs.branch_tag }}
          format: json
          output: trivy-branch.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret

      - name: Run Trivy on released image (informational)
        if: matrix.line != 'main'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.tags.outputs.release_tag }}
          format: json
          output: trivy-release.json
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'
          scanners: vuln,secret

      # A CVE in the released image and absent from the branch image is already
      # fixed on the branch. A missing or empty report skips the diff, because
      # comparing against an empty branch report would list every released CVE
      # as pending.
      - name: Compute pending-release CVEs
        id: diff
        if: matrix.line != 'main'
        run: |
          for f in grype-branch.json grype-release.json trivy-branch.json trivy-release.json; do
            if [[ ! -s "$f" ]]; then
              echo "::warning::$f is missing or empty; skipping the pending-release diff."
              echo "has_pending=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          grype_ids() {
            jq -r '.matches[]? | select(.vulnerability.severity | ascii_downcase | IN("medium","high","critical")) | .vulnerability.id' "$1" | sort -u
          }
          trivy_ids() {
            jq -r '.Results[]?.Vulnerabilities[]?.VulnerabilityID' "$1" | sort -u
          }

          pending_grype=$(comm -23 <(grype_ids grype-release.json) <(grype_ids grype-branch.json))
          pending_trivy=$(comm -23 <(trivy_ids trivy-release.json) <(trivy_ids trivy-branch.json))
          pending="$(printf '%s\n%s\n' "$pending_grype" "$pending_trivy" | sed '/^$/d' | sort -u)"

          if [[ -n "$pending" ]]; then
            echo "Fixed on '${{ steps.tags.outputs.branch }}', not yet released:"
            echo "$pending"
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
            echo "pending=$(printf '%s' "$pending" | tr '\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      # Lists what the gating scans found, so a failed run can be read without
      # downloading a report.
      - name: Summarize branch-image findings
        if: always()
        run: |
          {
            echo "### ${{ matrix.component }} ${{ matrix.line }}: ${{ matrix.image }}:${{ steps.tags.outputs.branch_tag }}"
            echo
            echo "| ID | Severity | Package | Installed | Fixed in |"
            echo "|----|----------|---------|-----------|----------|"
            if [[ -s grype-branch.json ]]; then
              jq -r '.matches[]? | select(.vulnerability.severity | ascii_downcase | IN("medium","high","critical"))
                | "| \(.vulnerability.id) | \(.vulnerability.severity) | \(.artifact.name) | \(.artifact.version) | \(.vulnerability.fix.versions | join(", ")) |"' grype-branch.json | sort -u
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ matrix.image }}:${{ steps.tags.outputs.branch_tag }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.component }}-${{ matrix.line }}-${{ steps.tags.outputs.branch_tag }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Fail job if a gating scan found vulnerabilities
        if: steps.grype-branch.outcome == 'failure' || steps.trivy-branch.outcome == 'failure'
        run: |
          echo "grype: ${{ steps.grype-branch.outcome }}, trivy: ${{ steps.trivy-branch.outcome }}"
          echo "A scan of the branch image found vulnerabilities at or above the medium cutoff."
          exit 1

      - name: Notify Slack on scan failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *Security scan failed* for `${{ matrix.image }}`",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Line",     "value": "${{ matrix.line }}", "short": true },
                    { "title": "Image",    "value": "${{ matrix.image }}:${{ steps.tags.outputs.branch_tag }}", "short": true },
                    { "title": "Workflow", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>", "short": false }
                  ]
                }
              ]
            }

      - name: Notify Slack on pending-release CVEs
        if: always() && steps.diff.outputs.has_pending == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":hourglass_flowing_sand: *Security fix pending release* for `${{ matrix.image }}`",
              "attachments": [
                {
                  "color": "warning",
                  "fields": [
                    { "title": "Line",           "value": "${{ matrix.line }}", "short": true },
                    { "title": "Released image", "value": "${{ matrix.image }}:${{ steps.tags.outputs.release_tag }}", "short": true },
                    { "title": "Fixed on branch but not yet released", "value": "${{ steps.diff.outputs.pending }}", "short": false },
                    { "title": "Workflow",       "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>", "short": false }
                  ]
                }
              ]
            }
