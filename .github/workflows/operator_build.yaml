name: "Operator: Docker Build"

on:
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (defaults to the branch ref)"
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-and-push:
    name: "Build and push (${{ matrix.name }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.image_tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            dockerfile: operator/Dockerfile
            image_name: simplyblock/simplyblock-operator
            ecr_image_name: simply-block/simplyblock-operator
            quay_image_name: quay.io/simplyblock-io/simplyblock-operator
            internal_image_name: registry.simplyblock.ai/simplyblock/simplyblock-operator
          - name: rebalancer
            dockerfile: operator/Dockerfile.simplyblock-rebalancer
            image_name: simplyblock/simplyblock-rebalancer
            ecr_image_name: simply-block/simplyblock-rebalancer
            quay_image_name: quay.io/simplyblock-io/simplyblock-rebalancer
            internal_image_name: registry.simplyblock.ai/simplyblock/simplyblock-rebalancer

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Quay.io ships customer-facing images, so only a release run (one that
      # names a version) logs in and pushes there.
      - name: Log in to container registries
        id: login
        uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          quay: ${{ inputs.version != '' }}
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-password: ${{ secrets.QUAY_PASSWORD }}
          internal-username: ${{ secrets.INTERNAL_USERNAME }}
          internal-password: ${{ secrets.INTERNAL_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute image tag
        id: image_tag
        # A Docker tag admits [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, and a branch name
        # admits far more than that, so every character outside the set becomes a
        # dash rather than only "/." Sanitizing one character was enough until a
        # branch carried a "+," which produced an invalid reference and failed the
        # build after the image had already been built.
        run: |
          version="${{ inputs.version || github.ref_name }}"
          tag="$(printf %s "$version" | tr -c 'a-zA-Z0-9_.-' '-' | cut -c1-128)"
          # A tag's first character may not be a dash or a dot.
          tag="$(printf %s "$tag" | sed 's/^[^a-zA-Z0-9_]*//')"
          if [ -z "$tag" ]; then
            echo "::error::branch name ${version} sanitizes to an empty image tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Both Dockerfiles read this as the OCI `version` label, which must not
          # carry the tag's leading "v."
          echo "label_version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Quay.io is only listed on a release run, matching the login step above.
      - name: Determine target tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${{ matrix.image_name }}:${{ steps.image_tag.outputs.tag }}"
            echo "${{ steps.login.outputs.ecr-registry }}/${{ matrix.ecr_image_name }}:${{ steps.image_tag.outputs.tag }}"
            echo "${{ matrix.internal_image_name }}:${{ steps.image_tag.outputs.tag }}"
            if [ -n "${{ inputs.version }}" ]; then
              echo "${{ matrix.quay_image_name }}:${{ steps.image_tag.outputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch ${{ matrix.name }} image (DockerHub + ECR + Quay + Internal)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image_tag.outputs.label_version }}
            RELEASE=1
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # An OLM bundle for the branch's images. A release pushes its own, with
  # digests, from operator_release.yaml.
  bundle:
    name: "Build and push (bundle)"
    if: inputs.version == ''
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: operator
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: operator/go.mod

      - name: Install operator-sdk
        run: |
          OPERATOR_SDK_VERSION="v1.42.2"
          OPERATOR_SDK_SHA256="8847c45ea994ac62b3cd134f77934df2a16a56a39a634eb988e0d1db99d1a413"
          curl -sLo /usr/local/bin/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/${OPERATOR_SDK_VERSION}/operator-sdk_linux_amd64"
          echo "${OPERATOR_SDK_SHA256}  /usr/local/bin/operator-sdk" | sha256sum -c -
          chmod +x /usr/local/bin/operator-sdk

      - name: Install kustomize
        run: |
          make kustomize
          echo "${{ github.workspace }}/operator/bin" >> "$GITHUB_PATH"

      # A ClusterServiceVersion name must be SemVer, so the run number stands in
      # for the version and the branch is in the image tag.
      - name: Build and push the bundle image
        run: |
          make bundle-dev \
            VERSION=0.0.0-${{ github.run_number }} IMG_TAG="$TAG" \
            IMG_BASE=docker.io/simplyblock/simplyblock-operator \
            REBALANCER_IMG_BASE=docker.io/simplyblock/simplyblock-rebalancer \
            CLUSTER_IMAGE_BASE=docker.io/simplyblock/simplyblock CLUSTER_IMAGE_TAG=main
          docker build -f bundle.Dockerfile -t "docker.io/simplyblock/simplyblock-operator-bundle:$TAG" .
          docker push "docker.io/simplyblock/simplyblock-operator-bundle:$TAG"
