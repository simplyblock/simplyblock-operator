name: "Operator: Docker Build"

on:
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (defaults to the branch ref)"
        required: false
        type: string

jobs:
  build-and-push:
    name: "Build and push (${{ matrix.name }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            dockerfile: operator/Dockerfile
            image_name: simplyblock/simplyblock-operator
            ecr_image_name: simply-block/simplyblock-operator
            quay_image_name: quay.io/simplyblock-io/simplyblock-operator
          - name: rebalancer
            dockerfile: operator/Dockerfile.simplyblock-rebalancer
            image_name: simplyblock/simplyblock-rebalancer
            ecr_image_name: simply-block/simplyblock-rebalancer
            quay_image_name: quay.io/simplyblock-io/simplyblock-rebalancer

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Quay is the registry OLM bundles resolve images from, so it only needs a
      # tag on an actual release. This job is invoked via workflow_call only from
      # repo_release.yaml's v* tag trigger, never from a plain branch push.
      - name: Log in to Quay.io
        if: github.event_name == 'workflow_call'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute image tag
        id: image_tag
        # Docker tags cannot contain "/," but branch names (e.g., feature/foo) can,
        # so sanitize before using the ref name as a tag.
        run: |
          version="${{ inputs.version || github.ref_name }}"
          tag="${version//\//-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Both Dockerfiles surface this as the OCI `version` label. It tracks the
          # release tag with the leading "v" removed, so a released image is
          # labeled 26.3.0 instead of the constant this step used to pass.
          echo "label_version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Quay only belongs in the tag list on a release, per the Quay login step
      # above. build-push-action rejects an empty tag line, so the Quay tag is
      # assembled here rather than inlined as a conditional expression in `tags:`.
      - name: Compute image tags
        id: image_tags
        run: |
          {
            echo 'tags<<EOF'
            echo "${{ matrix.image_name }}:${{ steps.image_tag.outputs.tag }}"
            echo "${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_image_name }}:${{ steps.image_tag.outputs.tag }}"
            if [ "${{ github.event_name }}" = "workflow_call" ]; then
              echo "${{ matrix.quay_image_name }}:${{ steps.image_tag.outputs.tag }}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch ${{ matrix.name }} image (DockerHub + ECR, + Quay on release)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image_tag.outputs.label_version }}
            RELEASE=1
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
