name: "Gateway: Docker Build"

# Mirrors CSI: Docker Build's own build job (csi_build.yaml): same registries,
# same tag scheme, same multi-arch buildx shape. No MDS job and no
# integration-suite job here, because gateway has neither: it is one image,
# and the suite that would exercise it (design-objectstore.md's ObjectStore
# reconciler driving a gateway Deployment) does not exist yet.

on:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (defaults to the branch/tag ref)"
        required: false
        type: string
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/simplyblock/gateway
  ECR_IMAGE_NAME: public.ecr.aws/simply-block/gateway
  QUAY_IMAGE_NAME: quay.io/simplyblock-io/gateway

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # Quay.io ships customer-facing images, so only a release run (one that names
    # a version) logs in and pushes there.
    - name: Log in to Quay.io
      if: inputs.version != ''
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Quay.io is only listed on a release run, matching the login step above.
    - name: Determine target registries
      id: registries
      run: |
        {
          echo "images<<EOF"
          echo "${IMAGE_NAME}"
          echo "${ECR_IMAGE_NAME}"
          if [ -n "${{ inputs.version }}" ]; then
            echo "${QUAY_IMAGE_NAME}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.registries.outputs.images }}
        tags: |
          type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.event_name == 'release' || inputs.version != '' }}
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=${{ github.ref_name }}-,format=short,enable=${{ github.event_name == 'push' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: gateway
        file: gateway/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha,scope=gateway
        cache-to: type=gha,mode=max,scope=gateway
