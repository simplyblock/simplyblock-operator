# GitHub Action to automate the identification of common misspellings in text files.
# https://github.com/codespell-project/actions-codespell
# https://github.com/codespell-project/codespell
name: "Repo: Codespell"
on:
  push:
    branches: ['main']
  pull_request:

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@master
        with:
          check_filenames: true
          # Scan every component (operator, atlas-lib, csi-driver, helm-charts) plus
          # top-level files. "." = the whole checkout; the skip list prunes noise.
          path: .
          # zz_generated.openapi.go embeds upstream apimachinery doc comments
          # verbatim (resource.Quantity spells "implementors"), so its prose is
          # not ours to correct and regeneration would undo any edit.
          # Two vendored/exported trees whose prose is not ours to correct, same
          # rationale as zz_generated below (re-generating undoes any edit):
          #  - helm-charts/.../ramen: RamenDR CRDs vendored verbatim ("vaious").
          #  - control-center design exports: the console's *.jsx, index.html and
          #    CRD/RBAC design docs are re-exported from Claude Design, so typos
          #    there (asend, acount, ...) are fixed upstream, not here. The
          #    hand-maintained files (mock/, README, INTEGRATION.md) stay checked.
          skip: ./.git,.git,./.github/workflows/repo_codespell.yaml,*.png,*.jpg,*.svg,*.sum,*.tgz,./vendor,go.sum,*zz_generated.openapi.go,./helm-charts/charts/simplyblock-operator/ramen,*.jsx,./control-center/dist,./control-center/index.html,./control-center/config.js,./control-center/CRD-MAIN.md,./control-center/CRD-CROSSCHECK.md,./control-center/RBAC-DESIGN.md
          # AfterAll: Ginkgo suite node (codespell lowercases it to "afterall")
          # notin: the Kubernetes label-selector set operator (control-center/mock)
          ignore_words_list: "browseable,ro,NotIn,afterall,notin"
