name: "Repo: Lint"

# golangci-lint across all three Go modules in the monorepo, one matrix job each.
# operator uses its own operator/.golangci.yml; atlas-lib and csi-driver have no
# (v2) config yet, so they lint against golangci-lint's v2 defaults.

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - "atlas-lib/**"
      - "csi-driver/**"
      - ".github/workflows/repo_lint.yaml"
  pull_request:
    paths:
      - "operator/**"
      - "atlas-lib/**"
      - "csi-driver/**"
      - ".github/workflows/repo_lint.yaml"

jobs:
  lint:
    name: Lint (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [operator, atlas-lib, csi-driver]
    steps:
      - name: Clone the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.component }}/go.mod

      # golangci-lint-action installs the released binary, which does not carry
      # this repository's onelinefunc linter and rejects a config enabling it.
      # The binary is built from .custom-gcl.yml instead, against the same
      # version scripts/tools.manifest pins.
      - name: Build golangci-lint with this repository's linters
        run: make custom-gcl

      # Run it directly rather than through `make -C <component> lint`: the
      # atlas-lib target also runs code generation, which this job does not
      # provision and the action never did either.
      - name: Run linter
        working-directory: ${{ matrix.component }}
        run: '"${GITHUB_WORKSPACE}/.bin/custom-gcl" run ./...'
