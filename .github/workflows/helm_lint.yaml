name: "Helm: Lint"

on:
  push:
    branches:
      - main
    paths:
      - "helm-charts/charts/simplyblock-operator/**"
      - ".github/workflows/helm_lint.yaml"
  pull_request:
    paths:
      - "helm-charts/charts/simplyblock-operator/**"
      - ".github/workflows/helm_lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint
        run: helm lint helm-charts/charts/simplyblock-operator

      - name: Template
        run: helm template simplyblock-operator helm-charts/charts/simplyblock-operator

      # The release packages the chart with its image tags rewritten, and the
      # rewrite is anchored to the shape of values.yaml. Running it here on a
      # copy fails the pull request that moves those keys, rather than the
      # release that would have published the old tags.
      - name: Release stamping
        run: |
          cp -R helm-charts/charts/simplyblock-operator "$RUNNER_TEMP/chart"
          helm-charts/scripts/stamp-release-version.sh "$RUNNER_TEMP/chart" v0.0.0-lint
