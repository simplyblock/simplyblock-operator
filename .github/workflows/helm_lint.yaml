name: "Helm: Lint"

on:
  push:
    branches:
      - main
    paths:
      - "helm-charts/charts/simplyblock-operator/**"
      - "helm-charts/scripts/**"
      - "csi-driver/charts/spdk-csi/latest/**"
      - ".github/workflows/helm_lint.yaml"
  pull_request:
    paths:
      - "helm-charts/charts/simplyblock-operator/**"
      - "helm-charts/scripts/**"
      - "csi-driver/charts/spdk-csi/latest/**"
      - ".github/workflows/helm_lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint
        run: helm lint helm-charts/charts/simplyblock-operator

      # --api-versions states a capability the render has no cluster to read.
      # TLS is on by default and the chart refuses a cluster that does not serve
      # cert-manager's API; a cluster-less render serves nothing, so the default
      # values cannot be rendered at all without saying so here.
      - name: Template
        run: >
          helm template simplyblock-operator helm-charts/charts/simplyblock-operator
          --api-versions cert-manager.io/v1

      - name: Required objects
        run: helm-charts/scripts/check-rendered-objects.sh

      - name: Value references
        run: |
          make -C operator yq
          helm-charts/scripts/check-values-references.sh
