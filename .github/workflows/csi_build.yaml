name: "CSI: Docker Build"

on:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (defaults to the branch/tag ref)"
        required: false
        type: string
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/simplyblock/spdkcsi
  ECR_IMAGE_NAME: public.ecr.aws/simply-block/spdkcsi
  QUAY_IMAGE_NAME: quay.io/simplyblock-io/spdkcsi
  INTERNAL_IMAGE_NAME: registry.simplyblock.ai/simplyblock/spdkcsi

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    # Quay.io ships customer-facing images, so only a release run (one that names
    # a version) logs in and pushes there.
    - name: Log in to container registries
      uses: ./.github/actions/registry-login
      with:
        dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        quay: ${{ inputs.version != '' }}
        quay-username: ${{ secrets.QUAY_USERNAME }}
        quay-password: ${{ secrets.QUAY_PASSWORD }}
        internal-username: ${{ secrets.INTERNAL_USERNAME }}
        internal-password: ${{ secrets.INTERNAL_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Quay.io is only listed on a release run, matching the login step above.
    - name: Determine target registries
      id: registries
      run: |
        {
          echo "images<<EOF"
          echo "${IMAGE_NAME}"
          echo "${ECR_IMAGE_NAME}"
          echo "${INTERNAL_IMAGE_NAME}"
          if [ -n "${{ inputs.version }}" ]; then
            echo "${QUAY_IMAGE_NAME}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.registries.outputs.images }}
        tags: |
          type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.event_name == 'release' || inputs.version != '' }}
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=${{ github.ref_name }}-,format=short,enable=${{ github.event_name == 'push' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: csi-driver/deploy/image/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Which of the tags just pushed the integration suite should run in. The
    # branch tag is the one that exists for every push, so the name is derived
    # the same way metadata-action derived the tag it pushed: every character a
    # Docker tag cannot hold becomes a dash, not only the slash.
    #
    # Matching it exactly is the whole point. Replacing slashes alone agreed with
    # metadata-action for every branch anybody had used, and disagreed the first
    # time one carried a "+": the suite was handed an image reference that was
    # both invalid and not the tag that had just been pushed, and it failed
    # fifteen minutes later on a kubelet that could not parse the name.
    - name: Name the image the integration suite runs
      id: image
      run: |
        tag="$(printf %s '${{ github.ref_name }}' | tr -c 'a-zA-Z0-9_.-' '-' | cut -c1-128)"
        tag="$(printf %s "$tag" | sed 's/^[^a-zA-Z0-9_]*//')"
        if [ -z "$tag" ]; then
          echo "::error::branch name ${{ github.ref_name }} sanitizes to an empty image tag"
          exit 1
        fi
        # Non-release runs never pushed to quay.io, so the suite pulls from
        # Docker Hub. It used to pull from ECR Public, which throttles an
        # anonymous pull per source address: the runner's own pulls are
        # authenticated, but the Talos nodes' kubelets are not, and they share
        # that address, so the shell pod of every volume-stack case failed to
        # start on 429 while the image itself was fine.
        if [ -n "${{ inputs.version }}" ]; then
          image_name="${QUAY_IMAGE_NAME}"
        else
          image_name="${IMAGE_NAME}"
        fi
        echo "ref=${image_name}:${tag}" >> "$GITHUB_OUTPUT"

  # The pNFS guest (csi-driver/deploy/pnfs-os) is tagged by the git tree of its
  # sources, pnfsos-<tree>, so a tag that already exists holds exactly this
  # guest. A buildroot build takes long, so it only runs for a tree that has
  # not been published yet, and every other run reuses the published guest.
  pnfs-os-tag:
    name: Resolve pNFS guest
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Compute the guest tag
      id: tag
      run: echo "tag=$(make -s --no-print-directory -C csi-driver pnfs-os-tag)" >> "$GITHUB_OUTPUT"

    - name: Check for a published guest
      id: exists
      run: |
        if docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

  # One job per architecture, both cross-compiled on an x86_64 host, which the
  # prebuilt SDK requires. Each pushes pnfsos-<tree>-<arch> and skips an
  # architecture a previous attempt already pushed, so rerunning after one of
  # them failed does not rebuild the other. Runs for the same tree and
  # architecture queue behind each other and the second one finds the image.
  pnfs-os:
    name: Build pNFS guest (${{ matrix.arch }})
    needs: pnfs-os-tag
    if: needs.pnfs-os-tag.outputs.exists != 'true'
    runs-on: [self-hosted, linux, x64]
    strategy:
      matrix:
        arch: [amd64, arm64]
    concurrency:
      group: pnfs-os-${{ needs.pnfs-os-tag.outputs.tag }}-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      GUEST_TAG: ${{ needs.pnfs-os-tag.outputs.tag }}
      ARCH: ${{ matrix.arch }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Log in to container registries
      uses: ./.github/actions/registry-login
      with:
        dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
        ecr: "false"
        internal: "false"

    - name: Check for a published architecture
      id: exists
      run: |
        if docker buildx imagetools inspect "${IMAGE_NAME}:${GUEST_TAG}-${ARCH}" > /dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      if: steps.exists.outputs.exists != 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      if: steps.exists.outputs.exists != 'true'
      run: |
        make -C csi-driver pnfs-os-image PNFS_OS_ARCHS="${ARCH}" \
          PNFS_OS_IMAGE="${IMAGE_NAME}:${GUEST_TAG}-${ARCH}" PNFS_OS_BUILDX_FLAGS=--push

  # The multi-architecture pnfsos-<tree> over both architectures, and on main
  # pnfsos-latest, which moves to the latest tree even when that tree was
  # published by an earlier run.
  pnfs-os-manifest:
    name: Publish pNFS guest
    needs: [pnfs-os-tag, pnfs-os]
    if: >-
      !cancelled() && (needs.pnfs-os.result == 'success' ||
      (needs.pnfs-os-tag.outputs.exists == 'true' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    env:
      GUEST_TAG: ${{ needs.pnfs-os-tag.outputs.tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Log in to container registries
      uses: ./.github/actions/registry-login
      with:
        dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
        ecr: "false"
        internal: "false"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Create the manifest
      if: needs.pnfs-os.result == 'success'
      run: |
        docker buildx imagetools create -t "${IMAGE_NAME}:${GUEST_TAG}" \
          "${IMAGE_NAME}:${GUEST_TAG}-amd64" "${IMAGE_NAME}:${GUEST_TAG}-arm64"

    - name: Move pnfsos-latest
      if: github.ref == 'refs/heads/main'
      run: docker buildx imagetools create -t "${IMAGE_NAME}:pnfsos-latest" "${IMAGE_NAME}:${GUEST_TAG}"

  # The pNFS metadata server image (design-pnfs-mds-vm.md §5.6): QEMU, the
  # pnfs-os guest with mds-agent written into it, mds-runner, and mds-proxy. Tagged like
  # the driver with a pnfs-mds- prefix in the same repository, which is the
  # tag the operator defaults spec.pnfs.mds.image to. It does not gate the
  # integration suite, which runs no pod-hosted metadata server. It builds on
  # the guest of this commit's tree, published either by this run or an earlier one.
  mds:
    name: Build MDS image
    needs: [pnfs-os-tag, pnfs-os-manifest]
    if: >-
      !cancelled() && (needs.pnfs-os-tag.outputs.exists == 'true' ||
      needs.pnfs-os-manifest.result == 'success')
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Log in to container registries
      uses: ./.github/actions/registry-login
      with:
        dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        quay: ${{ inputs.version != '' }}
        quay-username: ${{ secrets.QUAY_USERNAME }}
        quay-password: ${{ secrets.QUAY_PASSWORD }}
        internal-username: ${{ secrets.INTERNAL_USERNAME }}
        internal-password: ${{ secrets.INTERNAL_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine target registries
      id: registries
      run: |
        {
          echo "images<<EOF"
          echo "${IMAGE_NAME}"
          echo "${ECR_IMAGE_NAME}"
          echo "${INTERNAL_IMAGE_NAME}"
          if [ -n "${{ inputs.version }}" ]; then
            echo "${QUAY_IMAGE_NAME}"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.registries.outputs.images }}
        flavor: |
          latest=false
          prefix=pnfs-mds-
        tags: |
          type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.event_name == 'release' || inputs.version != '' }}
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=pnfs-mds-${{ github.ref_name }}-,format=short,enable=${{ github.event_name == 'push' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: csi-driver/deploy/image/Dockerfile.mds
        platforms: linux/amd64,linux/arm64
        build-args: |
          GUEST_IMAGE=${{ env.IMAGE_NAME }}:${{ needs.pnfs-os-tag.outputs.tag }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha,scope=mds
        cache-to: type=gha,mode=max,scope=mds

  # Ordered after the build so the stack is exercised in the image this run
  # produced. Without the ordering the suite runs against whatever tag it names
  # itself, and a package added to the driver image stays invisible to it until
  # somebody remembers to bump that name.
  integration:
    name: Integration
    needs: build
    uses: ./.github/workflows/integration_test.yaml
    with:
      csi_image: ${{ needs.build.outputs.image }}
    secrets: inherit
