name: "CSI: Docker Build"

on:
  push:
    branches: ['**']
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (defaults to the branch/tag ref)"
        required: false
        type: string
  workflow_dispatch:

env:
  IMAGE_NAME: docker.io/simplyblock/spdkcsi
  ECR_IMAGE_NAME: public.ecr.aws/simply-block/spdkcsi
  QUAY_IMAGE_NAME: quay.io/simplyblock-io/spdkcsi

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Quay.io
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.IMAGE_NAME }}
          ${{ env.ECR_IMAGE_NAME }}
          ${{ env.QUAY_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.event_name == 'release' || inputs.version != '' }}
          type=ref,event=branch
          type=ref,event=tag
          type=sha,prefix=${{ github.ref_name }}-,format=short,enable=${{ github.event_name == 'push' }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: csi-driver/deploy/image/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Which of the tags just pushed the integration suite should run in. The
    # branch tag is the one that exists for every push, and metadata-action
    # renders a ref into it by replacing the slashes a Docker tag cannot hold,
    # so the same substitution is made here rather than assuming a flat name.
    - name: Name the image the integration suite runs
      id: image
      run: |
        tag="$(printf %s '${{ github.ref_name }}' | tr '/' '-')"
        echo "ref=${QUAY_IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"

  # Ordered after the build so the stack is exercised in the image this run
  # produced. Without the ordering the suite runs against whatever tag it names
  # itself, and a package added to the driver image stays invisible to it until
  # somebody remembers to bump that name.
  integration:
    name: Integration
    needs: build
    uses: ./.github/workflows/integration_test.yaml
    with:
      csi_image: ${{ needs.build.outputs.image }}
    secrets: inherit
