name: "Control Center: Release"

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3); defaults to the triggering release"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

env:
  QUAY_IMAGE_BASE: quay.io/simplyblock-io/control-center
  QUAY_MOCK_IMAGE_BASE: quay.io/simplyblock-io/control-center-mock

jobs:
  release:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Until the console sources are committed (index.html and the .jsx files
      # at control-center/), there is no image to release — succeed with a
      # notice so the repo release pipeline is not blocked on the console.
      - name: Check for console sources
        id: sources
        run: |
          if [ -f control-center/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::control-center/index.html not present yet — skipping the console release"
          fi

      - name: Extract version
        id: version
        run: |
          TAG="${{ inputs.version || github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push multi-arch image to quay.io
        if: steps.sources.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: control-center
          file: control-center/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.QUAY_IMAGE_BASE }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=control-center
          cache-to: type=gha,mode=max,scope=control-center

      - name: Build and push multi-arch mock image to quay.io
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: control-center/mock
          file: control-center/mock/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.QUAY_MOCK_IMAGE_BASE }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=control-center-mock
          cache-to: type=gha,mode=max,scope=control-center-mock
