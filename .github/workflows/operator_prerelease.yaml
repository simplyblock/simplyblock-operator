name: "Operator: Pre-release"

# Publishes a pre-release bundle without a GitHub release or a git tag, so it
# can go to the Red Hat portal for testing. It runs the image half of
# repo_release.yaml for one version: the atlas gate, the CSI and operator images
# on Quay under that version, and the digest-pinned OLM bundle image. The bundle
# zip is kept as a workflow artifact instead of a release asset.
#
# Not run here: the GitHub release, the fleet and Control Center images, and the
# Helm chart publish. The Certified Operators Release workflow in
# simplyblock/release-automation then takes the bundle from its image with
# bundle-source: image.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pre-release version (e.g. v26.4.0-beta3.1); no tag or release is created"
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check version
        id: v
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a v-prefixed semver version (e.g. v26.4.0-beta3.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-atlas:
    name: Build atlas
    needs: setup
    uses: ./.github/workflows/atlas_test.yaml
    secrets: inherit

  # The operator derives the CSI driver's image from its own tag, so both are
  # published under the version.
  build-csi:
    name: Build csi
    needs: [setup, build-atlas]
    uses: ./.github/workflows/csi_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  build-operator:
    name: Build operator
    needs: [setup, build-atlas]
    uses: ./.github/workflows/operator_build.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
    secrets: inherit

  # The called workflow declares contents: write for the release upload, and a
  # reusable workflow cannot get more than its caller grants.
  release-operator:
    name: Bundle
    needs: [setup, build-csi, build-operator]
    permissions:
      contents: write
    uses: ./.github/workflows/operator_release.yaml
    with:
      version: ${{ needs.setup.outputs.version }}
      attach-release: false
    secrets: inherit
