name: "CSI: Docker Base Image"

on:
  schedule:
    - cron: '0 5 * * *'  # Daily at 5am
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csi-driver

    steps:
    - uses: actions/checkout@master

    - name: Log in to container registries
      uses: ./.github/actions/registry-login
      with:
        dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        internal-username: ${{ secrets.INTERNAL_USERNAME }}
        internal-password: ${{ secrets.INTERNAL_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build & Push
      run: |
        SHORT_SHA=$(echo ${{ env.SHA }} | head -c 8)
        docker buildx ls
        docker buildx create --name mybuilder --bootstrap --use
        docker buildx build --platform linux/amd64,linux/arm64 \
        -t simplyblock/spdkcsi:base_image \
        -t public.ecr.aws/simply-block/spdkcsi:base_image \
        -t registry.simplyblock.ai/simplyblock/spdkcsi:base_image \
        -f deploy/image/Dockerfile_base .. --push
        echo "::notice title=Docker.com::simplyblock/spdkcsi:base_image"
        echo "::notice title=AWS-ECR::public.ecr.aws/simply-block/spdkcsi:base_image"
        echo "::notice title=Internal::registry.simplyblock.ai/simplyblock/spdkcsi:base_image"

