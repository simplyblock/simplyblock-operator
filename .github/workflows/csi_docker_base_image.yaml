name: "CSI: Docker Base Image"

on:
  schedule:
    - cron: '0 5 * * *'  # Daily at 5am
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Image tag to push. Defaults to base_image, the shared tag every
          branch's own Dockerfile builds FROM -- pass a different one (e.g.
          a branch-scoped tag) to publish this ref's Dockerfile_base without
          moving what other branches already build against.
        required: false
        default: base_image

jobs:

  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csi-driver

    steps:
    - uses: actions/checkout@master

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Build & Push
      env:
        TAG: ${{ github.event.inputs.tag || 'base_image' }}
      run: |
        SHORT_SHA=$(echo ${{ env.SHA }} | head -c 8)
        docker buildx ls
        docker buildx create --name mybuilder --bootstrap --use
        docker buildx build --platform linux/amd64,linux/arm64 \
        -t simplyblock/spdkcsi:$TAG \
        -t public.ecr.aws/simply-block/spdkcsi:$TAG \
        -f deploy/image/Dockerfile_base .. --push
        echo "::notice title=Docker.com::simplyblock/spdkcsi:$TAG
        echo "::notice title=AWS-ECR::public.ecr.aws/simply-block/spdkcsi:$TAG

