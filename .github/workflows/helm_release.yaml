name: "Helm: Release"

# Packages the simplyblock-operator Helm chart and uploads it as the
# `helm-charts-operator` artifact. It does NOT open a PR or publish anything —
# merging and publishing the unified Helm repo is handled by the repo-global
# release workflow (repo_release.yaml).
#
# A run that names a version packages a release: the chart carries that version
# and the images that release built. A run without one packages the chart as the
# branch commits it, which is the moving `main` tag the development chart
# installs.

on:
  push:
    branches:
      - main
      - 'R[0-9]*'
    paths:
      - 'helm-charts/charts/simplyblock-operator/Chart.yaml'
  workflow_call:
    inputs:
      version:
        description: "Release tag (e.g. v26.2.7) the packaged chart names; empty packages the chart as committed"
        required: false
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # The committed values.yaml names the development images, so a release
      # rewrites the two tags it publishes before Helm reads them.
      - name: Stamp the release images into the chart
        if: inputs.version != ''
        run: |
          make -C operator yq
          helm-charts/scripts/stamp-release-version.sh \
            helm-charts/charts/simplyblock-operator "${{ inputs.version }}"

      - name: Package chart
        run: |
          RELEASE_TAG="${{ inputs.version }}"
          if [ -n "$RELEASE_TAG" ]; then
            # The chart version is semver, so it carries the release tag without
            # its leading "v," and appVersion states the release it installs.
            VERSION="${RELEASE_TAG#v}"
            set -- --version "$VERSION" --app-version "$VERSION"
          else
            VERSION="$(grep '^version:' helm-charts/charts/simplyblock-operator/Chart.yaml | awk '{print $2}' | tr -d '"')"
            set --
          fi
          mkdir -p "helm-charts/charts/$VERSION"
          helm package helm-charts/charts/simplyblock-operator \
            "$@" --destination "helm-charts/charts/$VERSION/"

      - name: Index chart repo
        run: helm repo index helm-charts/charts/ --url https://install.simplyblock.io/helm

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts-operator
          path: helm-charts/charts/
          retention-days: 7
