name: "Fleet: Docker Build"

# The fleet image carries both fleet binaries: the hub's fleet manager, which
# runs the site link's relay, and the member agent the fleet add-on deploys on
# every site (fleet/Dockerfile). Its build context is the repository root,
# because the fleet module resolves atlas-lib and the operator through local
# replace directives.

on:
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      version:
        description: "Image tag to publish (defaults to the branch ref)"
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-and-push:
    name: "Build and push (fleet)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: simplyblock/simplyblock-fleet
      ECR_IMAGE_NAME: simply-block/simplyblock-fleet
      QUAY_IMAGE_NAME: quay.io/simplyblock-io/simplyblock-fleet
      INTERNAL_IMAGE_NAME: registry.simplyblock.ai/simplyblock/simplyblock-fleet

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Quay.io ships customer-facing images, so only a release run (one that
      # names a version) logs in and pushes there.
      - name: Log in to container registries
        id: login
        uses: ./.github/actions/registry-login
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          quay: ${{ inputs.version != '' }}
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-password: ${{ secrets.QUAY_PASSWORD }}
          internal-username: ${{ secrets.INTERNAL_USERNAME }}
          internal-password: ${{ secrets.INTERNAL_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute image tag
        id: image_tag
        # The same sanitizing as the operator build: every character a Docker
        # tag does not admit becomes a dash, and a leading dash or dot goes.
        run: |
          version="${{ inputs.version || github.ref_name }}"
          tag="$(printf %s "$version" | tr -c 'a-zA-Z0-9_.-' '-' | cut -c1-128)"
          tag="$(printf %s "$tag" | sed 's/^[^a-zA-Z0-9_]*//')"
          if [ -z "$tag" ]; then
            echo "::error::branch name ${version} sanitizes to an empty image tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # The Dockerfile reads this as the OCI `version` label, which must not
          # carry the tag's leading "v."
          echo "label_version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Quay.io is only listed on a release run, matching the login step above.
      - name: Determine target tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${{ steps.image_tag.outputs.tag }}"
            echo "${{ steps.login.outputs.ecr-registry }}/${ECR_IMAGE_NAME}:${{ steps.image_tag.outputs.tag }}"
            echo "${INTERNAL_IMAGE_NAME}:${{ steps.image_tag.outputs.tag }}"
            if [ -n "${{ inputs.version }}" ]; then
              echo "${QUAY_IMAGE_NAME}:${{ steps.image_tag.outputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch fleet image (DockerHub + ECR + Quay + Internal)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: fleet/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image_tag.outputs.label_version }}
            RELEASE=1
          cache-from: type=gha,scope=fleet
          cache-to: type=gha,mode=max,scope=fleet
