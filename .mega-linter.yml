# Configuration file for MegaLinter, the aggregate lint gate this repository
# runs over every language it holds at once. What it enables, what it refuses to
# look at, and why each choice was made is recorded here. The per-linter rule
# sets live in the tool-native files beside it (revive.toml, .yamllint.yml,
# .markdownlint.yaml, .cspell.json, and .jscpd.json).
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation
---
# Report only. This gate is being adopted against a codebase that had never run
# it, so nothing here rewrites a file: findings are read, triaged, and fixed by
# hand. Revisit once the counts are down and the fixes are boring.
APPLY_FIXES: none

# If you use ENABLE variable, all other languages/formats/tooling-formats will
# be disabled by default
# ENABLE:

# If you use ENABLE_LINTERS variable, all other linters will be disabled by
# default
# ENABLE_LINTERS:

DISABLE_LINTERS:
  # Go is linted by revive here, and by nothing else. golangci-lint already runs
  # per module in repo_lint.yaml, where each module's own .golangci.yml is in
  # scope. MegaLinter would have to run it from the workspace root, where
  # neither config applies. That run enables revive too, with comment-spacings
  # and import-shadowing, so revive.toml is what this gate adds on top of it.
  - GO_GOLANGCI_LINT

  # Python is linted once, formatted once, type-checked once, and scanned once.
  # ruff subsumes flake8 and isort, and mypy answers the same question pyright
  # does. black and bandit stay. Seven overlapping tools over seventeen files
  # bought nothing but disagreement.
  - PYTHON_FLAKE8
  - PYTHON_ISORT
  - PYTHON_PYLINT
  - PYTHON_PYRIGHT

  # yamllint is the single YAML gate. Prettier's YAML opinions contradict
  # yamllint's indentation rules, so with both enabled one of them is always
  # wrong, and it cost 323 seconds of the first full run to say so.
  - YAML_PRETTIER

  # The only Ruby in this repository is csi-driver/scripts/ci/mdl_rules.rb, a
  # rule DSL for mdl rather than a program. rubocop spent 133 seconds on it.
  - RUBY_RUBOCOP

  # Vulnerability and secret scanning already have owners: operator_security.yaml
  # and csi_security.yaml both run trivy and grype, and kingfisher, secretlint,
  # and trufflehog stay enabled below to cover secrets. KICS overlaps checkov,
  # which is kept.
  - REPOSITORY_GRYPE
  - REPOSITORY_TRIVY
  - REPOSITORY_TRIVY_SBOM
  - REPOSITORY_DUSTILOCK
  - REPOSITORY_GITLEAKS
  - REPOSITORY_KICS

# DISABLE:
# - COPYPASTE # Uncomment to disable checks of excessive copy-pastes
# - SPELL # Uncomment to disable checks of spelling mistakes

SHOW_ELAPSED_TIME: true

# Paths no one edits by hand, and paths no general-purpose linter can read:
#
#   helm-charts/charts/<x.y.z>/       published release output
#   helm-charts/charts/index.yaml     the repository index beside it
#   .../simplyblock-operator/crds/    regenerated by `make helm-sync`
#   .../simplyblock-operator/charts/  vendored dependency charts
#   .../simplyblock-operator/templates/  Helm templates, which are not YAML
#                                     until they are rendered; helm_lint.yaml
#                                     is their gate
#   csi-driver/charts/spdk-csi/       excluded whole: it holds nothing but
#                                     released versions, `latest`, and the
#                                     index, and the chart source is elsewhere
#   operator/config/                  kubebuilder output, regenerated by
#                                     `make -C operator manifests generate`
#   operator/dist/                    the consolidated installer, generated
#   shared/openapi.json               exported by shared/export-openapi.py and
#                                     resynced by repo_openapi_sync.yaml
#   operator/docs/                    design documents and test plans, held to
#                                     the house style gate instead, whose rules
#                                     are this repository's own and disagree
#                                     with markdownlint's defaults
#   .claude/                          agent tooling, not shipped code, and
#                                     .claude/worktrees/ holds whole checkouts
#                                     of this repository that would otherwise be
#                                     scanned again as if they were source
#
# One regex, not a list. The configuration schema advertises both forms, but
# MegaLinter 9.4.0 accepts only a string: it concatenates the global value into
# a log message, and passes a per-linter value straight to re.compile. Both
# raise a TypeError on a list. Matched with re.search against each path, so the
# trailing slashes anchor a pattern to a directory rather than to a prefix of a
# sibling's name.
FILTER_REGEX_EXCLUDE: '(helm-charts/charts/([0-9]+\.[0-9]+\.[0-9]+/|index\.yaml|simplyblock-operator/(crds|charts|templates)/)|csi-driver/charts/spdk-csi/|operator/(config|dist|docs)/|shared/openapi\.json|\.claude/)'

# cspell reads prose. Pointed at Go it reports the import aliases the Kubernetes
# ecosystem is built from (metav, corev, simplyblockv, apimachinery) by the
# thousand, which is a dictionary of this repository's own vocabulary rather
# than a list of mistakes. Identifiers are covered by revive's naming rules, and
# repo_codespell.yaml spell-checks the whole tree independently.
SPELL_CSPELL_FILE_EXTENSIONS:
  - .md
  - .txt

# checkov is scoped in .checkov.yml, not here. It runs in project mode, so
# MegaLinter hands it `--directory .` and never builds a file list, and
# FILTER_REGEX_EXCLUDE above is applied while building that list: it never
# reaches checkov, and 286 of its 649 findings were in paths excluded everywhere
# else. Project mode is still the right mode, because it is what lets checkov
# render the Helm charts before scanning them and run the CKV2_* checks that
# reason across resources, so .checkov.yml narrows it with skip-path instead.
#
# Three ways of doing it here were tried and are recorded so they are not tried
# again. A `directory:` key in .checkov.yml is ignored, because the
# command-line `--directory` overrides it.
# REPOSITORY_CHECKOV_FORWARD_EXCLUDED_DIRECTORIES defaults to true and is a
# no-op: with a directory named in EXCLUDED_DIRECTORIES, checkov scanned it
# anyway and the command carried no --skip-path. And scoping by repeating
# `--directory` works but reports every finding once per directory, which
# turned 592 distinct findings into 1364.

# Report without blocking, for now. The tree carries roughly a thousand
# findings, so a gate that failed on them would fail every pull
# request from the day it landed and teach everyone to ignore it. It reports
# into the checks tab and the uploaded artifact instead. Remove this line once
# the backlog is worked down. That is the point at which this becomes a gate.
DISABLE_ERRORS: true
