<!doctype html>
<!-- The support tool's one page: upload a support bundle, read its analysis,
     and build a ClusterDeploymentConfig. app.js renders every view into
     #view from the server's JSON. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simplyblock support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">simplyblock <span>support</span></div>
    <div id="bundle-name" class="bundle-name"></div>
    <label class="upload">
      <input id="file" type="file" accept=".tar.gz,.tgz,application/gzip">
      <span>Open bundle…</span>
    </label>
  </header>
  <nav id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="workers" data-bundle hidden>Workers</button>
    <button data-tab="cluster" data-bundle hidden>Cluster</button>
    <button data-tab="cdc" data-bundle hidden>ClusterDeploymentConfig</button>
    <button data-tab="editor" data-bundle hidden>Editor</button>
    <button data-tab="run" class="tool">Discovery run</button>
    <button data-tab="helm">Helm values</button>
  </nav>
  <main id="view">
    <section id="drop" class="drop">
      <h1>Open a support bundle</h1>
      <p>Drop the <code>simplyblock-bundle-*.tar.gz</code> a customer collected here, or choose it
        with <em>Open bundle…</em>.</p>
      <p class="muted">The bundle stays on this machine: it is read by the server you started,
        held in memory, and never sent anywhere else.</p>
      <div id="collect-help"></div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script src="app.js"></script>
</body>
</html>
