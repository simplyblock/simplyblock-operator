# Security headers.
#
# nginx inherits add_header from an outer level ONLY when the current level
# declares none of its own — and `always` does not change that. Every location
# that sets its own Cache-Control would therefore silently drop all of these,
# including the one that serves the document. So they live in a snippet and are
# included everywhere they must apply, rather than being declared once at
# server level and quietly lost.
#
# unsafe-eval is required because the document is transpiled in the browser by
# Babel. Replacing that with a build step at image build time is what removes
# it; nothing else here needs relaxing.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;
