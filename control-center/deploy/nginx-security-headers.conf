# Security headers.
#
# nginx inherits add_header from an outer level ONLY when the current level
# declares none of its own — and `always` does not change that. Every location
# that sets its own Cache-Control would therefore silently drop all of these,
# including the one that serves the document. So they live in a snippet and are
# included everywhere they must apply, rather than being declared once at
# server level and quietly lost.
#
# No unsafe-eval: the JSX is precompiled at image build time (dist/app.js).
# unsafe-inline covers the config bootstrap and React's inline styles.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;
