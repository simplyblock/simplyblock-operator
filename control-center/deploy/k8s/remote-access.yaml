# Remote access for a hub's Control Center, applied on the cluster that a hub
# reaches as a context (see contexts-example.yaml on the hub side). The
# plain-manifest equivalent of the chart's controlCenter.remoteAccess.enabled.
#
# A ServiceAccount with the console's ClusterRole and a long-lived token Secret.
# The ClusterRole is the one in rbac.yaml: a hub's console acts on this cluster
# with exactly the authority it has at home. Keep the two rule lists identical,
# or bind this ServiceAccount to the ClusterRole from rbac.yaml instead if that
# file is applied here anyway.
#
# Copy the credential to the hub:
#
#   kubectl -n simplyblock get secret simplyblock-control-center-remote-token \
#     -o jsonpath='{.data.token}' | base64 -d > token
#   kubectl -n simplyblock get secret simplyblock-control-center-remote-token \
#     -o jsonpath='{.data.ca\.crt}' | base64 -d > ca.crt
#
# The same token is accepted by this cluster's control plane v2 API, which
# takes a ServiceAccount token of the cluster it runs in. The Secret is the
# legacy long-lived kind because the hub cannot request a projected token from
# here; rotate it by deleting the Secret (the token controller re-issues it)
# and copying the new token over.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simplyblock-control-center-remote
  namespace: simplyblock
  labels:
    app.kubernetes.io/name: simplyblock-control-center
    app.kubernetes.io/component: ui-remote-access
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: simplyblock-control-center-remote-token
  namespace: simplyblock
  labels:
    app.kubernetes.io/name: simplyblock-control-center
    app.kubernetes.io/component: ui-remote-access
  annotations:
    kubernetes.io/service-account.name: simplyblock-control-center-remote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: simplyblock-control-center-remote
  labels:
    app.kubernetes.io/name: simplyblock-control-center
    app.kubernetes.io/component: ui-remote-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # rbac.yaml, applied on this cluster too: the console's rules, unchanged.
  name: simplyblock-control-center
subjects:
  - kind: ServiceAccount
    name: simplyblock-control-center-remote
    namespace: simplyblock
