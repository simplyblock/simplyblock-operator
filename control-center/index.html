<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simplyblock Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f9fafc;--panel3:#eceff4;--line:#e3e7ed;--line2:#ccd3dc;--text:#0f1a28;--dim:#5c6879;--dim2:#8b95a4;--accent:#2776ea;--accent-soft:#2776ea14;--accent-line:#2776ea55;--ok:#1a8f4d;--warn:#b57604;--bad:#cc2f2f;--idle:#94a0af;--info:#2776ea;--alert:#d4621a;--ro:#7a4de0;--head:#101d2f;--head-line:#22334a;--head-text:#e8eef7;--head-dim:#93a3b8;--shadow:0 1px 2px #0f1a2810;--grid:340px;color-scheme:light}
[data-theme="dark"]{--bg:#0c1016;--panel:#141a22;--panel2:#19202a;--panel3:#222b37;--line:#242d39;--line2:#35404f;--text:#e6edf6;--dim:#98a4b4;--dim2:#6c7788;--accent:#5b9dfb;--accent-soft:#5b9dfb1c;--accent-line:#5b9dfb66;--ok:#40c47a;--warn:#e0a53a;--bad:#f2665f;--idle:#7b8494;--info:#5b9dfb;--alert:#ff9450;--ro:#a98bff;--head:#0a0e14;--head-line:#232c38;--head-text:#e6edf6;--head-dim:#8d9aab;--shadow:0 1px 2px #0006;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
#root{height:100%}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-ligatures:none}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100%;min-height:0}
.topbar{display:flex;align-items:center;gap:16px;padding:0 16px;height:50px;background:var(--head);border-bottom:1px solid var(--head-line);flex:none;color:var(--head-text)}
.logo{height:19px;width:auto;display:block}
.logofb{font-weight:700;font-size:15px;letter-spacing:-.02em;color:#fff}
.prod{font-size:12px;color:var(--head-dim);padding-left:14px;margin-left:2px;border-left:1px solid var(--head-line);white-space:nowrap}
.switcher{position:relative}
.swbtn{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 11px;border:1px solid var(--head-line);border-radius:6px;background:#ffffff0f;font-size:12px;color:var(--head-text);white-space:nowrap}
.swbtn:hover{background:#ffffff1c}
.swbtn .car{color:var(--head-dim);font-size:9px}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:300px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:5px;z-index:60;box-shadow:0 16px 40px #0f1a2833;color:var(--text)}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;text-align:left;font-size:12px}
.menu-item:hover{background:var(--panel3)}
.menu-item.on{background:var(--accent-soft)}
.menu-lbl{padding:8px 9px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.spacer{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;font-size:11.5px;color:var(--head-dim)}
.tbtn:hover{background:#ffffff14;color:var(--head-text)}
.env{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--head-dim);padding:3px 9px 3px 8px;border:1px solid var(--head-line);border-radius:20px;white-space:nowrap}
.pulse{width:6px;height:6px;border-radius:50%;background:#27ae60;animation:p 2.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #27ae6066}70%{box-shadow:0 0 0 7px #27ae6000}100%{box-shadow:0 0 0 0 #27ae6000}}
.avatar{width:26px;height:26px;border-radius:50%;background:#2776ea;color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:600;letter-spacing:.02em}

.crumbbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.crumbbar::-webkit-scrollbar{display:none}
.crumbs{display:flex;align-items:center;gap:2px;flex:none}
.crumb{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:5px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.crumb:hover{background:var(--panel3);color:var(--text)}
.crumb.cur{color:var(--text);font-weight:600;cursor:default}
.crumb.cur:hover{background:transparent}
.crumb .ic{color:var(--dim2);display:flex}
.crumb.cur .ic{color:var(--accent)}
.csep{color:var(--line2);flex:none;user-select:none;display:flex}
.apihint{margin-left:auto;font-size:10.5px;color:var(--dim2);background:var(--panel3);padding:3px 8px;border-radius:5px;white-space:nowrap;flex:none;font-family:'IBM Plex Mono',monospace;max-width:min(46ch,42vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}

.toolbar{display:flex;align-items:center;gap:8px;padding:12px 16px 10px;flex:none;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:0 9px;height:30px;min-width:236px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{background:none;border:none;outline:none;color:var(--text);font:inherit;font-size:12px;width:100%}
.search input::placeholder{color:var(--dim2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:11.5px;color:var(--dim);box-shadow:var(--shadow);white-space:nowrap;flex:none}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{border-color:var(--accent-line);color:var(--text);background:var(--accent-soft)}
.chip .n{font-size:10.5px;color:var(--dim2);font-family:'IBM Plex Mono',monospace}
.chip.on .n{color:var(--accent)}
.sel{height:30px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;color:var(--text);font:inherit;font-size:12px;padding:0 7px;outline:none;box-shadow:var(--shadow)}
.sel:focus{border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;height:30px;box-shadow:var(--shadow)}
.seg button{padding:0 9px;font-size:11px;color:var(--dim);background:var(--panel);white-space:nowrap}
.seg button.on{background:var(--panel3);color:var(--text);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.tlabel{font-size:11px;color:var(--dim2);letter-spacing:.04em;text-transform:uppercase}

.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--grid),1fr));gap:11px}

.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px 0;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:border-color .13s,box-shadow .13s,transform .13s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,transparent)}
.tile:hover{border-color:var(--line2);box-shadow:0 4px 14px #0f1a2814;transform:translateY(-1px)}
[data-theme="dark"] .tile:hover{box-shadow:0 4px 16px #0008}
.th{display:flex;align-items:flex-start;gap:9px}
.tname{font-weight:600;font-size:13.5px;letter-spacing:-.008em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsub{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;letter-spacing:.03em;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;white-space:nowrap;font-weight:500}
.badge.k8s{color:#3268c4;border-color:#3268c455;background:#3268c40f}
[data-theme="dark"] .badge.k8s{color:#7fb0ff;border-color:#7fb0ff44;background:#7fb0ff12}
.badge.dk{color:#0a6e8f;border-color:#0a6e8f4d;background:#0a6e8f0f}
[data-theme="dark"] .badge.dk{color:#66c6e6;border-color:#66c6e644;background:#66c6e612}
.uuid{display:flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim2);margin-top:3px;white-space:nowrap}
.uuid button{opacity:0;color:var(--dim2);display:flex;padding:2px;border-radius:3px}
.tile:hover .uuid button,.uuid button.done,.card .uuid button{opacity:1}
.uuid button:hover{color:var(--accent);background:var(--panel3)}

.tl{display:inline-flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;font-weight:500}
.tl .d{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 20%,transparent)}
.tl.blink .d{animation:bl 1.4s ease-in-out infinite}
@keyframes bl{50%{opacity:.28}}
.tl.sm .d{width:7px;height:7px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 20%,transparent)}

.capwrap{margin-top:10px}
.caprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;color:var(--dim);margin-bottom:5px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.capval{font-family:'IBM Plex Mono',monospace;color:var(--text);font-size:11.5px;text-transform:none;letter-spacing:0;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--panel3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--bc,var(--accent));transition:width .5s}

.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.met{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px 5px}
.met .k{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.rw{display:flex;gap:11px;margin-top:2px}
.rw>div{display:flex;flex-direction:column;line-height:1.25}
.rw span{font-size:9px;color:var(--dim2);letter-spacing:.06em}
.rw b{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;white-space:nowrap}

.tfoot{display:flex;align-items:center;gap:1px;margin:10px -12px 0;padding:0 5px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.fbtn{display:flex;align-items:center;gap:6px;padding:8px 7px;font-size:11.5px;color:var(--dim);border-radius:5px;min-width:0;flex-shrink:1}
.fbtn>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn:hover{color:var(--accent)}
.fbtn b{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--text);font-size:11px}
.fbtn:hover b{color:var(--accent)}
.fbtn.det{margin-left:auto;flex-shrink:0}
.fbtn[disabled]{opacity:.4;cursor:not-allowed}

.labels{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.lab{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-family:'IBM Plex Mono',monospace;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab i{font-style:normal;color:var(--dim2)}
.lab.link{cursor:pointer}
.lab.link:hover{border-color:var(--accent-line);color:var(--accent)}
.lab.wide{display:flex;margin-top:8px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lab.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.lab i{font-style:normal;color:var(--dim2)}

.sech{display:flex;align-items:center;gap:10px;margin:18px 0 11px}
.sech h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:600;white-space:nowrap}
.sech .ln{flex:1;height:1px;background:var(--line)}
.count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2)}

.dhead{display:flex;align-items:flex-start;gap:14px;padding:18px 0 15px;flex-wrap:wrap}
.dhead h1{margin:0;font-size:21px;letter-spacing:-.02em;font-weight:600}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:12px;margin-top:12px;align-items:start}
@media(max-width:1000px){.dcols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card>h3{margin:0;padding:10px 13px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);font-weight:600}
.card>.bd{padding:12px 13px}
.props{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin:0}
.props dt{padding:6px 14px 6px 0;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap}
.props dd{margin:0;padding:6px 0;font-size:12px;border-bottom:1px solid var(--line);font-family:'IBM Plex Mono',monospace;text-align:right;overflow-wrap:anywhere}
.props>dt:nth-last-of-type(1),.props>dd:nth-last-of-type(1){border-bottom:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{min-width:0}.stat .v{font-family:'IBM Plex Mono',monospace;font-size:18px;margin-top:3px;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.stat .v.md{font-size:15px}.stat .v.sm{font-size:13px;line-height:1.3}.stat .v.xs{font-size:11.5px;line-height:1.35}
.stat .s{font-size:10.5px;color:var(--dim);margin-top:1px}
.navcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}
.navcard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 13px;text-align:left;box-shadow:var(--shadow);transition:border-color .13s,box-shadow .13s}
.navcard:hover{border-color:var(--accent-line);box-shadow:0 3px 12px #2776ea1f}
.navcard .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.navcard .sb{font-size:10.5px;color:var(--dim);margin-top:2px}
.navcard .c{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--dim)}
.navcard:hover .c{color:var(--accent)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:64px 20px;color:var(--dim2);text-align:center}
.empty b{color:var(--dim);font-weight:600;font-size:14px}
.skel{background:var(--panel);border:1px solid var(--line);border-radius:8px;height:214px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#0f1a2809,transparent);animation:sk 1.4s infinite}
[data-theme="dark"] .skel::after{background:linear-gradient(90deg,transparent,#ffffff0a,transparent)}
@keyframes sk{to{transform:translateX(100%)}}
.banner{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--bad) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);color:var(--bad);border-radius:7px;padding:9px 12px;font-size:12px;margin-bottom:11px}
.banner b{color:var(--text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--head);color:var(--head-text);padding:8px 14px;border-radius:7px;font-size:12px;z-index:99;box-shadow:0 12px 30px #0f1a2840}
.qos{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.nolim{font-size:10.5px;color:var(--dim2);margin-top:9px}
.spark{display:block;overflow:visible}
.kebab{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;color:var(--dim2);flex:none}
.kebab:hover{background:var(--panel3);color:var(--text)}
.sockets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sock{display:flex;align-items:center;gap:8px;font-size:10.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.sock .sk{font-family:'IBM Plex Mono',monospace;color:var(--dim2);letter-spacing:.04em;flex:none;white-space:nowrap}
.sock .sv{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sock .sv em{font-style:normal;color:var(--dim2)}
.sock .pips{display:flex;gap:3px;margin-left:auto;flex:none}
.sock .pips i{width:6px;height:12px;border-radius:2px;background:var(--line2);display:block}
.sock .pips i.on{background:var(--accent)}
.kv{display:flex;flex-wrap:wrap;gap:12px;margin-top:11px}
.kv>div{display:flex;flex-direction:column;line-height:1.3}
.kv span{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);white-space:nowrap}
.kv b{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;white-space:nowrap}
.bucket{display:flex;align-items:center;gap:6px;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rettable{margin-top:10px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rethead,.retrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:4px 8px;font-size:10.5px;white-space:nowrap}
.rethead span:not(:first-child),.retrow b{text-align:right;min-width:34px}
.retrow.tot{background:var(--panel2);color:var(--dim2);letter-spacing:.05em;text-transform:uppercase;font-size:9.5px}
.retrow.tot b{text-transform:none;letter-spacing:0;font-size:10.5px}
.schedrow.head{padding:0 2px 3px}
.schedrow.head .sl{flex:1;text-align:left}
.chainbar{display:flex;gap:2px;margin-top:10px;height:8px}
.chainbar i{display:block;border-radius:2px;background:var(--accent);min-width:4px}
.chainbar i.full{background:var(--ok)}
.chainbar i.delta{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.rettable.two .rethead,.rettable.two .retrow{grid-template-columns:1fr auto}
.rethead{background:var(--panel2);color:var(--dim2);letter-spacing:.05em;text-transform:uppercase;font-size:9.5px}
.retrow{border-top:1px solid var(--line);color:var(--dim)}
.retrow b{font-family:'IBM Plex Mono',monospace;color:var(--text);font-weight:500}
.scopepill{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px dashed var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:6px;font-size:11.5px;white-space:nowrap;flex:none}
.dt{width:100%;border-collapse:collapse;font-size:11.5px}
.dt th{text-align:left;font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:7px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr:hover{background:var(--panel2)}
.code{font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;overflow-x:auto;white-space:pre;color:var(--dim)}
.fmenu{position:fixed;min-width:232px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:5px;z-index:90;box-shadow:0 18px 44px #0f1a2833}
[data-theme="dark"] .fmenu,[data-theme="dark"] .menu{box-shadow:0 18px 44px #000a}
.fmenu .menu-item.danger{color:var(--bad)}
.fmenu .menu-item[disabled]{opacity:.42;cursor:not-allowed}
.ovl{position:fixed;inset:0;background:#0f1a2866;backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:20px}
[data-theme="dark"] .ovl{background:#000a}
.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:11px;box-shadow:0 24px 70px #0f1a2840;overflow:hidden;max-height:92vh;display:flex;flex-direction:column}

.finput.sm{height:27px;font-size:11.5px;padding:0 6px;width:auto;flex:1;min-width:60px}
.schedadd{display:flex;align-items:center;gap:6px;width:100%;padding:5px 7px;border-radius:5px;font-size:11.5px;color:var(--accent);border:1px dashed var(--accent-line)}
.schedadd:hover{background:var(--accent-soft)}
.lab.wide{display:flex;width:100%;margin-top:9px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:12.5px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .tn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim2)}
.ptools{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel2)}
.live{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim2);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:p 2.4s infinite}
.srctag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--warn);border:1px dashed color-mix(in srgb,var(--warn) 45%,transparent);border-radius:4px;padding:1px 6px;white-space:nowrap;letter-spacing:.02em;text-transform:none;font-weight:400}
.logstream{overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--panel)}
.lrow{display:flex;gap:10px;padding:3px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.lrow:hover{background:var(--panel2)}
.lts{color:var(--dim2);flex:none;font-size:10.5px}
.llvl{flex:none;width:56px;font-size:10px;letter-spacing:.05em;font-weight:600}
.lobj{flex:none;color:var(--accent);font-size:10.5px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmsgtxt{color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.lmsg{padding:22px 14px;text-align:center;color:var(--dim2);font-size:12px;font-family:Inter,sans-serif}
.alloc{margin-bottom:9px}
.ah{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;color:var(--dim);margin-bottom:4px;gap:8px;white-space:nowrap}
.grouplbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);margin:12px 0 8px;font-weight:600}
.grouplbl em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--dim2)}
.tile.static{cursor:default}
.tile.static:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
.corerow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.corerow:last-child{border-bottom:none}
.corelbl{width:64px;flex:none;font-size:11px;color:var(--dim2);padding-top:2px}
.corethreads{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}
.thread .ah{font-size:10.5px}
.tstat{display:inline-flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;color:var(--c)}
.tstat i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.xpand{display:grid;place-items:center;width:20px;height:20px;border-radius:4px;color:var(--dim2)}
.xpand:hover{background:var(--panel3);color:var(--text)}
.dt.tasks td{vertical-align:top;padding-top:9px;padding-bottom:9px}
.subrow{background:var(--panel2)}
.subrow td{font-size:11px;padding-top:5px;padding-bottom:5px}
.smarthead{display:flex;flex-wrap:wrap;gap:22px;padding:12px 12px 11px;border-bottom:1px solid var(--line)}
.smarthead>div{display:flex;flex-direction:column;line-height:1.3}
.smarthead span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.smarthead b{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.msbox{border:1px solid var(--line2);border-radius:6px;max-height:190px;overflow-y:auto;overflow-x:hidden;background:var(--panel2)}
.msrow{display:flex;align-items:flex-start;gap:9px;width:100%;padding:6px 9px;font-size:11.5px;text-align:left;border-bottom:1px solid var(--line);line-height:1.4}
.msrow .mono{overflow-wrap:anywhere}
.msrow:last-child{border-bottom:none}
.msrow:hover{background:var(--panel3)}
.msbox-i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.msrow.on .msbox-i{background:var(--accent);border-color:var(--accent)}
.card>h3 .chip{text-transform:none;letter-spacing:0}
/* access control */
.idmenu{position:absolute;right:0;top:36px;width:360px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #0f1a2833;z-index:60;font-size:12.5px;color:var(--text)}
.idhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.idhead b{font-size:13.5px}.idhead .mono{font-size:11px;color:var(--dim)}
.idsec{padding:10px 14px;border-bottom:1px solid var(--line)}.idsec:last-child{border-bottom:0}
.idsec h4{margin:0 0 7px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);font-weight:600}
.idrole{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}.idrole:first-of-type{border-top:0}
.idrole b{font-family:'IBM Plex Mono',monospace;font-weight:500}.idrole .mono{font-size:11px;color:var(--dim)}.idrole span:last-child{grid-column:1/-1;font-size:11px}
.idpick{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:6px 4px;border-radius:6px;color:var(--text);cursor:pointer;font:inherit;font-size:12px}
.idpick:hover{background:var(--panel2)}.idpick.on{background:var(--accent-soft);color:var(--accent)}
.avatar.sm{width:22px;height:22px;font-size:9px}
.rights{width:100%}.rights th{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;width:44px}.rights th:first-child{text-align:left;width:auto}
.rights td{text-align:center;padding:6px 4px}.rights td:first-child{text-align:left}.rights td .sub{font-size:10.5px;color:var(--dim2);margin-top:1px}
.rights td.na{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--panel3) 4px 5px)}
.rbit{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);color:#fff;padding:0;cursor:default}
button.rbit{cursor:pointer}button.rbit:hover{border-color:var(--accent)}.rbit.on{background:var(--accent);border-color:var(--accent)}
.rolelist{display:flex;flex-direction:column;gap:8px}
.rolehead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer;text-align:left}
.rolehead .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rolehead b{font-weight:500}
.card.role.open .rolehead{border-bottom:1px solid var(--line)}
.roleacts{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.card.editor{border-color:var(--accent-line);margin-bottom:12px}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}.frow .fl{flex:1;min-width:180px}
.fl .sub{display:block;font-size:11px;color:var(--dim2);margin-top:3px;font-weight:400}
.facts{display:flex;align-items:center;gap:8px;margin-top:12px}.facts .spacer{flex:1}
.ferr{display:flex;align-items:center;gap:6px;color:var(--bad);font-size:12px;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;height:30px}
.seg button{background:var(--panel);border:0;padding:0 12px;font:inherit;font-size:12px;color:var(--dim);cursor:pointer}.seg button.on{background:var(--accent);color:#fff}
</style>
